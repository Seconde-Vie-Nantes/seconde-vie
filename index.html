<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seconde Vie – Atelier</title>
<link rel="icon" href="logo.png">
<style>
:root{--bg:#f2f4f1;--surf:#fff;--ink:#17261f;--mut:#5d6b64;--line:#dfe4e0;--brand:#1f4d3f;--bad:#b3261e;--ok:#22703f;--warn:#b86e00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:480px;margin:0 auto;padding:20px 20px 100px;width:100%}
.card,.modal .card{width:100%}
img{max-width:100%}
input,select,textarea,button{max-width:100%}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:17px;margin:14px 0 8px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.m{color:var(--mut);font-size:13px}
.t{font-weight:600}
span.chip{cursor:default}
button:not(:disabled),.card[onclick]{transition:transform .15s,box-shadow .15s}
button:not(:disabled):hover,.card[onclick]:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line);white-space:nowrap;border:0;cursor:pointer;font-family:inherit}
.late{background:#fde4e1;color:var(--bad)}
.ok{background:#def3e5;color:var(--ok)}
.warn{background:#fff1d6;color:var(--warn)}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--bg);padding:2px 6px;border-radius:6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px}
label{display:block;font-size:13px;font-weight:600;margin:8px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;border:0;background:var(--brand);color:#fff;font-family:inherit;font-weight:600;font-size:15px;padding:12px;border-radius:12px;margin-top:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.small{width:auto;padding:7px 12px;margin:0;font-size:13px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0}
.hide{display:none!important}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom);background:var(--surf);border-top:1px solid var(--line);box-shadow:0 100px 0 0 var(--surf);display:flex;z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 2px;font-family:inherit;font-weight:600;font-size:12px;color:var(--mut);cursor:pointer}
nav button.on{color:var(--brand)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:360px;width:100%;margin:0}
.fb-wrap{position:fixed;left:14px;bottom:14px;z-index:15}
.fb-wrap.rep{bottom:72px}
.fb-panel{position:fixed;left:14px;bottom:80px;width:300px;max-width:calc(100% - 28px);background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:25}
.fb-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:move;user-select:none;touch-action:none;font-weight:600}
.fb-body{padding:12px}
.fb-close{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--mut);padding:0 4px}
.fb-btn{width:52px;height:52px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
.fb-x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.fb-edge{border:0;background:var(--brand);color:#fff;width:22px;height:44px;border-radius:0 10px 10px 0;font-size:20px;line-height:1;padding:0;cursor:pointer;box-shadow:2px 2px 8px rgba(0,0,0,.2)}
.fb-pill{border:0;background:var(--brand);color:#fff;font-family:inherit;font-weight:600;font-size:12px;padding:6px 12px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.flash{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:40;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;z-index:30;max-width:90%;font-size:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav id="nav" class="hide"></nav>
<div id="modal" class="modal hide"></div>
<div id="fbWrap" class="fb-wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const RECOVERY_LINK = /type=recovery/.test(location.hash);
const SB = supabase.createClient("https://bagucelglclcssoclyaw.supabase.co", "sb_publishable_AMjguQV7hN0iXFLhhUhIiw_kgsK9B3O");
const MAIL = "seconde.vie.nantes.44@gmail.com";
const STEPS = ["Devis en cours", "En cours", "Terminé", "Remis"];
const lblS = s => s === "Devis en cours" ? "Devis" : s;
const PST = ["À commander", "Commandé", "Réservée"];
function pstOpts(p){
  const list = p.statut === "À réserver" ? [...PST, "À réserver"] : PST;
  return list.map(x => `<option ${x === p.statut ? "selected" : ""}>${x}</option>`).join("");
}
const PUCES = [["Puce Switch V1","Switch V1"],["Puce Switch V2","Switch V2"],["Puce Switch Lite","Switch Lite"],["Puce Switch OLED","Switch OLED"]];
// Clé API Google Maps (Places). Vide = pas d’autocomplétion, seul le bouton « Chercher sur Google Maps » reste.
const GMAPS_KEY = "";
const REP_NAV = [["dossiers","Réparations et ventes"],["clients","Clients"],["new","Nouvelle prestation"],["newvente","Nouvelle vente"],["ventes","Ventes"],["avis","Suggestions & Bugs"],["stock","Stock"],["catalogue","Réparations & Mods"]];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fullName = c => [c && c.prenom, c && c.nom].filter(Boolean).join(" ") || "Sans nom";
const nz = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const fr = d => d ? new Date(d + "T00:00").toLocaleDateString("fr-FR") : "–";
function left(d){ if(!d) return null; const e = new Date(d + "T00:00"), t = new Date(); t.setHours(0,0,0,0); return Math.round((e - t) / 864e5); }
function jours(n){ return n == null ? "" : n < 0 ? "Délai dépassé" : n == 0 ? "aujourd’hui" : n + (n > 1 ? " jours restants" : " jour restant"); }
function pcs(id){ return S.pieces.filter(p => p.dossier_id === id); }

let S = {dossiers:[], pieces:[], clients:[], stock:[], inv:[], devices:[], catalogue:[], sav:[], feedback:[], ventes:[], stockApp:[]};
let ME = null, ROLE = null, VIEW = "dossiers", DOSSIER = null, CM = "login", RECOVERY = RECOVERY_LINK;

function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function msgErr(e){
  const m = e.message || "";
  if (e.code === "23505" || /duplicate key/.test(m)) return "Ce client existe déjà (même téléphone ou email).";
  if (/Invalid login credentials/.test(m)) return "Email ou mot de passe incorrect.";
  if (/already registered/.test(m)) return "Un compte existe déjà avec cet email : utilise « J’ai déjà un compte ».";
  return m;
}
function showModal(html){ $("modal").innerHTML = '<div class="card">' + html + '</div>'; $("modal").classList.remove("hide"); }
function closeModal(){ $("modal").classList.add("hide"); }
function showDup(name){
  showModal(`<div class="t" style="font-size:18px">Compte déjà existant</div>
  <p class="m">Un compte existe déjà avec ce téléphone ou cet email${name ? " (" + esc(name) + ")" : ""}.</p>
  <a class="btn" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box" href="mailto:${MAIL}?subject=${encodeURIComponent("Compte déjà existant")}">Envoyer un mail à ${MAIL}</a>
  <button class="btn ghost" onclick="closeModal()">Fermer</button>`);
}

/* ---------- Données ---------- */
async function loadAll(){
  const q = [
    SB.from("dossiers").select("*, clients(prenom,nom)").order("created_at", {ascending:false}),
    SB.from("pieces_dossier").select("*")
  ];
  if (ROLE === "rep") q.push(SB.from("clients").select("*").order("nom"), SB.from("stock").select("*").order("sku"), SB.from("invitations").select("*"));
  else q.push(SB.from("clients").select("*"));
  const r = await Promise.all(q);
  const bad = r.find(x => x.error); if (bad) throw bad.error;
  S.dossiers = r[0].data; S.pieces = r[1].data; S.clients = r[2].data;
  if (ROLE === "rep"){ S.stock = r[3].data; S.inv = r[4].data; }
  const dv = await SB.from("devices").select("*");
  if (dv.error) throw dv.error;
  S.devices = dv.data;
  if (ROLE === "rep") { const cg = await SB.from("catalogue").select("*"); S.catalogue = cg.data || []; if (cg.error) toast("Catalogue : " + msgErr(cg.error)); }
  if (ROLE === "rep") { const vt = await SB.from("ventes").select("*"); S.ventes = vt.data || []; }
  if (ROLE === "rep") { const sa = await SB.from("stock_appareils").select("*").order("nom"); if (sa.error) toast("Appareils à vendre : " + msgErr(sa.error)); else S.stockApp = sa.data || []; }
  const sv = await SB.from("sav").select("*").order("created_at", {ascending:false});
  if (sv.error) toast("SAV : " + msgErr(sv.error)); else S.sav = sv.data || [];
  if (ROLE === "rep") {
    const fb = await SB.from("feedback").select("*").order("created_at", {ascending:false});
    if (fb.error) toast("Suggestions : " + msgErr(fb.error)); else S.feedback = fb.data || [];
  }
}
async function reload(){ try { await loadAll(); } catch(e){ toast("Erreur : " + msgErr(e)); } render(); }

/* ---------- Connexion ---------- */
function loginView(){
  if (CM === "forgot") return forgotView();
  const isNew = CM === "code" || CM === "data";
  const perso = CM === "data" ? `<div class="two"><div><label>Prénom *</label><input id="nP"></div><div><label>Nom *</label><input id="nN"></div></div>
    <label>Téléphone *</label><input id="nT" inputmode="tel" maxlength="20">
    <label>Adresse *</label><input id="nA">
    <div class="two"><div><label>Code postal *</label><input id="nCp" inputmode="numeric" maxlength="5"></div><div><label>Ville *</label><input id="nV"></div></div>` : "";
  const code = CM === "code" ? '<label>Code d’invitation *</label><input id="lC" inputmode="numeric" maxlength="6" placeholder="000000">' : "";
  const pick = CM === "pick" ? `<div class="modal"><div class="card">
    <div class="row" style="align-items:center"><div class="t" style="font-size:18px">Créer mon espace</div>
    <button class="chip" onclick="setCM('login')" aria-label="Fermer" style="font-size:16px">✕</button></div>
    <p class="m">As-tu un code d’invitation donné par ton réparateur ?</p>
    <button class="btn" onclick="setCM('code')">Oui, j’ai un code</button>
    <button class="btn ghost" onclick="setCM('data')">Non, je rentre mes données</button>
  </div></div>` : "";
  return `<img src="logo.png" alt="Seconde Vie" style="display:block;width:180px;max-width:70%;margin:10px auto 14px">
  ${pick}
  <div class="card">
    ${perso}
    <label>Email *</label><input id="lE" type="email" autocomplete="username">
    <label>Mot de passe *</label><input id="lP" type="password" autocomplete="${isNew ? "new-password" : "current-password"}">
    <label style="font-weight:400;display:flex;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" onchange="$('lP').type=this.checked?'text':'password'" style="width:auto;margin:0"> Afficher le mot de passe</label>
    ${code}
    <div class="err" id="lErr"></div>
    <button class="btn" onclick="doLogin()">${isNew ? "Créer mon espace" : "Se connecter"}</button>
    ${isNew ? '<button class="btn ghost" onclick="setCM(\'login\')">Retour à la connexion</button>' : '<button class="btn ghost" onclick="setCM(\'pick\')">Créer mon espace</button><button class="btn ghost" onclick="setCM(\'forgot\')">Mot de passe oublié ?</button>'}
  </div>`;
}
function setCM(v){ CM = v; render(); }

function forgotView(){
  return `<img src="logo.png" alt="Seconde Vie" style="display:block;width:180px;max-width:70%;margin:10px auto 14px">
  <div class="card"><div class="t">Mot de passe oublié</div>
    <p class="m">Indique ton email : on t’envoie un lien pour choisir un nouveau mot de passe.</p>
    <label>Email *</label><input id="fE" type="email" autocomplete="username">
    <div class="err" id="fErr"></div>
    <button class="btn" onclick="doForgot()">Envoyer le lien</button>
    <button class="btn ghost" onclick="setCM('login')">Retour à la connexion</button>
  </div>`;
}
async function doForgot(){
  const e = $("fE").value.trim(), err = $("fErr"); err.textContent = "";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { err.textContent = "L’email n’est pas valide."; return; }
  const { error } = await SB.auth.resetPasswordForEmail(e, { redirectTo: location.origin + location.pathname });
  if (error) { err.textContent = msgErr(error); return; }
  CM = "login";
  render();
  toast("Si un compte existe pour cet email, un lien vient d’être envoyé.");
}

/* Écran affiché quand l’utilisateur revient du lien reçu par email */
function recoveryView(){
  return `<img src="logo.png" alt="Seconde Vie" style="display:block;width:180px;max-width:70%;margin:10px auto 14px">
  <div class="card"><div class="t">Nouveau mot de passe</div>
    <label>Nouveau mot de passe *</label><input id="rP1" type="password" autocomplete="new-password">
    <label>Confirmer le mot de passe *</label><input id="rP2" type="password" autocomplete="new-password">
    <div class="err" id="rErr"></div>
    <button class="btn" onclick="doRecovery()">Enregistrer le mot de passe</button>
  </div>`;
}
async function doRecovery(){
  const p1 = $("rP1").value, p2 = $("rP2").value, err = $("rErr"); err.textContent = "";
  if (p1.length < 6) { err.textContent = "Le mot de passe doit contenir au moins 6 caractères."; return; }
  if (p1 !== p2) { err.textContent = "Les deux mots de passe ne sont pas identiques."; return; }
  const { error } = await SB.auth.updateUser({ password: p1 });
  if (error) { err.textContent = msgErr(error); return; }
  RECOVERY = false;
  history.replaceState(null, "", location.pathname);
  await SB.auth.signOut();
  ME = null; ROLE = null;
  CM = "login";
  render();
  toast("Mot de passe modifié. Reconnecte-toi avec ton nouveau mot de passe.");
}

async function doLogin(){
  const e = $("lE").value.trim(), p = $("lP").value, err = $("lErr");
  err.textContent = "";
  if (!e || !p) { err.textContent = "Email et mot de passe requis."; return; }
  if (CM === "login") {
    const { error } = await SB.auth.signInWithPassword({ email: e, password: p });
    if (error) { err.textContent = msgErr(error); return; }
    return boot();
  }
  const v = id => $(id).value.trim();
  let d = null, code = "";
  if (CM === "data") {
    d = {prenom:v("nP"), nom:v("nN"), tel:v("nT"), adr:v("nA"), cp:v("nCp"), ville:v("nV")};
    if (!d.prenom || !d.nom || !d.tel || !d.adr || !d.cp || !d.ville) { err.textContent = "Tous les champs marqués * sont obligatoires."; return; }
    if (!/^[0-9+ .\-]{6,20}$/.test(d.tel)) { err.textContent = "Le téléphone ne doit contenir que des chiffres."; return; }
    if (!/^\d{5}$/.test(d.cp)) { err.textContent = "Le code postal doit comporter 5 chiffres."; return; }
  } else {
    code = v("lC");
    if (!/^\d{6}$/.test(code)) { err.textContent = "Le code doit comporter 6 chiffres."; return; }
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { err.textContent = "L’email n’est pas valide."; return; }
  const { error: se } = await SB.auth.signUp({ email: e, password: p });
  if (se) { err.textContent = msgErr(se); return; }
  const { error: le } = await SB.auth.signInWithPassword({ email: e, password: p });
  if (le) { err.textContent = msgErr(le); return; }
  if (code) {
    const { error: ce } = await SB.rpc("claim_invitation", { p_code: code });
    if (ce) { err.textContent = /code_invalide/.test(ce.message) ? "Code invalide ou déjà utilisé. Ton compte est créé : reconnecte-toi, ou contacte ton réparateur." : "Erreur : " + ce.message; return; }
  } else {
    const { data: u } = await SB.auth.getUser();
    const { error: ie } = await SB.from("clients").insert({ ...d, mail: e, auth_user_id: u.user.id });
    if (ie) {
      err.textContent = ie.code === "23505" ? "Un client existe déjà avec ce téléphone ou cet email. Utilise ton code d’invitation ou contacte ton réparateur." : msgErr(ie);
      return;
    }
  }
  CM = "login";
  await boot();
}

async function boot(){
  const { data } = await SB.auth.getSession();
  ME = data.session ? data.session.user : null;
  if (!ME) { ROLE = null; return render(); }
  const { data: r } = await SB.from("repairers").select("user_id").eq("user_id", ME.id).maybeSingle();
  ROLE = r ? "rep" : "cli";
  if (ROLE === "rep") restoreNav();
  try { await loadAll(); } catch(e) { toast("Erreur de chargement : " + msgErr(e)); }
  if (ROLE === "rep") await syncReservations();
  render();
}
async function logout(){ await SB.auth.signOut(); ME = null; ROLE = null; DOSSIER = null; render(); }

/* ---------- Affichage ---------- */
function render(){
  const app = $("app"), nav = $("nav");
  saveNav();
  if (RECOVERY) { nav.classList.add("hide"); app.innerHTML = recoveryView(); return; }
  if (!ME) { nav.classList.add("hide"); app.innerHTML = loginView(); return; }
  if (ROLE === "rep") {
    nav.classList.remove("hide");
    nav.innerHTML = REP_NAV.map(([v,l]) => `<button class="${VIEW===v?"on":""}" onclick="go('${v}')">${l}</button>`).join("");
    app.innerHTML = '<div class="row" style="align-items:center;margin:4px 0 8px"><img src="logo.png" alt="Seconde Vie" style="height:44px"><button class="btn small ghost" onclick="logout()">Déconnexion</button></div>' + (DOSSIER ? detailView() : REP[VIEW]());
    if (VIEW === "stock" && !DOSSIER) { mpDraw("n"); mpDraw("a"); }
    if (VIEW === "newvente") mpDraw("v");
    if (VENTE_OPEN && VIEW === "dossiers" && !DOSSIER) mpDraw("v");
    if (VIEW === "newvente" || (VENTE_OPEN && VIEW === "dossiers" && !DOSSIER)) attachPlaces();
    if (DOSSIER) paintDetail();
  } else {
    nav.classList.add("hide");
    app.innerHTML = cliView();
  }
  renderFb();
}
async function syncReservations(){
  const actif = id => { const d = S.dossiers.find(x => x.id === id); return !!d && !["Terminé", "Remis"].includes(d.statut); };
  const changes = S.stock.map(s => {
    const want = S.pieces.filter(p => p.sku === s.sku && p.statut === "Réservée" && actif(p.dossier_id)).reduce((t, p) => t + (+p.qte || 0), 0);
    return [s.sku, want, +s.res || 0];
  }).filter(([, want, have]) => want !== have);
  if (!changes.length) return 0;
  for (const [sku, want] of changes) {
    const { error } = await SB.from("stock").update({ res: want }).eq("sku", sku);
    if (error) { toast(msgErr(error)); return 0; }
  }
  await reload();
  return changes.length;
}
async function go(v){
  if (v === "out") return logout();
  VIEW = v; DOSSIER = null;
  if (v === "newvente") { VENTE_OPEN = false; VENTE_EDIT = null; VENTE_LIGNES = []; VT_COMPAT = false; MP.v = []; PKS.v = {app:"", cat:""}; VT_SEL = null; }
  if (v === "stock" && ROLE === "rep") await syncReservations();
  if (v === "avis" && ROLE === "rep") {
    const fb = await SB.from("feedback").select("*").order("created_at", {ascending:false});
    if (fb.error) toast("Suggestions : " + msgErr(fb.error)); else S.feedback = fb.data || [];
  }
  render();
}
function saveNav(){
  try { localStorage.setItem("navState", JSON.stringify({VIEW, DOSSIER, CLI_OPEN})); } catch(e) {}
}
function restoreNav(){
  try {
    const n = JSON.parse(localStorage.getItem("navState") || "null");
    if (n) { VIEW = n.VIEW === "sav" ? "dossiers" : (n.VIEW || VIEW); DOSSIER = n.DOSSIER || null; CLI_OPEN = n.CLI_OPEN || null; }
  } catch(e) {}
}
function flash(msg){
  const f = document.createElement("div");
  f.className = "flash"; f.textContent = msg;
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1600);
}

/* ---------- Réparateur ---------- */
var SORT_REP = "ech", SORT_VENTE = "date";
var DOSS_F = {statut: "", app: ""}, VENTE_F = {kind: "", app: ""};
function filtersRow(items){
  return '<div class="row" style="gap:6px;flex-wrap:wrap;margin:0 0 8px">' + items.map(i => '<select onchange="' + i.js + '">' + selOpts([["", i.all]].concat(i.opts), i.cur) + '</select>').join("") + '</div>';
}
function setSortRep(v){ SORT_REP = v; render(); }
function setSortVente(v){ SORT_VENTE = v; render(); }
function sortSelect(val, opts, fn){
  return '<div class="row" style="align-items:center;gap:6px;margin:0 0 8px"><span class="m">Trier par</span><select onchange="' + fn + '(this.value)">'

function plus30(dateStr){
  const b = dateStr ? new Date(dateStr + "T00:00") : new Date();
  b.setHours(0, 0, 0, 0); b.setDate(b.getDate() + 30);
  return b.getFullYear() + "-" + String(b.getMonth() + 1).padStart(2, "0") + "-" + String(b.getDate()).padStart(2, "0");
}
function durNorm(v){
  const t = (v || "").trim().replace(/\s+/g, "");
  if (!t) return null;
  const m = t.match(/^(\d+(?:[.,]\d+)?)h?$/i);
  return m ? m[1].replace(",", ".") + "h" : t;
}
function todayIso(){
  const t = new Date();
  return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
}
function recupHtml(d){
  const dl = d.date_termine ? plus30(d.date_termine) : d.date_retour;
  if (!dl) return '<div class="m" style="margin-top:6px;color:var(--warn);font-weight:600">Date de fin à définir</div>';
  const l = left(dl);
  const pct = Math.min(100, Math.max(0, (30 - l) / 30 * 100));
  const col = l < 0 ? 'var(--bad)' : l <= 7 ? 'var(--warn)' : 'var(--brand)';
  return '<div style="margin-top:6px"><div style="height:8px;border-radius:4px;background:var(--line);overflow:hidden"><div style="height:100%;width:' + pct + '%;background:' + col + '"></div></div>'
    + '<div style="display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-weight:600;color:' + col + '"><span>Retour avant le ' + fr(dl) + '</span><span>' + jours(l) + '</span></div></div>';
}
function payInfo(d){
  const vir = +d.paye_virement || 0, esp = +d.paye_especes || 0, aco = +d.acompte || 0, tot = vir + esp + aco;
  const prix = d.prix == null ? null : +d.prix;
  return {vir, esp, aco, tot, prix, reste: prix == null ? null : Math.max(0, prix - tot)};
}
function payTxt(d){
  const p = payInfo(d);
  if (p.prix == null) return "Prix à définir";
  if (p.reste <= 0) return "Réglé";
  return p.tot > 0 ? "Reste " + p.reste + " € à régler" : p.prix + " € à régler";
}
function payChip(d){
  const t = payTxt(d);
  return '<span class="chip ' + (t === "Réglé" ? "ok" : t === "Prix à définir" ? "" : "late") + '">' + t + '</span>';
}

var FB_PAGE = "Espace client";
function detectPage(){
  if (ROLE !== "rep") return "Espace client";
  const mid = window.innerHeight * 0.5;
  let best = null, bestTop = -Infinity;
  document.querySelectorAll("[data-page]").forEach(el => {
    const top = el.getBoundingClientRect().top;
    if (el.offsetParent !== null && top <= mid && top > bestTop) { best = el; bestTop = top; }
  });
  if (best) return best.getAttribute("data-page");
  if (ROLE !== "rep") return "Espace client";
  const nav = REP_NAV.find(([v]) => v === VIEW);
  return "Espace réparateur" + (DOSSIER ? " · Détail réparation" : nav ? " · " + nav[1] : "");
}

var DRAG = null;
function dragStart(e, panel){
  if (e.target.closest("button")) return;
  const pt = e.touches ? e.touches[0] : e, r = panel.getBoundingClientRect();
  DRAG = {panel, sx: pt.clientX, sy: pt.clientY, ox: r.left, oy: r.top};
  panel.style.bottom = "auto";
  panel.style.left = r.left + "px";
  panel.style.top = r.top + "px";
  if (e.cancelable) e.preventDefault();
}
function dragMove(e){
  if (!DRAG) return;
  const pt = e.touches ? e.touches[0] : e, p = DRAG.panel;
  const x = Math.max(0, Math.min(DRAG.ox + pt.clientX - DRAG.sx, innerWidth - p.offsetWidth));
  const y = Math.max(0, Math.min(DRAG.oy + pt.clientY - DRAG.sy, innerHeight - p.offsetHeight));
  p.style.left = x + "px";
  p.style.top = y + "px";
  if (e.cancelable) e.preventDefault();
}
function dragEnd(){ DRAG = null; }
document.addEventListener("mousemove", dragMove);
document.addEventListener("touchmove", dragMove, {passive: false});
document.addEventListener("mouseup", dragEnd);
document.addEventListener("touchend", dragEnd);
function openFeedback(){
  FB_PAGE = detectPage();
  let p = $("fbPanel");
  if (!p) { p = document.createElement("div"); p.id = "fbPanel"; p.className = "fb-panel"; document.body.appendChild(p); }
  p.innerHTML = `<div class="fb-head" id="fbHead"><span>Signaler ou suggérer</span><button class="fb-close" onclick="closeFeedback()" title="Fermer">×</button></div>
    <div class="fb-body">
    <label>Type</label><select id="fbType" onchange="if(this.value)$('fbMsg').focus()"><option value="">- sélectionner -</option><option>Suggestion</option><option>Bug</option></select>
    <div class="m" style="margin:4px 0 6px">Page : <b>${esc(FB_PAGE)}</b></div>
    <label>Ton message</label><textarea id="fbMsg" placeholder="Décris le problème ou ton idée"></textarea>
    <div class="err" id="fbErr"></div>
    <button class="btn" onclick="sendFeedback()">Envoyer</button>
    </div>`;
  p.style.display = "block";
  $("fbMsg").focus();
  const head = $("fbHead");
  head.onmousedown = e => dragStart(e, p);
  head.ontouchstart = e => dragStart(e, p);
}
function closeFeedback(){ const p = $("fbPanel"); if (p) p.style.display = "none"; }
async function sendFeedback(){
  const err = $("fbErr"), msg = $("fbMsg").value.trim();
  err.textContent = "";
  if (!$("fbType").value) { err.textContent = "Choisis un type."; return; }
  if (!msg) { err.textContent = "Écris ton message."; return; }
  const c = S.clients.find(x => x.auth_user_id === ME.id);
  const auteur = ROLE === "rep" ? "admin" : c ? fullName(c) : "Client";
  const { error } = await SB.from("feedback").insert({
    auteur, auth_user_id: ME.id,
    type: $("fbType").value, page: FB_PAGE, message: msg
  });
  if (error) { err.textContent = msgErr(error); return; }
  closeFeedback();
  toast("Merci, ton message a bien été envoyé");
}

var DOSS_TAB = "rep";

function agendaData(){
  const today = todayIso(), items = [], sans = [];
  const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
  S.dossiers.filter(d => d.statut !== "Remis").forEach(d => {
    const nom = [d.appareil, d.clients ? fullName(d.clients) : ""].filter(Boolean).join(" · ") || "Réparation";
    const go = "openD('" + d.id + "')";
    if (d.statut === "Terminé") {
      if (d.date_retour) items.push({date: d.date_retour, txt: "Limite de retrait · " + nom, go});
      else sans.push({txt: "Date de fin à définir · " + nom, go});
      return;
    }
    if (d.statut === "Devis") {
      if (d.date_recup) items.push({date: d.date_recup, txt: "Dépôt de l’appareil · " + nom, go});
      else sans.push({txt: "Date de dépôt à fixer · " + nom, go});
    }
    if (d.echeance) items.push({date: d.echeance, txt: "Prêt à rendre · " + nom, go});
    else sans.push({txt: "Date de prêt à fixer · " + nom, go});
  });
  S.pieces.filter(p => p.statut === "À commander").forEach(p => sans.push({txt: "Pièce à commander · " + p.qte + " × " + p.nom}));
  (S.ventes || []).filter(v => !v.archivee && !v.envoi).forEach(v => items.push({date: v.date_rdv, txt: "Vente · " + venteTitre(v) + " · " + venteClient(v) + (v.lieu ? " · " + v.lieu : "") + (v.heure_rdv ? " · " + String(v.heure_rdv).slice(0, 5) : "")}));
  return {
    today, sans,
    late: items.filter(e => e.date < today).sort(byDate),
    future: items.filter(e => e.date >= today).sort(byDate)
  };
}
function agendaBody(){
  const a = agendaData();
  const line = e => '<div class="m" style="margin-top:4px;' + (e.go ? 'cursor:pointer' : '') + '"' + (e.go ? ' onclick="' + e.go + '"' : '') + '>' + esc(e.txt) + '</div>';

  };
  const days = {};
  a.future.forEach(e => { (days[e.date] = days[e.date] || []).push(e); });

async function saveVente(){
  const err = $("vErr"); err.textContent = "";
  const passe = $("vPasse").checked, prixT = $("vPrix").value.trim().replace(",", ".");
  let client_id = null, client_nom = null;
  if (!passe) { client_id = $("vCli").value || null; if (!client_id) { err.textContent = "Sélectionne un client, ou coche « Client de passage »."; return; } }
  else {
    const t = $("vTyp").value;
    if (t === "sans") client_nom = "Client de passage";
    else if (t === "avec") { client_nom = $("vNom").value.trim(); if (!client_nom) { err.textContent = "Indique le nom."; return; } }
    else if (t === "leboncoin") { const ps = $("vPseudo").value.trim(); if (!ps) { err.textContent = "Indique le pseudo leboncoin."; return; } client_nom = "leboncoin : " + ps; }
    else { err.textContent = "Choisis sans nom, avec nom ou leboncoin."; return; }
  }
  const envoi = passe && $("vTyp").value === "leboncoin" && $("vEnvoi").checked;
  // si aucun modèle n’est ajouté, on prend celui qui est saisi dans le sélecteur
  if (!VENTE_LIGNES.length) {
    const r = vLigneFromForm();
    if (r.error) { err.textContent = r.error; return; }
    VENTE_LIGNES.push(r.line);
  }
  const date = envoi ? todayIso() : $("vDate").value;
  if (!date) { err.textContent = "Indique la date du rendez-vous."; return; }
  if (prixT !== "" && isNaN(parseFloat(prixT))) { err.textContent = "Prix invalide."; return; }
  const editing = !!VENTE_EDIT;
  const old = editing ? venteLignes((S.ventes || []).find(v => v.id === VENTE_EDIT) || {}) : [];
  const oldKeys = new Set(old.map(lineKey));
  for (const l of VENTE_LIGNES) {
    if (l.appareil_id || l.acheter || oldKeys.has(lineKey(l))) continue;
    err.textContent = (l.modele || "Ce modèle") + " : pas en stock. Choisis l’appareil du stock, ou coche « Pas en stock » pour le mettre dans les appareils à acheter.";
    return;
  }
  const had = lignesRes(old), want = lignesRes(VENTE_LIGNES);
  for (const id of Object.keys(want)) {
    const x = (S.stockApp || []).find(s => s.id === id);
    if (!x) { err.textContent = "Un appareil choisi n’est plus disponible en stock."; return; }
    const dispo = x.qte + (had[id] || 0);
    if (dispo < want[id]) { err.textContent = x.nom + " : stock insuffisant (" + dispo + " disponible(s), " + want[id] + " demandé(s))."; return; }
  }
  const first = VENTE_LIGNES[0];
  const row = {
    appareil: first.appareil, categorie: first.categorie, modele: first.modele, lignes: VENTE_LIGNES,
    lieu: envoi ? null : ($("vLieu").value.trim() || null), prix: prixT === "" ? null : parseFloat(prixT), date_rdv: date,
    heure_rdv: envoi ? null : ($("vHeure").value || null), lien_conv: $("vConv").value.trim() || null,
    envoi, transporteur: envoi ? ($("vTransp").value || null) : null, suivi: envoi ? ($("vSuivi").value.trim() || null) : null, envoi_statut: envoi ? $("vEnvStat").value : null,
    client_id, client_nom
  };
  const { error } = editing
    ? await SB.from("ventes").update(row).eq("id", VENTE_EDIT)
    : await SB.from("ventes").insert(row);
  if (error) { err.textContent = msgErr(error); return; }
  const ids = new Set([...Object.keys(had), ...Object.keys(want)]);
  for (const id of ids) {
    const dq = (had[id] || 0) - (want[id] || 0), dr = (want[id] || 0) - (had[id] || 0);
    if (dq || dr) { const e = await devAdj(id, dq, dr); if (e) toast(e); }
  }
  VENTE_OPEN = false; VENTE_EDIT = null; VENTE_LIGNES = []; VT_COMPAT = false; MP.v = []; PKS.v = {app:"", cat:""}; VT_SEL = null;
  flash(editing ? "Vente modifiée" : "Vente enregistrée");
  await reload();
}
async function acheterReserver(id, idx){
  const v = (S.ventes || []).find(x => x.id === id);
  if (!v || !Array.isArray(v.lignes) || !v.lignes[idx] || !v.lignes[idx].acheter) return;
  const l = v.lignes[idx], q = l.quantite || 1;
  const x = (S.stockApp || []).find(s => s.nom === [l.appareil, l.categorie, l.modele, l.couleur].filter(Boolean).join(" · "));
  if (!x || x.qte < q) { toast("Pas encore assez en stock : " + (x ? x.qte : 0) + " dispo sur " + q + " demandé(s)."); return; }
  const lignes = v.lignes.map((k, j) => j === idx ? Object.assign({}, k, {acheter: false, appareil_id: x.id}) : k);
  const { error } = await SB.from("ventes").update({ lignes }).eq("id", id);
  if (error) { toast(msgErr(error)); return; }
  const e = await devAdj(x.id, -q, q);
  if (e) toast(e);
  flash("Appareil réservé depuis le stock");
  await reload();
}

    .sort((a,b) => ((a.nom || "") + (a.prenom || "")).localeCompare((b.nom || "") + (b.prenom || ""), "fr"));
  return list.map(c => {
    const inv = S.inv.find(i => i.client_id === c.id && !i.used_at);
    const acc = c.auth_user_id ? '<span class="chip ok">Compte créé</span> ' + (c.infos_verifiees_at ? '<span class="chip ok">Infos vérifiées</span>' : '<span class="chip warn">Infos à vérifier</span>')
      : inv ? 'Code : <span class="code">' + esc(inv.code) + '</span>'
      : '<button class="chip" onclick="newCode(\'' + c.id + '\')">Générer un code</button>';
    const head = '<div style="cursor:pointer" onclick="toggleCli(\'' + c.id + '\')"><div class="t">' + esc(fullName(c)) + (c.deleted_at ? ' <span class="chip late">Supprimé</span>' : '') + '</div><div class="m">' + esc(c.tel) + ' · ' + esc(c.mail) + '</div></div>';
    if (CLI_OPEN !== c.id) return '<div class="card">' + head + '</div>';
    const actions = c.deleted_at
      ? '<button class="btn" onclick="restoreCli(\'' + c.id + '\')">Restaurer</button><button class="btn ghost" style="color:var(--bad);border-color:var(--bad)" onclick="purgeCli(\'' + c.id + '\')">Supprimer définitivement</button>'
      : '<button class="btn" onclick="editCli(\'' + c.id + '\')">Modifier</button><button class="btn ghost" onclick="softDelCli(\'' + c.id + '\')">Supprimer</button>';
    return '<div class="card">' + head
      + '<div class="m" style="margin-top:8px">' + esc(c.adr) + ', ' + esc(c.cp) + ' ' + esc(c.ville) + '</div>'
      + (c.notes ? '<div class="m">' + esc(c.notes) + '</div>' : '')
      + '<div style="margin-top:6px">' + acc + '</div>'
      + '<div id="cEd"></div>' + devHtml(c) + actions + '<div class="err" id="cliErr"></div></div>';
  }).join("") || '<p class="m">' + (CLI_TRASH ? 'La corbeille est vide.' : 'Aucun client.') + '</p>';
}

function addCatForm(){

    + '<div class="two"><div><label>Prix (€)</label><input id="cP" inputmode="decimal" placeholder="à définir"></div><div><label>Durée de réparation</label><input id="cD" placeholder="Ex. 1h"></div></div>'
    + '<button class="btn" onclick="addCat()">Ajouter</button><div class="err" id="cRErr"></div></div>';

async function addCat(){
  const rep = $("cR").value.trim(), pr = $("cP").value.trim().replace(",", "."), du = $("cD").value.trim(), err = $("cRErr");
  err.textContent = "";
  if (!rep) { err.textContent = "Indique la réparation."; return; }
  if (pr !== "" && pr !== "devis" && (isNaN(+pr) || +pr < 0)) { err.textContent = "Prix invalide."; return; }
  const ref = S.catalogue.find(r => r.modele === CAT.mod);
  const { error } = await SB.from("catalogue").insert({ appareil: CAT.app, categorie: ref ? ref.categorie : (CAT.cat || "Autre"), modele: CAT.mod, reparation: rep, prix: pr === "" ? null : pr, duree: durNorm(du), joy: false });
  if (error) { err.textContent = msgErr(error); return; }
  toast("Réparation ajoutée");
  await reload();
}
async function setPrixCat(id, v){
  v = String(v).trim().replace(",", "."); const p = v === "" ? null : v;
  if (p !== null && p !== "devis" && (isNaN(+p) || +p < 0)) { toast("Prix invalide"); render(); return; }
  const { error } = await SB.from("catalogue").update({ prix: p }).eq("id", id);
  if (error) { toast(msgErr(error)); return; }
  toast("Prix enregistré");
  await reload();
}
async function delCat(id){
  if (!confirm("Supprimer cette réparation du catalogue ?")) return;
  const { error } = await SB.from("catalogue").delete().eq("id", id);
  if (error) { toast(msgErr(error)); return; }
  toast("Réparation supprimée");
  await reload();
}
async function importCat(){
  if (!confirm("Importer le catalogue de base (103 réparations) ?")) return;
  const rows = CAT_SEED.map(r => ({appareil: r[0], cible: r[1], categorie: r[2], modele: r[3], reparation: r[4], prix: r[5], duree: r[6], joy: r[7]}));
  for (let i = 0; i < rows.length; i += 50) {
    const { error } = await SB.from("catalogue").insert(rows.slice(i, i + 50));
    if (error) { toast(msgErr(error)); return; }
  }
  toast("Catalogue importé");
  await reload();
}
function plus6m(dateStr){
  const b = dateStr ? new Date(dateStr + "T00:00") : new Date();
  b.setHours(0, 0, 0, 0); b.setMonth(b.getMonth() + 6);
  return b.getFullYear() + "-" + String(b.getMonth() + 1).padStart(2, "0") + "-" + String(b.getDate()).padStart(2, "0");
}
function garantieHtml(d){
  if (d.statut !== "Remis" || !d.echeance)
    return '<div class="m" style="margin-top:6px">La garantie de 6 mois démarre à la remise de l’appareil.</div>';
  const fin = plus6m(d.echeance);
  const start = new Date(d.echeance + "T00:00"), end = new Date(fin + "T00:00");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const pct = Math.min(100, Math.max(0, (today - start) / (end - start) * 100));
  const rest = left(fin);
  const col = rest < 0 ? "var(--bad)" : rest <= 30 ? "var(--warn)" : "var(--brand)";
  return '<div style="margin-top:8px"><div class="t" style="font-size:14px">Garantie 6 mois</div>'
    + '<div style="height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px"><div style="height:100%;width:' + pct.toFixed(1) + '%;background:' + col + '"></div></div>'

async function fSave(field, value){
  const d = S.dossiers.find(x => x.id === DOSSIER);
  if (!d) return;
  let v = value;
  if (field === "panne") {
    v = String(value).trim();
    if (!v) { toast("Donne un nom à la réparation."); $("dNom").value = d.panne || ""; return; }
  } else if (field === "prix") {
    const t = String(value).trim().replace(",", ".");
    if (t !== "" && isNaN(parseFloat(t))) { toast("Prix invalide."); return; }
    v = t === "" ? null : parseFloat(t);
  } else if (field === "duree") {
    v = durNorm(value);
  } else if (["acompte", "paye_virement", "paye_especes"].includes(field)) {
    const t = parseFloat(String(value || "0").replace(",", "."));
    if (isNaN(t) || t < 0) { toast("Montant invalide."); return; }
    v = t;
  } else {
    v = value || null;
  }
  const upd = {[field]: v};
  if (field === "date_termine") upd.date_retour = v ? plus30(v) : null;
  const tmp = Object.assign({}, d, upd);
  if (["prix", "acompte", "paye_virement", "paye_especes"].includes(field)) upd.paye = tmp.prix != null && payInfo(tmp).reste === 0;
  const { error } = await SB.from("dossiers").update(upd).eq("id", d.id);
  if (error) { toast(msgErr(error)); return; }
  Object.assign(d, upd);
  paintDetail();
  flash("Enregistré ✓");
}
async function setStatut(st){
  const d = S.dossiers.find(x => x.id === DOSSIER), sel = $("dSt");
  const fail = msg => { sel.value = d.statut; toast(msg); };
  if (st === d.statut) return;
  if (st !== "Devis en cours") {
    if (d.statut === "Devis en cours" && !devisOk(d)) return fail("Renseigne la date de dépôt, le prix et la durée avant de quitter le devis.");
    if (pcs(d.id).some(p => p.statut !== "Réservée")) return fail("Impossible : toutes les pièces doivent être réservées.");
  }
  if (st === "Remis") {
    if (!d.echeance) return fail("Renseigne la date « Remis le » avant de passer en Remis.");
    if (payInfo(d).reste !== 0) return fail("Le paiement doit être complet avant de passer en Remis.");
  }
  const date_termine = st === "Terminé" ? (d.date_termine || todayIso()) : null;
  const date_retour = date_termine ? plus30(date_termine) : null;
  const { error } = await SB.from("dossiers").update({statut: st, date_termine, date_retour}).eq("id", d.id);
  if (error) return fail(msgErr(error));
  // pièces réservées : retirées de la réservation quand la réparation est Terminé/Remis (le stock n'est pas rendu)
  const wasFinal = ["Terminé", "Remis"].includes(d.statut), isFinal = ["Terminé", "Remis"].includes(st);
  if (wasFinal !== isFinal) {
    for (const p of pcs(d.id)) {
      if (p.statut !== "Réservée" || !p.sku) continue;
      const s2 = S.stock.find(x => x.sku === p.sku); if (!s2) continue;
      const r = await SB.from("stock").update({ res: Math.max(0, s2.res + (isFinal ? -p.qte : p.qte)) }).eq("sku", s2.sku);
      if (r.error) toast(msgErr(r.error));
    }
  }
  flash("Enregistré ✓");
  await reload();
}

async function applyPst(p, v){
  const st = p.sku ? S.stock.find(x => x.sku === p.sku) : null;
  if (v === "Réservée" && p.statut !== "Réservée") {
    if (!st) return "Cette pièce n’a pas de SKU en stock : réservation impossible.";
    if (st.qte < p.qte) return "Stock insuffisant : " + st.qte + " disponible(s), " + p.qte + " nécessaire(s).";
    const r = await SB.from("stock").update({ qte: st.qte - p.qte, res: st.res + p.qte }).eq("sku", st.sku);
    if (r.error) return msgErr(r.error);
  } else if (p.statut === "Réservée" && v !== "Réservée" && st) {
    const r = await SB.from("stock").update({ qte: st.qte + p.qte, res: st.res - p.qte }).eq("sku", st.sku);
    if (r.error) return msgErr(r.error);
  }
  const { error } = await SB.from("pieces_dossier").update({ statut: v }).eq("id", p.id);
  return error ? msgErr(error) : null;
}

    <div style="display:flex;align-items:center;gap:6px"><button class="chip" onclick="adjStock('${esc(s.sku)}',-1)">−</button><span class="chip ${s.qte > 0 ? "ok" : "late"}">${s.qte > 0 ? s.qte + " dispo" : "Rupture"}</span><button class="chip" onclick="adjStock('${esc(s.sku)}',1)">+</button></div></div>
    <div style="margin-top:6px;display:flex;gap:6px"><button class="chip" onclick="editPiece('${esc(s.sku)}')">Modifier</button><button class="chip late" onclick="deleteStock('${esc(s.sku)}')">Supprimer</button></div>
    <div id="pe-${esc(s.sku)}"></div></div>`).join("")
    || '<p class="m">Aucune pièce trouvée.</p>';
}
async function addStock(){
  const err = $("sErr"); err.textContent = "";
  const nom = $("sN").value.trim(), q = parseInt($("sQt").value, 10), modeles = MP.n || [];
  if (!nom || !modeles.length || isNaN(q) || q < 0) { err.textContent = "Nom, au moins un modèle et quantité sont obligatoires."; return; }
  const max = S.stock.reduce((t, s) => Math.max(t, parseInt(String(s.sku).replace(/\D/g, ""), 10) || 0), 1000);
  const { error } = await SB.from("stock").insert({ sku: "PC-" + (max + 1), nom, type: typeOf(modeles), modeles, modele: modeles.join(", "), qte: q, res: 0 });
  if (error) { err.textContent = msgErr(error); return; }
  MP.n = [];
  await reload();
}
async function adjStock(sku, d){
  const s = S.stock.find(x => x.sku === sku);
  if (!s || s.qte + d < 0) return;
  const { error } = await SB.from("stock").update({ qte: s.qte + d }).eq("sku", sku);
  if (error) toast(msgErr(error));
  await reload();
}
async function seedPuces(){
  const rows = [];
  let max = S.stock.reduce((t, s) => Math.max(t, parseInt(String(s.sku).replace(/\D/g, ""), 10) || 0), 5000);
  PUCES.forEach(([nom, modele]) => {
    if (!S.stock.some(s => s.nom === nom)) rows.push({ sku: "PC-" + (++max), nom, type: "Console", modele, qte: 0, res: 0 });
  });
  if (!rows.length) return toast("Les puces sont déjà au stock.");
  const { error } = await SB.from("stock").insert(rows);
  if (error) return toast(msgErr(error));
  toast("Puces ajoutées (quantité 0 : règle-les avec + / −).");
  await reload();
}

/* ---------- Client ---------- */
var PROF_EDIT=false;
function profForm(c, label, fn){
  const f = (id, lbl, val, extra) => '<label>' + lbl + '</label><input id="' + id + '" value="' + esc(val || "") + '"' + (extra || "") + '>';
  return '<div class="card" style="margin:8px 0 0">'
    + '<div class="two"><div>' + f("pfP","Prénom *",c.prenom).replace("<label>","<label>") + '</div><div>' + f("pfN","Nom *",c.nom) + '</div></div>'
    + f("pfT","Téléphone *",c.tel,' inputmode="tel" maxlength="20"')
    + f("pfM","Email (identifiant de connexion)",c.mail,' disabled')
    + '<p class="m" style="margin:4px 0 0">Pour changer ton email de connexion, contacte ton réparateur.</p>'
    + f("pfA","Adresse *",c.adr)
    + '<div class="two"><div>' + f("pfC","Code postal *",c.cp,' inputmode="numeric" maxlength="5"') + '</div><div>' + f("pfV","Ville *",c.ville) + '</div></div>'
    + '<button class="btn" onclick="' + fn + '()">' + label + '</button>'
    + (PROF_EDIT && fn === "saveProfile" ? '<button class="btn ghost" onclick="PROF_EDIT=false;render()">Annuler</button>' : '')
    + '<div class="err" id="pfErr"></div></div>';
}
async function saveProfile(){ await writeProfile(false); }
async function confirmProfile(){ await writeProfile(true); }
async function writeProfile(confirmNow){
  const v = x => $(x).value.trim(), err = $("pfErr"); err.textContent = "";
  const r = {prenom:v("pfP"), nom:v("pfN"), tel:v("pfT"), adr:v("pfA"), cp:v("pfC"), ville:v("pfV")};
  if (!r.prenom || !r.nom || !r.tel || !r.adr || !r.cp || !r.ville) { err.textContent = "Les champs marqués * sont obligatoires."; return; }
  if (!/^[0-9+ .\-]{6,20}$/.test(r.tel)) { err.textContent = "Le téléphone ne doit contenir que des chiffres."; return; }
  if (!/^\d{5}$/.test(r.cp)) { err.textContent = "Le code postal doit comporter 5 chiffres."; return; }
  if (confirmNow) r.infos_verifiees_at = new Date().toISOString();
  const { data, error } = await SB.from("clients").update(r).eq("auth_user_id", ME.id).select();
  if (error) { err.textContent = error.code === "23505" ? "Ce téléphone est déjà utilisé par un autre compte. Contacte ton réparateur." : msgErr(error); return; }
  if (!data || !data.length) { err.textContent = "Enregistrement impossible : la mise à jour n’est pas autorisée. Contacte ton réparateur."; return; }
  PROF_EDIT = false;
  toast(confirmNow ? "Informations confirmées" : "Informations enregistrées");
  await reload();
}
var PARAM_OPEN=false;
function toggleParam(){ PARAM_OPEN = !PARAM_OPEN; render(); }
function cliView(){
  const me = S.clients[0];
  if (!me) return `<h1>Bienvenue</h1>
    <div class="card"><p class="m">Ton compte est créé. Entre le code d’invitation donné par ton réparateur pour accéder à tes dossiers.</p>
    <label>Code d’invitation</label><input id="cCode" inputmode="numeric" maxlength="6" placeholder="000000">
    <button class="btn" onclick="claimNow()">Valider</button><div class="err" id="cErr2"></div></div>
    <button class="btn ghost" onclick="logout()">Se déconnecter</button>`;
  const head = `<div class="row" style="align-items:center;margin:4px 0 8px"><img src="logo.png" alt="Seconde Vie" style="height:44px"><button class="btn small ghost" onclick="toggleParam()">Paramètres</button></div>`;
  if (!me.infos_verifiees_at) return head + `<h2 data-page="Vérification des informations">Vérifie tes informations</h2>
    <p class="m">Relis tes informations, corrige-les si besoin, puis confirme. Tes dossiers s’afficheront ensuite.</p>
    ${profForm(me, "Confirmer mes informations", "confirmProfile")}`;
  const info = PROF_EDIT ? profForm(me, "Enregistrer", "saveProfile")
    : `<div class="card" style="position:relative"><button class="chip" style="position:absolute;top:10px;right:12px;padding:4px 10px" title="Modifier mes informations" onclick="PROF_EDIT=true;render()">✏️</button>
       <div class="t">${esc(fullName(me))}</div>
       <div class="m">${esc(me.tel)} · ${esc(me.mail)}</div>
       <div class="m">${esc(me.adr)}, ${esc(me.cp)} ${esc(me.ville)}</div></div>`;
  return head + (PARAM_OPEN ? `<div class="card"><div class="t">Paramètres</div><button class="btn ghost small" style="margin-top:8px" onclick="PROF_EDIT=true;PARAM_OPEN=false;render()">Modifier mes informations</button><button class="btn ghost small" style="margin-top:8px" onclick="logout()">Déconnexion</button></div>` : "") + `<h1>Bonjour ${esc(me.prenom)}</h1>
  <h2 data-page="Mes informations">Mes informations</h2>${info}
  <h2 data-page="Mes appareils">Mes appareils</h2>${cliDevHtml(me)}
  `;
}
async function claimNow(){
  const code = $("cCode").value.trim(), err = $("cErr2");
  if (!/^\d{6}$/.test(code)) { err.textContent = "Le code doit comporter 6 chiffres."; return; }
  const { error } = await SB.rpc("claim_invitation", { p_code: code });
  if (error) { err.textContent = /code_invalide/.test(error.message) ? "Code invalide ou déjà utilisé." : "Erreur : " + error.message; return; }
  await boot();
}

boot();
</script>
