<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:480px;margin:0 auto;padding:20px 20px 100px;width:100%}
.card,.modal .card{width:100%}
img{max-width:100%}
input,select,textarea,button{max-width:100%}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.m{color:var(--mut);font-size:13px}
.t{font-weight:600}
span.chip{cursor:default}
button:not(:disabled),.card[onclick]{transition:transform .15s,box-shadow .15s}
button:not(:disabled):hover,.card[onclick]:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line);white-space:nowrap;border:0;cursor:pointer;font-family:inherit}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--bg);padding:2px 6px;border-radius:6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px}
label{display:block;font-size:13px;font-weight:600;margin:8px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;border:0;background:var(--brand);color:#fff;font-family:inherit;font-weight:600;font-size:15px;padding:12px;border-radius:12px;margin-top:8px;cursor:pointer}
.btn.small{width:auto;padding:7px 12px;margin:0;font-size:13px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0}
.hide{display:none!important}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom);background:var(--surf);border-top:1px solid var(--line);box-shadow:0 100px 0 0 var(--surf);display:flex;z-index:5}

.modal .card{max-width:360px;width:100%;margin:0}
.fb-wrap{position:fixed;left:14px;bottom:14px;z-index:15}
.fb-wrap.edge{left:0}
.notif-wrap{position:fixed;top:12px;right:14px;z-index:16}
.notif-btn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 2px 8px rgba(23,38,31,.08)}
.notif-btn svg{width:20px;height:20px}
.notif-badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;box-sizing:border-box}
.notif-banner{position:fixed;top:62px;right:14px;z-index:17;width:min(340px,calc(100vw - 28px));background:#fff;border:1px solid #e3e9e5;border-radius:14px;box-shadow:0 12px 32px rgba(23,38,31,.16);padding:12px 14px;cursor:pointer}
.notif-panel{position:fixed;top:62px;right:14px;z-index:17;width:min(360px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:#fff;border:1px solid #e3e9e5;border-radius:14px;box-shadow:0 12px 32px rgba(23,38,31,.16);padding:12px 14px}
.nb-head,.np-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.nb-x{border:0;background:none;font-size:18px;line-height:1;color:var(--mut);cursor:pointer;padding:0 2px}
.nb-t,.np-t{font-weight:700;font-size:14px;margin:4px 0}
.notif-banner ul,.notif-panel ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink)}
.np-head{font-size:13px;margin-bottom:6px}
.np-item{padding:10px 0;border-top:1px solid var(--line)}
.np-d{font-size:11px;color:var(--mut);font-weight:600}
.acc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:8px 0 6px}
@media (min-width:900px){ .acc-grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
.acc-stat,.acc-nav{display:block;width:100%;text-align:left;cursor:pointer;border:0;font-family:inherit;padding:14px 16px;min-width:0;color:var(--ink)}
.acc-stat:hover,.acc-nav:hover{box-shadow:0 6px 18px rgba(23,38,31,.12)}
.acc-l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.acc-v{font-size:28px;font-weight:700;margin-top:6px;color:var(--ink)}
.acc-v.alert{color:var(--bad)}
.acc-nav{min-height:64px;font-size:15px;font-weight:700;color:var(--brand);display:flex;align-items:center}
@media (max-width:899px){ .app > .row:first-child{padding-right:44px} }

.fb-wrap.rep{bottom:72px}
.fb-panel{position:fixed;left:14px;bottom:80px;width:300px;max-width:calc(100% - 28px);background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:25}
.fb-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:move;user-select:none;touch-action:none;font-weight:600}
.fb-body{padding:12px}
.fb-close{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--mut);padding:0 4px}
.fb-btn{width:48px;height:48px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 6px 18px rgba(23,38,31,.18);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.fb-btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(23,38,31,.24)}
.fb-btn svg{width:22px;height:22px}
.fb-x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.fb-edge{border:0;background:var(--brand);color:#fff;width:22px;height:44px;border-radius:0 10px 10px 0;font-size:20px;line-height:1;padding:0;cursor:pointer;box-shadow:2px 2px 8px rgba(0,0,0,.2)}
.flash{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:40;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;z-index:30;max-width:90%;font-size:14px}
/* ---------- Tableau de bord : cases carrées ---------- */
body.lg .dash-page h1{margin:0 0 4px}
body.lg .dash-page > h2:first-of-type{margin-top:6px}
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:8px 0 6px}
.dash-tile{aspect-ratio:1/1;display:flex;flex-direction:column;margin:0;padding:14px 16px;cursor:pointer;min-width:0;overflow:hidden}
.dash-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dash-lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);line-height:1.3;flex:1 1 0;min-width:0}
.dash-val{font-size:34px;font-weight:700;line-height:1;color:var(--ink);flex:none;white-space:nowrap}
.dash-val.alert{color:var(--bad)}
.dash-list{list-style:none;margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--line);flex:1;min-height:0;overflow:hidden}
.dash-list li{font-size:13px;line-height:1.35;padding:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (min-width:900px){ body.lg nav button.nav-copy{margin-top:16px;border:1px dashed #b9c9bf;color:var(--brand);background:#fff} body.lg nav a.nav-ecran{display:block;margin-top:16px;padding:9px 14px;box-sizing:border-box;border-radius:10px;border:1px dashed #b9c9bf;color:var(--brand);background:#fff;text-align:center;text-decoration:none;font:inherit} }
@media (max-width:899px){ nav button.nav-copy,nav button.nav-logout,nav a.nav-ecran{display:none} }
.vue-note{font-size:13px;color:var(--mut);margin:6px 0 0}
@media (min-width:900px){ body.lg .hdr-logout{display:none} body.lg nav button.nav-logout{margin-top:auto;color:var(--mut)} }

/* ---------- Tableau de bord : détails, graphiques, cibles ---------- */
.dash-list li{cursor:pointer}
.dash-list li:hover{color:var(--brand);text-decoration:underline}
.dash-charts{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:14px 0 6px}
.chart-card{margin:0;padding:16px}
.chart-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:8px}
.bar-row{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:10px;align-items:center;margin:9px 0;cursor:pointer}
.bar-row.static{cursor:default}
.bar-l{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--brand);border-radius:4px}
.bar-v{font-size:13px;font-weight:700;text-align:right}
.bar-row:not(.static):hover .bar-fill{opacity:.7}
.vbars{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:6px}
.vcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;min-width:0}
.vbar{width:100%;max-width:40px;background:var(--brand);border-radius:6px 6px 2px 2px}
.vval{font-size:12px;font-weight:700;margin-bottom:4px;white-space:nowrap}
.vlbl{font-size:12px;color:var(--mut);margin-top:6px;text-transform:capitalize}
.vcol:hover .vbar{opacity:.7}
@media (min-width:900px){ .dash-charts{grid-template-columns:repeat(2,minmax(0,1fr))} }
.focus-hl{box-shadow:0 0 0 3px rgba(31,77,63,.4)!important;transition:box-shadow .3s}

/* ---------- Réparations et ventes : deux cartes par ligne sur ordinateur ---------- */
.card-grid{display:block}
@media (min-width:900px){
  .card-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;grid-auto-rows:1fr}
  .card-grid > .card{margin:0;padding:12px 14px;height:100%}
}

/* ---------- Logo d'en-tête ---------- */
.logo-h{display:block;width:180px;height:auto;flex:none}
.dba-w{overflow:auto;max-height:62vh;max-width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surf)}
.dba-t{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.dba-t th,.dba-t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.dba-t th{position:sticky;top:0;z-index:1;background:var(--surf);cursor:pointer;user-select:none;font-weight:600;border-bottom:2px solid var(--line)}
.dba-t td.nul{color:var(--mut)}
.dba-t td.act{white-space:nowrap}
.dba-t tr.dba-fr th{position:static;cursor:default;border-bottom:1px solid var(--line);padding:5px 6px;background:var(--surf)}
.dba-t tr.dba-fr input{width:100%;min-width:90px;margin:0;padding:5px 7px;font-size:12px;font-weight:400;border-radius:8px}
.stk-row{display:grid;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(128,128,128,.25);grid-template-columns:var(--stk-cols,minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,.9fr) minmax(0,.9fr) 300px);min-width:max-content}
.stk-head{border-bottom:2px solid var(--line)}
/* Page Clients : barre de défilement toujours affichée */
html.scroll-on{overflow-y:scroll}
/* Liste des clients : une ligne par client en colonnes */
.card.cli-card{position:relative;padding:6px 12px;margin-bottom:6px}
body.lg .card.cli-card{padding:6px 14px;margin-bottom:6px}
.cli-head{display:grid;gap:10px;align-items:center;padding:0 12px 4px;font-size:12px;font-weight:700;color:var(--mut);grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.5fr) minmax(0,.6fr) minmax(0,.9fr) 44px}
body.lg .cli-head{padding:0 14px 4px}
.cli-head>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli-row{display:grid;gap:10px;align-items:center;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.5fr) minmax(0,.6fr) minmax(0,.9fr) 34px;min-height:34px}
.cli-row>div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.cli-caret{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.cli-alert{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font-weight:700;font-size:13px;line-height:20px;text-align:center}
.cli-body-wrap{display:grid;grid-template-rows:1fr;animation:cliIn .3s cubic-bezier(.2,.7,.2,1) both}
.cli-body-wrap.cli-out{animation:cliOut .2s ease-in both;pointer-events:none}
.cli-body{min-height:0;overflow:hidden}
.cli-in{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
@keyframes cliIn{from{grid-template-rows:0fr;opacity:0;transform:translateY(-4px)}to{grid-template-rows:1fr;opacity:1;transform:none}}
@keyframes cliOut{from{grid-template-rows:1fr;opacity:1}to{grid-template-rows:0fr;opacity:0}}
.cli-body-wrap.cli-still{animation:none}
.cli-dev-last>.card{margin:0 !important;flex:1}
/* Mes appareils (espace client) : une carte par appareil, comme la fiche du réparateur */
.card.dev-card2{display:flex;gap:14px;align-items:stretch;padding:12px;margin-bottom:10px}
.dev-ph{flex:0 0 130px;width:130px;height:130px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}
.dev-ph img{width:100%;height:100%;object-fit:cover}
.dev-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dev-st{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:14px}
.dev-side{flex:0 0 auto;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;gap:8px}
@media (max-width:600px){ .dev-ph{flex-basis:96px;width:96px;height:96px} .card.dev-card2{padding:10px;gap:10px} }
.dr-empty{border:1px dashed var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.6)}
.dr-form{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surf);animation:drIn .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes drIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.dr-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.dr-thumb{flex:0 0 44px;width:44px;height:44px;border-radius:10px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff}
.dr-thumb img{width:100%;height:100%;object-fit:cover}
.dr-k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.dr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dr-full{grid-column:1 / -1}
.dr-l{font-size:12px;font-weight:600;color:var(--mut);margin:0 0 4px}
@media (max-width:600px){.dr-grid{grid-template-columns:1fr}}
.dr-prev{margin:12px 0}
.dr-ticket{border-left:4px solid var(--brand);background:#f6f9f7;border-radius:12px;padding:10px 12px}
.dr-tname{font-weight:700;font-size:15px;margin:2px 0 6px;overflow-wrap:anywhere}
.dr-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dr-pill{display:inline-block;background:#e7f6ec;color:#1f8a4c;border:2px solid #1f8a4c;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}
/* Photo d’appareil : même taille pour tous les appareils (230 px sur ordinateur, 112 px sur téléphone) */
@media (max-width:600px){ .dev-sq{height:auto !important;width:112px !important} }
@media (prefers-reduced-motion: reduce){.cli-body-wrap,.cli-body-wrap.cli-out{animation:none}}
@media (max-width:600px){
  .cli-head{display:none}
  .cli-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px;gap:1px 10px}
  .cli-row>div{white-space:normal}
  .cli-row>div:nth-child(1){grid-column:1;grid-row:1}
  .cli-row>div:nth-child(2){grid-column:2;grid-row:1}
  .cli-row>div:nth-child(3){grid-column:1 / span 2;grid-row:2}
  .cli-row>div:nth-child(4){grid-column:1;grid-row:3}

  .cli-row>.cli-c{font-size:13px}
  .cli-row>.cli-c[data-l="Créé le"]::before{content:"Créé le : ";font-weight:600}
}
.stk-head>span{position:relative;padding-right:10px}

.ab-grid{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,.8fr);gap:8px}

.ic::after{width:2px;height:16px}

body.lg .cl-mhead{position:sticky;top:0;z-index:6;background:#f4f6f5;margin-left:-20px !important;margin-right:-20px !important;padding:10px 20px 6px !important}
/* ---------- Thème : fond clair et cartes en verre dépoli ---------- */
body.lg{background:#f4f6f5;color:#17261f;min-height:100vh}
body.lg h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:6px 0 16px}

const LOGO_SRC = "logo.png";
let SB = supabase.createClient("https://bagucelglclcssoclyaw.supabase.co", "sb_publishable_AMjguQV7hN0iXFLhhUhIiw_kgsK9B3O");
const MAIL = "seconde.vie.nantes.44@gmail.com";

// Clé API Google Maps (Places). Vide = pas d’autocomplétion, seul le bouton « Chercher sur Google Maps » reste.

const fullName = c => [c && c.prenom, c && c.nom].filter(Boolean).join(" ") || "Sans nom";

const fr = d => d ? new Date(d + "T00:00").toLocaleDateString("fr-FR") : "–";
function left(d){ if(!d) return null; const e = new Date(d + "T00:00"), t = new Date(); t.setHours(0,0,0,0); return Math.round((e - t) / 864e5); }
function jours(n){ return n == null ? "" : n < 0 ? "Délai dépassé" : n == 0 ? "aujourd’hui" : n + (n > 1 ? " jours restants" : " jour restant"); }
function pcs(id){ return S.pieces.filter(p => p.dossier_id === id); }

let S = {dossiers:[], pieces:[], clients:[], stock:[], inv:[], devices:[], catalogue:[], sav:[], feedback:[], ventes:[], stockApp:[], depenses:[], appBase:[]};

function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function msgErr(e){
  const m = e.message || "";
  if (e.code === "23505" || /duplicate key/.test(m)) return "Ce client existe déjà (même téléphone ou email).";
  if (/Invalid login credentials/.test(m)) return "Email ou mot de passe incorrect.";
  if (/already registered/.test(m)) return "Un compte existe déjà avec cet email : utilise « J’ai déjà un compte ».";
  return m;
}
function showModal(html){ $("modal").innerHTML = '<div class="card">' + html + '</div>'; $("modal").classList.remove("hide"); }
function closeModal(){ $("modal").classList.add("hide"); }
function showDup(name){
  showModal(`<div class="t" style="font-size:18px">Compte déjà existant</div>

  <button class="btn ghost" onclick="closeModal()">Fermer</button>`);
}

/* ---------- Données ---------- */
async function loadAll(){
  const q = [
    SB.from("dossiers").select("*, clients(prenom,nom)").order("created_at", {ascending:false}),
    SB.from("pieces_dossier").select("*")
  ];
  if (ROLE === "rep") q.push(SB.from("clients").select("*").order("nom"), SB.from("stock").select("*").order("sku"), SB.from("invitations").select("*"));
  else q.push(SB.from("clients").select("*"));
  const r = await Promise.all(q);
  const bad = r.find(x => x.error); if (bad) throw bad.error;
  S.dossiers = r[0].data; S.pieces = r[1].data; S.clients = r[2].data;
  if (ROLE === "rep"){ S.stock = r[3].data; S.inv = r[4].data; }
  const dv = await SB.from("devices").select("*");
  if (dv.error) throw dv.error;
  S.devices = dv.data;
  if (ROLE === "rep") { const cg = await SB.from("catalogue").select("*"); S.catalogue = cg.data || []; if (cg.error) toast("Catalogue : " + msgErr(cg.error)); }
  const vt = await SB.from("ventes").select("*");
  if (vt.error) { S.ventes = []; if (ROLE === "rep") toast("Ventes : " + msgErr(vt.error)); } else S.ventes = vt.data || [];
  { const ab = await SB.from("appareils_base").select("*"); S.appBaseErr = !!ab.error && ROLE === "rep"; S.appBase = ab.error ? [] : (ab.data || []); }
  enrichirAppareils();
  if (ROLE === "rep") { const sa = await SB.from("stock_appareils").select("*").order("nom"); if (sa.error) toast("Appareils à vendre : " + msgErr(sa.error)); else S.stockApp = sa.data || []; }
  const sv = await SB.from("sav").select("*").order("created_at", {ascending:false});
  if (sv.error) toast("SAV : " + msgErr(sv.error)); else S.sav = sv.data || [];
  const av = await SB.from("avoirs").select("*").order("date", {ascending:false});
  S.avoirs = av.error ? [] : (av.data || []);
  await reloadPhotos();
  if (ROLE === "rep") { const dp = await SB.from("depenses").select("*").order("date", {ascending:false}); if (dp.error) { S.depenses = []; toast("Dépenses : " + msgErr(dp.error)); } else S.depenses = dp.data || []; }
  if (ROLE === "rep") { const idr = await SB.from("idees").select("*").order("created_at", {ascending:false}); if (idr.error) toast("Idées : " + msgErr(idr.error)); else S.idees = idr.data || []; }
  if (ROLE === "rep") {
    const fb = await SB.from("feedback").select("*").order("created_at", {ascending:false});
    if (fb.error) toast("Suggestions : " + msgErr(fb.error)); else S.feedback = fb.data || [];
  }
}
async function reload(){ if (DEMO) return render(); try { await loadAll(); } catch(e){ toast("Erreur : " + msgErr(e)); } render(); }

/* ---------- Connexion ---------- */
function loginView(){
  if (CM === "forgot") return forgotView();
  const isNew = CM === "code" || CM === "data";
  const login = !isNew && CM !== "pick";
  const perso = CM === "data" ? `<div class="two"><div><label>Prénom *</label><input id="nP"></div><div><label>Nom *</label><input id="nN"></div></div>

    </div>
    <div class="lg-photo" aria-hidden="true"><img src="hero-connexion.jpg" alt=""></div>
    <div class="lg-form">
      ${pick}
      <div class="card">
        ${login ? '<h1 class="lg-h1">Connexion</h1><p class="lg-sub">Accédez à vos achats et à vos réparations.</p>' : ""}
        ${perso}
        <label>Email${req}</label><input id="lE" type="email" autocomplete="username" onkeydown="if(event.key==='Enter'){event.preventDefault();doLogin()}">
        <label>Mot de passe${req}</label>
        <div class="lg-pwd"><input id="lP" type="password" autocomplete="${isNew ? "new-password" : "current-password"}" onkeydown="if(event.key==='Enter'){event.preventDefault();doLogin()}"><button type="button" class="lg-show" aria-label="Afficher le mot de passe" onclick="togglePwdBtn(this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.8 19.8 0 0 1-3.17 4.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><path d="M1 1l22 22"></path></svg></button></div>
        <label class="lg-mobonly" style="font-weight:400;display:flex;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" onchange="$('lP').type=this.checked?'text':'password'" style="width:auto;margin:0"> Afficher le mot de passe</label>
        ${login ? '<a href="#" class="lg-forgot-d" onclick="setCM(\'forgot\');return false">Mot de passe oublié ?</a>' : ""}
        ${code}
        <div class="err" id="lErr"></div>
        <button class="btn" onclick="doLogin()">${isNew ? "Créer mon espace" : "Se connecter"}</button>
        ${isNew ? '<button class="btn ghost" onclick="setCM(\'login\')">Retour à la connexion</button>' : '<div class="lg-sep"><span>Pas encore de compte ?</span><button class="btn ghost lg-create-d" onclick="setCM(\'pick\')">Créer mon espace</button></div><button class="btn ghost lg-mobonly" onclick="setCM(\'pick\')">Créer mon espace</button><button class="btn ghost lg-mobonly" onclick="setCM(\'forgot\')">Mot de passe oublié ?</button>'}
      </div>
    </div>
  </div>`;
}
function togglePwdBtn(b){ const p = $('lP'); const eye = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>', off = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.8 19.8 0 0 1-3.17 4.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><path d="M1 1l22 22"></path></svg>'; p.type = p.type === "password" ? "text" : "password"; const shown = p.type === "text"; b.innerHTML = shown ? eye : off; b.setAttribute("aria-label", shown ? "Masquer le mot de passe" : "Afficher le mot de passe"); }

function forgotView(){
  return `<img src="${LOGO_SRC}" alt="Seconde Vie" style="display:block;width:180px;max-width:70%;margin:10px auto 14px">
  <div class="card"><div class="t">Mot de passe oublié</div>

    <div class="err" id="fErr"></div>
    <button class="btn" onclick="doForgot()">Envoyer le lien</button>
    <button class="btn ghost" onclick="setCM('login')">Retour à la connexion</button>
  </div>`;
}
async function doForgot(){
  const e = $("fE").value.trim(), err = $("fErr"); err.textContent = "";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { err.textContent = "L’email n’est pas valide."; return; }
  const { error } = await SB.auth.resetPasswordForEmail(e, { redirectTo: location.origin + location.pathname });
  if (error) { err.textContent = msgErr(error); return; }
  CM = "login";
  render();
  toast("Si un compte existe pour cet email, un lien vient d’être envoyé.");
}

/* Écran affiché quand l’utilisateur revient du lien reçu par email */
function recoveryView(){
  return `<img src="${LOGO_SRC}" alt="Seconde Vie" style="display:block;width:180px;max-width:70%;margin:10px auto 14px">
  <div class="card"><div class="t">Nouveau mot de passe</div>
    <label>Nouveau mot de passe *</label><input id="rP1" type="password" autocomplete="new-password">
    <label>Confirmer le mot de passe *</label><input id="rP2" type="password" autocomplete="new-password">
    <div class="err" id="rErr"></div>
    <button class="btn" onclick="doRecovery()">Enregistrer le mot de passe</button>
  </div>`;
}
async function doRecovery(){
  const p1 = $("rP1").value, p2 = $("rP2").value, err = $("rErr"); err.textContent = "";
  if (p1.length < 6) { err.textContent = "Le mot de passe doit contenir au moins 6 caractères."; return; }
  if (p1 !== p2) { err.textContent = "Les deux mots de passe ne sont pas identiques."; return; }

async function doLogin(){
  const e = $("lE").value.trim(), p = $("lP").value, err = $("lErr");
  err.textContent = "";
  if (!e || !p) { err.textContent = "Email et mot de passe requis."; return; }
  if (CM === "login") {
    const { error } = await SB.auth.signInWithPassword({ email: e, password: p });
    if (error) { err.textContent = msgErr(error); return; }
    return boot();
  }
  const v = id => $(id).value.trim();
  let d = null, code = "";
  if (CM === "data") {
    d = {prenom:v("nP"), nom:v("nN"), tel:v("nT"), adr:v("nA"), cp:v("nCp"), ville:v("nV")};
    if (!d.prenom || !d.nom || !d.tel || !d.adr || !d.cp || !d.ville) { err.textContent = "Tous les champs marqués * sont obligatoires."; return; }
    if (!/^[0-9+ .\-]{6,20}$/.test(d.tel)) { err.textContent = "Le téléphone ne doit contenir que des chiffres."; return; }
    if (!/^\d{5}$/.test(d.cp)) { err.textContent = "Le code postal doit comporter 5 chiffres."; return; }
  } else {
    code = v("lC");
    if (!/^\d{6}$/.test(code)) { err.textContent = "Le code doit comporter 6 chiffres."; return; }
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { err.textContent = "L’email n’est pas valide."; return; }
  const { error: se } = await SB.auth.signUp({ email: e, password: p });
  if (se) { err.textContent = msgErr(se); return; }
  const { error: le } = await SB.auth.signInWithPassword({ email: e, password: p });
  if (le) { err.textContent = msgErr(le); return; }
  if (code) {
    const { error: ce } = await SB.rpc("claim_invitation", { p_code: code });
    if (ce) { err.textContent = /code_invalide/.test(ce.message) ? "Code invalide ou déjà utilisé. Ton compte est créé : reconnecte-toi, ou contacte ton réparateur." : "Erreur : " + ce.message; return; }
  } else {
    const { data: u } = await SB.auth.getUser();
    const { error: ie } = await SB.from("clients").insert({ ...d, mail: e, auth_user_id: u.user.id });
    if (ie) {
      err.textContent = ie.code === "23505" ? "Un client existe déjà avec ce téléphone ou cet email. Utilise ton code d’invitation ou contacte ton réparateur." : msgErr(ie);
      return;
    }
  }
  CM = "login";
  await boot();
}

function fitDashVals(){
  document.querySelectorAll(".dash-tile").forEach(t => {
    const v = t.querySelector(".dash-val"), l = t.querySelector(".dash-lbl");
    if (!v || !l) return;
    v.style.fontSize = "";
    const h = t.querySelector(".dash-head");
    const ok = () => {
      const hr = h.getBoundingClientRect(), vr = v.getBoundingClientRect(), lr = l.getBoundingClientRect();
      return vr.right <= hr.right + 0.5 && lr.right <= vr.left - 4 && l.scrollWidth <= l.clientWidth + 1;
    };

  });

/* Chiffre d’affaires : réparations et mods remis (argent encaissé, daté de la remise) + ventes archivées (prix, daté de la vente) − dépenses (daté de la dépense). */
function caDetail(key){
  const rep = (S.dossiers || []).filter(d => d.statut === "Remis" && String(d.echeance || "").slice(0, 7) === key).reduce((t, d) => t + payInfo(d).tot, 0);
  const ven = (S.ventes || []).filter(v => v.archivee && moisOf(v) === key).reduce((t, v) => t + (+v.prix || 0), 0);
  const dep = (S.depenses || []).filter(x => String(x.date || "").slice(0, 7) === key).reduce((t, x) => t + (+x.montant || 0), 0);
  return {rep, ven, dep, net: rep + ven - dep};
}
function caTotal(){
  const rep = (S.dossiers || []).filter(d => d.statut === "Remis").reduce((t, d) => t + payInfo(d).tot, 0);
  const ven = (S.ventes || []).filter(v => v.archivee).reduce((t, v) => t + (+v.prix || 0), 0);
  const dep = (S.depenses || []).reduce((t, x) => t + (+x.montant || 0), 0);
  return rep + ven - dep;
}
function ultimes6(cur){
  const [cy, cm] = cur.split("-").map(Number), out = [];
  for (let i = 5; i >= 0; i--) {
    const dt = new Date(cy, cm - 1 - i, 1);
    out.push({key: dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0"), lbl: dt.toLocaleDateString("fr-FR", {month: "short"}).replace(".", "")});
  }
  return out;
}

var REP_STATE = {arch: false, statut: "", paie: "", from: "", to: "", sort: "date", desc: true, vue: "cases"};
function repSet(k, v){ REP_STATE[k] = v; render(); }
function repArch(on){ REP_STATE.arch = on; REP_STATE.statut = ""; if (on && REP_STATE.sort === "garantie") REP_STATE.sort = "date"; render(); }
function repFin(d){ return (d.statut === "Remis" ? d.echeance : d.date_termine) || null; }
function repSolde(d){ return payInfo(d).reste === 0; }
function garantieRest(d){ if (d.statut !== "Remis" || !d.echeance) return null; return left(plus6m(d.echeance)); }
function garantieMoisRest(fin){
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const f = new Date(fin + "T00:00");
  let m = (f.getFullYear() - t.getFullYear()) * 12 + (f.getMonth() - t.getMonth());
  if (f.getDate() < t.getDate()) m--;
  return Math.max(0, m);
}
function repKey(d){
  const k = REP_STATE.sort;
  if (k === "appareil") return d.appareil || "";
  if (k === "client") return d.clients ? fullName(d.clients) : "";
  if (k === "prix") return payInfo(d).tot;
  if (k === "garantie") return garantieRest(d);
  return repFin(d);
}
function repCmp(a, b){
  const va = repKey(a), vb = repKey(b);
  if (va == null && vb == null) return 0;
  if (va == null) return 1;            // sans valeur : toujours en bas
  if (vb == null) return -1;
  const r = typeof va === "number" ? va - vb : String(va).localeCompare(String(vb), "fr");
  return REP_STATE.desc ? -r : r;
}
function repList(){
  const st = REP_STATE;
  let list = S.dossiers.filter(d => st.arch ? d.statut === "Remis" : d.statut !== "Remis");
  if (st.statut) list = list.filter(d => d.statut === st.statut);
  if (st.paie === "reste") list = list.filter(d => !repSolde(d));
  if (st.paie === "regle") list = list.filter(d => repSolde(d));
  if (st.from) list = list.filter(d => repFin(d) && repFin(d) >= st.from);
  if (st.to) list = list.filter(d => repFin(d) && repFin(d) <= st.to);
  return list.slice().sort(repCmp);
}
function repGar(d){

  if (rest == null) return {t: "—", c: "var(--mut)"};
  if (rest <= 0) return {t: "0 mois · pas garanti", c: "var(--bad)"};
  const m = garantieMoisRest(plus6m(d.echeance));
  return {t: m > 0 ? m + (m > 1 ? " mois restants" : " mois restant") : "moins d’1 mois restant", c: rest <= 30 ? "var(--warn)" : "var(--brand)"};
}

function plus30(dateStr){
  const b = dateStr ? new Date(dateStr + "T00:00") : new Date();
  b.setHours(0, 0, 0, 0); b.setDate(b.getDate() + 30);
  return b.getFullYear() + "-" + String(b.getMonth() + 1).padStart(2, "0") + "-" + String(b.getDate()).padStart(2, "0");
}
function durNorm(v){
  const t = (v || "").trim().replace(/\s+/g, "");
  if (!t) return null;
  const m = t.match(/^(\d+(?:[.,]\d+)?)h?$/i);
  return m ? m[1].replace(",", ".") + "h" : t;
}
function todayIso(){
  const t = new Date();

}

function payInfo(d){
  const vir = +d.paye_virement || 0, esp = +d.paye_especes || 0, aco = +d.acompte || 0, rep = +d.reprise_montant || 0, tot = vir + esp + aco;
  const prix = d.prix == null ? null : +d.prix;
  return {vir, esp, aco, rep, tot, prix, reste: prix == null ? null : Math.max(0, prix - tot - rep), trop: prix == null ? 0 : Math.max(0, tot + rep - prix)};
}
/* Acompte enregistré avant la répartition espèces / virement : compté tant qu'aucune répartition n'est saisie. */

var FB_PAGE = "Espace client";
function detectPage(){
  if (ROLE !== "rep") return "Espace client";
  const mid = window.innerHeight * 0.5;
  let best = null, bestTop = -Infinity;
  document.querySelectorAll("[data-page]").forEach(el => {
    const top = el.getBoundingClientRect().top;
    if (el.offsetParent !== null && top <= mid && top > bestTop) { best = el; bestTop = top; }
  });
  if (best) return best.getAttribute("data-page");
  if (ROLE !== "rep") return "Espace client";
  const nav = REP_NAV.find(([v]) => v === VIEW);
  return "Espace réparateur" + (DOSSIER ? " · Détail réparation" : nav ? " · " + nav[1] : "");
}

  {id: "2026-11-16-br", date: "16/11/2026", titre: "Déplacement horizontal des photos", items: [
    "Pendant le déplacement, la photo ne bouge que de gauche à droite, sur sa ligne, et se réordonne avec ses voisines de la même ligne."]},
  {id: "2026-11-16-by", date: "16/11/2026", titre: "Appareils sans menu déroulant sur ordinateur", items: ["Sur ordinateur, chaque appareil affiche directement sa fiche : plus de flèche à dérouler.", "Sur téléphone, la liste reste repliable."]},
  {id: "2026-11-16-bx", date: "16/11/2026", titre: "Ce que le client peut modifier sur ses appareils", items: ["Le client ne peut plus ajouter ni modifier un appareil.", "Il peut renseigner l’IMEI ou le N° de série s’il manque (une seule fois), et ajouter ou modifier le code PIN de son téléphone.", "L’état et les autres informations restent visibles et sont modifiés par le réparateur."]},
  {id: "2026-11-16-bw", date: "16/11/2026", titre: "Mes appareils plus compacts, aussi sur l’accueil", items: ["Sur ordinateur, l’accueil affiche « Mes appareils » en tuiles (deux, puis « Voir plus ») ; un clic ouvre l’appareil.", "La fiche déroulée est plus courte : photo plus petite et réparations en une ligne."]},
  {id: "2026-11-16-bv", date: "16/11/2026", titre: "Mes appareils comme la liste des clients", items: ["Dans ton espace, « Mes appareils » est une liste : un en-tête par colonne (appareil, couleur, numéro de série ou IMEI, état, réparations).", "Clique sur un appareil pour le dérouler : photo, identifiants, réparations et bouton Modifier."]},
  {id: "2026-11-16-bu", date: "16/11/2026", titre: "Repère ! pour les éléments non reliés", items: ["Le bouton « À relier à la base » est retiré.", "Une pièce du stock ou un appareil de client non relié à la base Appareils porte un « ! » rouge à côté de son nom."]},
  {id: "2026-11-16-bt", date: "16/11/2026", titre: "Envoi même si un ancien fichier porte le même nom", items: [
    "Si un fichier du même nom existe déjà dans le stockage, la photo est envoyée sous un nom unique au lieu d’échouer."]},
  {id: "2026-11-16-bs", date: "16/11/2026", titre: "Déplacement plus réactif", items: [
    "La photo se déplace dès qu’elle entre au quart de la photo voisine, au lieu d’attendre le milieu."]},
  {id: "2026-11-16-bq", date: "16/11/2026", titre: "Déplacement des photos plus fluide", items: [
    "La photo soulevée suit le doigt ou la souris. Une case en pointillés indique où elle va se poser, et les autres photos glissent doucement."]},
  {id: "2026-11-16-bp", date: "16/11/2026", titre: "Ordre des photos enregistré", items: [
    "Le tri par glisser-déposer est vérifié dans la base : s’il n’est pas enregistré, un message rouge l’indique au lieu de revenir en silence.",
    "« Ordre enregistré » confirme la sauvegarde."]},
  {id: "2026-11-16-bo", date: "16/11/2026", titre: "Photos affichées à jour (cache)", items: [
    "Chaque photo a une adresse propre à sa ligne : une photo remplacée ne réapparaît plus avec l’ancienne image mise en cache par le navigateur."]},
  {id: "2026-11-16-bn", date: "16/11/2026", titre: "Résultat de chaque suppression de photo", items: [
    "Après chaque suppression, la fiche indique si la ligne a bien été retirée de la base et si le fichier a été effacé.",
    "Si la base annonce la suppression mais que la ligne existe encore, un message rouge le signale."]},
  {id: "2026-11-16-bm", date: "16/11/2026", titre: "Photos à jour à l’ouverture d’une fiche", items: [
    "À l’ouverture d’une fiche d’appareil, les photos sont relues depuis la base : une photo supprimée ailleurs ne reste plus affichée."]},
  {id: "2026-11-16-bl", date: "16/11/2026", titre: "Raison du refus de suppression affichée", items: [
    "Si une photo ne peut pas être supprimée, la raison reste affichée en rouge dans la fiche de l’appareil."]},
  {id: "2026-11-16-bk", date: "16/11/2026", titre: "Photos sans fichier dans la galerie", items: [
    "Dans Bases de données > Galerie, une photo dont le fichier n’existe plus est signalée.",
    "« Retirer les lignes sans fichier » supprime ces lignes de la base (après déverrouillage)."]},
  {id: "2026-11-16-bj", date: "16/11/2026", titre: "Image prioritaire sur le code hexa", items: [
    "Si une couleur a une image et un code hexa, c’est l’image qui s’affiche dans la case. Le code hexa reste enregistré et sert quand il n’y a pas d’image."]},
  {id: "2026-11-16-bi", date: "16/11/2026", titre: "Colonnes manquantes : SQL affiché", items: [
    "Si Supabase signale une colonne manquante dans « photos », le message affiche le SQL complet à exécuter."]},
  {id: "2026-11-16-bh", date: "16/11/2026", titre: "Image de couleur entière", items: [
    "L’image d’une couleur tient entièrement dans sa case, sans être rognée."]},
  {id: "2026-11-16-bg", date: "16/11/2026", titre: "Modifier, remplacer ou supprimer une couleur", items: [
    "Dans la fiche d’un appareil, chaque couleur a trois boutons : crayon (modifier le nom et le code hexa), upload (remplacer l’image) et corbeille (supprimer la couleur et ses photos)."]},
  {id: "2026-11-16-bf", date: "16/11/2026", titre: "Galerie dans Bases de données", items: [
    "Nouvelle entrée « Galerie (photos) » : toutes les photos, avec des filtres par origine (modèle, couleur, appareil client, réparation, Qualirépar).",
    "Supprimer une photo la retire vraiment de la base, et un message s’affiche si la base refuse."]},
  {id: "2026-11-16-be", date: "16/11/2026", titre: "Fond blanc à l’envoi des photos", items: [
    "Les photos détourées sont converties sur fond blanc (et non noir) au moment de l’envoi.",
    "Les photos déjà envoyées gardent leur fond noir : il suffit de les retirer puis de les réenvoyer."]},
  {id: "2026-11-16-bd", date: "16/11/2026", titre: "Fond blanc pour les images", items: [
    "Les photos détourées (sans fond) s’affichent sur fond blanc : fiches appareils, galeries, vignettes et fiches clients."]},
  {id: "2026-11-16-bc", date: "16/11/2026", titre: "Ajouter une couleur depuis la fiche", items: [
    "« Ajouter une couleur » ouvre maintenant un petit formulaire dans la fiche : nom, code hexa ou couleur, image facultative.",
    "La couleur est enregistrée tout de suite et la fiche reste ouverte."]},
  {id: "2026-11-16-bb", date: "16/11/2026", titre: "Fiche d’un appareil par couleur", items: [
    "En cliquant sur un appareil de la liste, sa fiche se déroule : image par défaut, puis une section par couleur avec ses photos.",
    "Le bouton « + Ajouter une couleur » ouvre l’édition des couleurs.",
    "Sur les fiches clients, la photo de la couleur de l’appareil est prise en premier."]},
  {id: "2026-11-16-ba", date: "16/11/2026", titre: "Photos : retirer et changer l’ordre", items: [
    "Chaque photo a une petite poubelle en haut à droite pour la retirer.",
    "On peut glisser une photo pour changer l’ordre. Le nouvel ordre est enregistré."]},
  {id: "2026-11-16-az", date: "16/11/2026", titre: "Couleurs en cases avec code hexa ou image", items: [
    "Chaque couleur d’un modèle est une case : nom, code hexa ou image. Le code hexa, s’il existe, s’affiche à la place de l’image.",
    "La colonne Couleur de la liste Appareils montre les cases."]},
  {id: "2026-11-16-ay", date: "16/11/2026", titre: "Plusieurs couleurs par appareil", items: [
    "Dans la liste Appareils, un modèle peut avoir plusieurs couleurs. Ajoute-les une par une avec « + Ajouter » : elles s’affichent en pastilles que tu peux retirer.",
    "La colonne Couleur les affiche séparées par « · »."]},
  {id: "2026-11-16-ax", date: "16/11/2026", titre: "Couleurs saisies pour manettes et téléphones", items: [
    "Pour les manettes et les téléphones, la couleur se saisit à chaque fois. Les couleurs déjà utilisées sont proposées en suggestion.",
    "Vente et stock sont concernés."]},
  {id: "2026-11-16-aw", date: "16/11/2026", titre: "Noms des colonnes dans la liste Appareils", items: [
    "La liste Appareils affiche maintenant le nom de chaque colonne : Type, Marque, Modèle, Couleur."]},
  {id: "2026-11-15-av", date: "15/11/2026", titre: "Couleur dans la liste Appareils", items: [
    "La liste Appareils a une colonne Couleur. Elle se remplit à l’ajout ou à la modification d’un modèle (liste ou nouvelle couleur, facultatif).",
    "La recherche prend aussi la couleur en compte."]},
  {id: "2026-11-15-au", date: "15/11/2026", titre: "Envoi direct de photos", items: [
    "Le pictogramme d’ajout devient une flèche d’envoi : un clic ouvre directement le choix du fichier.",
    "La galerie d’un modèle ouverte dans la liste Appareils a une croix en haut à droite pour la fermer."]},
  {id: "2026-11-15-at", date: "15/11/2026", titre: "Pictogramme galerie dans la liste Appareils", items: [
    "Le bouton « Photos (n) » de la liste Appareils devient un pictogramme galerie, comme le crayon et la corbeille. Le nombre de photos s’affiche en petit."]},
  {id: "2026-11-15-as", date: "15/11/2026", titre: "Pictogramme pour ajouter des photos", items: [
    "Le bouton « + Ajouter des photos » devient un pictogramme appareil photo. Un clic déplie le champ d’envoi, avec sa croix en haut à droite."]},
  {id: "2026-11-15-ar", date: "15/11/2026", titre: "Croix de fermeture uniformisée", items: [
    "Les croix de fermeture des photos ont la même taille partout, quel que soit le navigateur."]},
  {id: "2026-11-15-aq", date: "15/11/2026", titre: "Croix pour fermer la galerie de l’appareil", items: [
    "Dans la galerie qui s’ouvre avec le bouton photo, « Fermer » devient une croix en haut à droite."]},
  {id: "2026-11-15-ap", date: "15/11/2026", titre: "Croix de fermeture déplacée", items: [
    "La croix pour fermer le champ d’ajout de photos est maintenant dans le coin haut droit du cadre."]},
  {id: "2026-11-15-ao", date: "15/11/2026", titre: "Ajout de photos plus discret", items: [
    "Le champ d’ajout de photos est replié : un bouton « + Ajouter des photos » l’ouvre, et une croix le referme.",
    "Une fois la photo envoyée, le champ se referme tout seul."]},
  {id: "2026-11-15-an", date: "15/11/2026", titre: "Défilement dans la liste Appareils", items: [
    "Sur petit écran, la liste des appareils se fait défiler de gauche à droite quand une ligne ne tient pas en entier."]},
  {id: "2026-11-15-am", date: "15/11/2026", titre: "Nom du modèle seul dans les fiches clients", items: [
    "Les appareils des fiches clients n’affichent que le modèle, sans la gamme (ex. « REDMI NOTE 5 » au lieu de « Redmi Note · REDMI NOTE 5 »)."]},
  {id: "2026-11-15-al", date: "15/11/2026", titre: "Noms propres pour les photos de modèles", items: [
    "Les photos ajoutées à un modèle de la page Appareils sont renommées automatiquement, par exemple « xiaomi-redmi-note-5-1.jpg ».",
    "Ces photos sont réutilisées sur les appareils des fiches clients."]},
  {id: "2026-11-15-ak", date: "15/11/2026", titre: "Photos des appareils de la base", items: [
    "Dans la page Appareils, chaque modèle peut recevoir plusieurs photos. Un bouton « Photos » ouvre la galerie et l’ajout de photos.",
    "La première photo du modèle s’affiche en vignette dans la liste et sur les appareils des clients."]},
  {id: "2026-11-15-aj", date: "15/11/2026", titre: "Créer une réparation depuis un appareil", items: [
    "Un appareil sans réparation affiche un bouton « + » qui ouvre le formulaire de nouvelle prestation : catalogue, prix, remise, durée, date et notes.",
    "Un aperçu se met à jour pendant la saisie, avec le même style que les cartes de réparation."]},
  {id: "2026-11-15-ai", date: "15/11/2026", titre: "Création de client : « + » réactif", items: [
    "Le « + » de création de client devient « - » quand le formulaire est ouvert, et le trait s’anime en douceur."]},
  {id: "2026-11-15-ah", date: "15/11/2026", titre: "Reste à payer en haut à droite", items: [
    "Dans la fiche client, le montant « reste à régler » ou « Réglé » est en haut à droite de la réparation."]},
  {id: "2026-11-15-ag", date: "15/11/2026", titre: "Déposé visible seulement en devis", items: [
    "Dans la fiche client, les pastilles « Déposé » et « À déposer » n’apparaissent que pour les devis en cours."]},
  {id: "2026-11-15-af", date: "15/11/2026", titre: "Barre des jours masquée au retour", items: [
    "Dans la fiche client, la barre « X j passés » est masquée quand la réparation est Terminée ou Remise. La barre « Retour avant le » et la garantie restent."]},
  {id: "2026-11-15-ae", date: "15/11/2026", titre: "Réparations remises : barre des jours retirée", items: [
    "Dans la fiche client, une réparation remise n’affiche plus « Remis le » ni la barre des jours restants. La progression, le paiement et la garantie restent."]},
  {id: "2026-11-15-ad", date: "15/11/2026", titre: "SAV retiré de la fiche client", items: [
    "Dans la fiche client et la fiche d’appareil, le bouton SAV n’apparaît plus sur les réparations."]},
  {id: "2026-11-15-ac", date: "15/11/2026", titre: "Photos d’appareils à la même taille", items: [
    "Toutes les photos d’appareils de la fiche client ont la même taille, alignées en haut sur leur réparation."]},
  {id: "2026-11-15-ab", date: "15/11/2026", titre: "Nom de la réparation sur la fiche client", items: [
    "Dans la fiche client et la fiche d’appareil, la réparation affiche son nom en titre, à la place de « modèle · client »."]},
  {id: "2026-11-15-aa", date: "15/11/2026", titre: "Nom du modèle sous la photo", items: [
    "Sous la photo de l’appareil, seul le nom du modèle s’affiche, centré (sans la couleur)."]},
  {id: "2026-11-15-z", date: "15/11/2026", titre: "Photo alignée sur la réparation", items: [
    "La photo de l’appareil reste carrée et sa hauteur, modèle compris, correspond exactement à la carte de la dernière réparation."]},
  {id: "2026-11-15-y", date: "15/11/2026", titre: "Photo d’appareil carrée", items: [
    "La photo de l’appareil dans la fiche client reste carrée, sans déformation."]},
  {id: "2026-11-15-x", date: "15/11/2026", titre: "Modifier se referme", items: [
    "Le crayon Modifier ouvre le formulaire du client ; un nouveau clic sur le crayon le referme.",
    "Le bouton « ← Retour à la liste » est retiré."]},
  {id: "2026-11-15-w", date: "15/11/2026", titre: "Ajouter une réparation depuis l’appareil", items: [
    "La photo de l’appareil dans la fiche client est plus grande et s’aligne sur la hauteur de la dernière réparation.",
    "Dans la fiche de l’appareil, le « + » à côté de Réparations ouvre un formulaire de réparation pour cet appareil, et devient « - » pour le refermer."]},
  {id: "2026-11-15-v", date: "15/11/2026", titre: "Retour depuis une fiche client", items: [
    "Bouton « ← Retour à la liste » dans la fiche client : elle se referme.",
    "Le bouton retour du navigateur ou du téléphone referme aussi la fiche client ouverte."]},
  {id: "2026-11-15-u", date: "15/11/2026", titre: "Fiche client comme la capture", items: [
    "Dans la fiche client : boutons Modifier et Supprimer en carrés à icônes, appareils avec leur photo et le modèle dessous, et la dernière réparation complète à droite.",
    "Le bouton « + » ajoute un appareil, avec son texte à côté."]},
  {id: "2026-11-15-t", date: "15/11/2026", titre: "Appareil ouvert dans la fiche client", items: [
    "Un clic sur la photo d’un appareil ouvre sa fiche dans la fiche du client : photo, infos, photos et réparations. « Retour au client » rétablit le détail."]},
  {id: "2026-11-15-s", date: "15/11/2026", titre: "Photo du modèle dans le carré", items: [
    "La photo du modèle Redmi Note 5 remplace l’icône dans le carré de l’appareil, même si le nom est écrit autrement (ex. « Note 5 » avec la marque Redmi, ou avec la couleur)."]},
  {id: "2026-11-15-r", date: "15/11/2026", titre: "Barre de défilement sur la page Clients", items: [
    "La barre de défilement reste toujours visible sur la page Clients, même quand la liste est courte."]},
  {id: "2026-11-15-q", date: "15/11/2026", titre: "Appareils des clients : photo et dernière réparation", items: [
    "Dans la fiche d’un client déroulée, chaque appareil affiche sa photo (carré) avec son modèle dessous, et à droite la date et la panne de sa dernière réparation.",
    "Photo du Xiaomi Redmi Note 5 bleu ajoutée au modèle Redmi Note 5."]},
  {id: "2026-11-15-p", date: "15/11/2026", titre: "Détails client plus fluides", items: [
    "Le détail d’un client se déroule et se replie en douceur, sans saut d’écran.",
    "En ouvrant une autre fiche, la précédente se replie d’abord."]},
  {id: "2026-11-15-o", date: "15/11/2026", titre: "Clients plus compacts sur téléphone", items: [
    "Sur téléphone, chaque client tient sur quatre lignes au lieu de six."]},
  {id: "2026-11-15-n", date: "15/11/2026", titre: "Page clients plus compacte", items: [
    "Les lignes de clients sont moins épaisses et le bouton Corbeille a davantage d’espace avec la liste."]},
  {id: "2026-11-15-m", date: "15/11/2026", titre: "Nouvelle liste des clients", items: [
    "Chaque client tient sur une ligne : Prénom Nom, numéro, mail, adresse, code postal et date de création.",
    "Le chevron à droite déroule la fiche du client (détail, appareils, actions) et se replie en appuyant de nouveau."]},
  {id: "2026-11-15-l", date: "15/11/2026", titre: "Photos Qualirépar liées à l’appareil", items: [
    "Les photos ajoutées depuis Qualirépar sont rattachées à l’appareil du client : une carte par appareil, avec ses réparations.",
    "Les photos des réparations restent dans leur réparation. La galerie de l’appareil regroupe toutes les photos, avec leur origine (Qualirépar, réparation ou galerie)."]},
  {id: "2026-11-15-k", date: "15/11/2026", titre: "Alerte client sans appareil en base", items: [
    "Un point rouge « ! » s’affiche en haut à droite de la fiche d’un client qui a un appareil absent de la base Appareils (par exemple un appareil effacé de la base)."]},
  {id: "2026-11-15-j", date: "15/11/2026", titre: "Appareils reliés à la base", items: [
    "Un appareil de client ajouté ou modifié par le réparateur est aussi ajouté à la base Appareils s’il n’y est pas.",
    "Bouton « À relier à la base » : liste les pièces et les appareils de clients qui ne sont pas reliés à la base, avec un bouton « Relier » pour les corriger."]},
  {id: "2026-11-15-i", date: "15/11/2026", titre: "Filtres des appareils", items: [
    "Appareils : le filtre par modèle est retiré. Il reste les filtres par type et par marque."]},
  {id: "2026-11-15-h", date: "15/11/2026", titre: "Catégories de dépenses", items: [
    "Dépenses : deux nouvelles catégories, Accessoire et Protection, avant Autre."]},
  {id: "2026-11-15-g", date: "15/11/2026", titre: "Stock et nom de réparation", items: [
    "Stock : même mise en page que Appareils. Le « + » carré ouvre le formulaire d’ajout, la recherche est à côté, puis viennent les filtres type, marque, modèle et stock, et le tri.",
    "Détail réparation : le nom ne se modifie que pour les dossiers Réparation et Mod ; un SAV affiche le nom sans le modifier."]},
  {id: "2026-11-15-f", date: "15/11/2026", titre: "Nouvelle prestation", items: [
    "Nouvelle prestation : la panne se choisit dans un menu des réparations du catalogue pour l’appareil choisi.",
    "Le prix et la durée sont remplis automatiquement ; une remise en € ou en % est déduite, et le prix final s’affiche avant l’enregistrement.",
    "« Autre (saisie libre) » permet de saisir une prestation absente du catalogue. La remise est notée dans les notes du dossier."]},
  {id: "2026-11-15-e", date: "15/11/2026", titre: "Gamme des appareils", items: [
    "Appareils : un champ « Gamme » facultatif après la marque, à la création comme à la modification (ex. Galaxy S, Redmi Note).",
    "Quand une gamme est choisie, la liste des modèles ne montre que les modèles de cette gamme."]},
  {id: "2026-11-15-d", date: "15/11/2026", titre: "Largeur des colonnes du stock", items: [
    "Stock : glisser le bord droit d’un titre de colonne pour l’élargir ou la réduire. La largeur est gardée sur cet appareil.",
    "« Largeurs par défaut » remet les colonnes comme avant."]},
  {id: "2026-11-15-c", date: "15/11/2026", titre: "Stock : crayon", items: [
    "Stock : « Modifier » devient une case carrée avec un crayon, à gauche de la croix « Supprimer »."]},
  {id: "2026-11-15-b", date: "15/11/2026", titre: "Stock : en-têtes et suppression", items: [
    "Stock : la liste a maintenant des en-têtes de colonnes (Nom, Type, Modèle, Référence, Réservé).",
    "Stock : « Supprimer » devient une case carrée avec un X centré, comme « Retirer » dans Appareils."]},
  {id: "2026-11-15-a", date: "15/11/2026", titre: "Liste du stock", items: [
    "Stock : les pièces s’affichent en liste alignée comme l’onglet Appareils (nom, type, modèle, référence, réservé), avec les boutons à droite."]},
  {id: "2026-11-14-c", date: "14/11/2026", titre: "Filtres des bases de données", items: [
    "Bases de données : une case « Filtrer » sous chaque colonne pour ne garder que les lignes qui contiennent le texte.",
    "Les filtres se combinent avec la recherche ; « Effacer les filtres » remet tout à zéro."]},
  {id: "2026-11-14-b", date: "14/11/2026", titre: "Bases de données en tableau", items: [
    "Bases de données : les lignes s’affichent dans un vrai tableau, une colonne par champ.",

var UPD_BANNER_DONE = false;

var DRAG = null;
function dragStart(e, panel){
  if (e.target.closest("button")) return;
  const pt = e.touches ? e.touches[0] : e, r = panel.getBoundingClientRect();
  DRAG = {panel, sx: pt.clientX, sy: pt.clientY, ox: r.left, oy: r.top};
  panel.style.bottom = "auto";
  panel.style.left = r.left + "px";
  panel.style.top = r.top + "px";
  if (e.cancelable) e.preventDefault();
}
function dragMove(e){
  if (!DRAG) return;
  const pt = e.touches ? e.touches[0] : e, p = DRAG.panel;
  const x = Math.max(0, Math.min(DRAG.ox + pt.clientX - DRAG.sx, innerWidth - p.offsetWidth));
  const y = Math.max(0, Math.min(DRAG.oy + pt.clientY - DRAG.sy, innerHeight - p.offsetHeight));
  p.style.left = x + "px";
  p.style.top = y + "px";
  if (e.cancelable) e.preventDefault();
}
function dragEnd(){ DRAG = null; }
document.addEventListener("mousemove", dragMove);
document.addEventListener("touchmove", dragMove, {passive: false});
document.addEventListener("mouseup", dragEnd);
document.addEventListener("touchend", dragEnd);
function openFeedback(){
  FB_PAGE = detectPage();

  p.innerHTML = `<div class="fb-head" id="fbHead"><span>Signaler ou suggérer</span><button class="fb-close" onclick="closeFeedback()" title="Fermer">×</button></div>
    <div class="fb-body">
    <label>Type</label><select id="fbType" onchange="if(this.value)$('fbMsg').focus()"><option value="">- sélectionner -</option><option>Suggestion</option><option>Bug</option></select>
    <div class="m" style="margin:4px 0 6px">Page : <b>${esc(FB_PAGE)}</b></div>
    <label>Ton message</label><textarea id="fbMsg" placeholder="Décris le problème ou ton idée"></textarea>
    <div class="m" style="margin:2px 0 6px;font-size:12px">Entrée envoie · Maj + Entrée pour aller à la ligne</div>
    <div class="err" id="fbErr"></div>
    <button class="btn" onclick="sendFeedback()">Envoyer</button>
    </div>`;
  $("fbType").value = FB_DRAFT.type;
  $("fbMsg").value = FB_DRAFT.msg;
  p.style.display = "block";

  $("fbMsg").focus();

function closeFeedback(){ saveFbDraft(); const p = $("fbPanel"); if (p) p.style.display = "none"; }
async function sendFeedback(){
  const err = $("fbErr"), msg = $("fbMsg").value.trim();

  if (!msg) { err.textContent = "Écris ton message."; return; }

    // Aperçu : la suggestion est ajoutée à la liste de démonstration (rien n'est enregistré en base)
    S.feedback = [{ id: "demo-fb-" + Date.now(), auteur: "Aperçu client", type: $("fbType").value, page: FB_PAGE, message: msg, created_at: new Date().toISOString(), archive: false, resolu: false }].concat(S.feedback || []);
    clearFbDraft();

function plus1an(dateStr){
  const b = new Date(dateStr + "T00:00"); b.setFullYear(b.getFullYear() + 1);

function garVente(v){

  if (!v.archivee) return '<div class="m" style="margin-top:6px">Garantie 1 an · démarre à la validation de la vente</div>';
  const debut = v.date_effectue || v.date_rdv, fin = plus1an(debut);
  const start = new Date(debut + "T00:00"), end = new Date(fin + "T00:00"), today = new Date(); today.setHours(0, 0, 0, 0);
  const pct = Math.min(100, Math.max(0, (today - start) / (end - start) * 100));
  const rest = left(fin);

  return '<div style="margin-top:8px"><div class="t" style="font-size:14px">Garantie 1 an</div>'
    + '<div style="height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px"><div style="height:100%;width:' + pct.toFixed(1) + '%;background:' + col + '"></div></div>'
    + '<div style="display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-weight:600;color:' + col + '"><span>Jusqu’au ' + fr(fin) + '</span><span>' + (rest < 0 ? "Garantie expirée" : jours(rest)) + '</span></div></div>';
}

function appStkHtml(){
  const all = S.stockApp || [];
  if (!all.length) return '<p class="m">Aucun appareil à vendre pour le moment.</p>';
  const q = nz(APP_Q).trim();
  const acmp = {
    dispo: (x, y) => (y.qte || 0) - (x.qte || 0),
    res: (x, y) => (y.res || 0) - (x.res || 0)
  }[ASORT] || ((x, y) => String(x.nom).localeCompare(String(y.nom)));
  const list = all
    .filter(x => !q || nz(x.nom).includes(q))
    .filter(x => !ATYPE || x.appareil === ATYPE)
    .filter(x => !AGRADE || (x.grade || "") === AGRADE)
    .filter(x => !AST || (AST === "dispo" ? x.qte > 0 : !(x.qte > 0)))
    .sort(acmp);
  if (!list.length) return '<p class="m">Aucun appareil trouvé.</p>';
  const groups = new Map();
  list.forEach(x => { const k = x.modele ? [x.appareil, x.categorie, x.modele].join("|") : x.id; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); });
  const couleurOf = x => String(x.nom || "").split(" · ")[3] || "";
  return [...groups.values()].map(items => {
    if (items.some(x => x.id === DEV_EDIT)) return devEditHtml(items.find(x => x.id === DEV_EDIT));
    const first = items[0];
    const title = [first.appareil, first.categorie, first.modele].filter(Boolean).join(" · ") || first.nom;
    const dispo = items.reduce((t, x) => t + (+x.qte || 0), 0), res = items.reduce((t, x) => t + (+x.res || 0), 0);
    const lignes = items.slice().sort((a, b) => (couleurOf(a) + (a.grade || "")).localeCompare(couleurOf(b) + (b.grade || ""))).map(x =>
      '<div onclick="editAppareil(\'' + x.id + '\')" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)">'
      + '<div><div class="t" style="font-size:14px">' + esc(couleurOf(x) || "Sans couleur") + (x.grade ? ' · Grade ' + esc(x.grade) : '') + '</div>'
      + (x.res > 0 ? '<div class="m">' + x.res + ' réservé' + (x.res > 1 ? "s" : "") + '</div>' : '') + '</div>'
      + '<span class="chip ' + (x.qte > 0 ? "ok" : "late") + '">' + (x.qte > 0 ? x.qte + " en stock" : "Rupture") + '</span></div>').join("");
    return '<div class="card"><div class="row" style="align-items:center"><div class="t">' + esc(title) + '</div><span class="chip ' + (dispo > 0 ? "ok" : "late") + '">' + (dispo > 0 ? dispo + " en stock" : "Rupture") + '</span></div>'

async function deleteAppStock(id){
  const s = (S.stockApp || []).find(x => x.id === id); if (!s) return;
  if (s.res > 0) { toast("Impossible : cet appareil est réservé pour une vente."); return; }
  if (!confirm("Supprimer « " + s.nom + " » du stock ?")) return;
  const { error } = await SB.from("stock_appareils").delete().eq("id", id);
  if (error) { toast(msgErr(error)); return; }
  DEV_EDIT = null; DEV_SEL = null;
  flash("Appareil supprimé");

}

var DOSS_TAB = "rep";
function setDossTab(t){ DOSS_TAB = t; render(); }
function agendaData(){
  const today = todayIso(), items = [], sans = [];
  const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
  S.dossiers.filter(d => d.statut !== "Remis").forEach(d => {
    const nom = [d.appareil, d.clients ? fullName(d.clients) : ""].filter(Boolean).join(" · ") || "Réparation";
    const go = "openD('" + d.id + "')";
    if (d.statut === "Terminé") {
      if (d.date_retour) items.push({date: d.date_retour, txt: "Limite de retrait · " + nom, go});
      else sans.push({txt: "Date de fin à définir · " + nom, go});
      return;
    }
    if (d.statut === "Devis") {
      if (d.date_recup) items.push({date: d.date_recup, txt: "Dépôt de l’appareil · " + nom, go});
      else sans.push({txt: "Date de dépôt à fixer · " + nom, go});
    }
    if (d.echeance) items.push({date: d.echeance, txt: "Prêt à rendre · " + nom, go});
    else sans.push({txt: "Date de prêt à fixer · " + nom, go});
  });
  S.pieces.filter(p => p.statut === "À commander").forEach(p => sans.push({txt: "Pièce à commander · " + p.qte + " × " + p.nom}));
  (S.ventes || []).filter(v => !v.archivee && !v.envoi).forEach(v => items.push({date: v.date_rdv, txt: "Vente · " + venteTitre(v) + " · " + venteClient(v) + (v.lieu ? " · " + v.lieu : "") + (v.heure_rdv ? " · " + String(v.heure_rdv).slice(0, 5) : "")}));
  return {
    today, sans,
    late: items.filter(e => e.date < today).sort(byDate),
    future: items.filter(e => e.date >= today).sort(byDate)
  };
}
function agendaBody(){
  const a = agendaData();
  const KIND = {vente: ["Vente", "#7c3aed"], pret: ["Prêt", "#1f8a4c"], retrait: ["Retrait", "#2563eb"], depot: ["Dépôt", "#c2410c"], autre: ["À faire", "#6b7280"], late: ["En retard", "#dc2626"]};
  const kindOf = t => /^Vente/.test(t) ? "vente" : /^Limite/.test(t) ? "retrait" : /^Prêt/.test(t) ? "pret" : /^Dépôt/.test(t) ? "depot" : "autre";
  const clean = t => t.replace(/^(Vente|Limite de retrait|Prêt à rendre|Dépôt de l’appareil) · /, "");
  const row = (e, late) => {
    const k = late ? "late" : kindOf(e.txt), [lab, col] = KIND[k];
    const detail = clean(e.txt) + (late && e.date ? " · " + fr(e.date) : "");
    return '<div' + (e.go ? ' onclick="' + e.go + '"' : '') + ' style="' + (e.go ? 'cursor:pointer;' : '') + 'border:1px solid var(--line);border-left:5px solid ' + col + ';border-radius:8px;padding:8px 10px;margin:6px 0">'
      + '<div style="font-size:11px;font-weight:700;color:' + col + ';text-transform:uppercase;letter-spacing:.04em">' + lab + '</div>'
      + '<div style="font-size:14px;margin-top:2px">' + esc(detail) + '</div></div>';
  };
  const head = (title, n, col) => '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 0 2px;padding-bottom:4px;border-bottom:2px solid ' + col + '"><b style="color:' + col + '">' + esc(title) + '</b><span class="m">' + n + '</span></div>';
  const dayTitle = k => {
    if (k === a.today) return "Aujourd’hui";
    const lbl = new Date(k + "T00:00").toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"});
    return lbl.charAt(0).toUpperCase() + lbl.slice(1);
  };
  const days = {};
  a.future.forEach(e => { (days[e.date] = days[e.date] || []).push(e); });
  let html = "";
  if (a.late.length) html += head("En retard ou à clôturer", a.late.length, "#dc2626") + a.late.map(e => row(e, true)).join("");
  Object.keys(days).sort().forEach(k => {
    const col = k === a.today ? "#1f8a4c" : "#374151";
    html += head(dayTitle(k), days[k].length + (days[k].length > 1 ? " éléments" : " élément"), col) + days[k].map(e => row(e, false)).join("");
  });
  if (a.sans.length) html += head("Sans date", a.sans.length, "#6b7280") + a.sans.map(e => row(e, false)).join("");
  return '<div class="card" style="margin-bottom:10px">' + (html || '<p class="m">Rien à faire pour le moment.</p>') + '</div>';
}

async function saveVente(){
  const err = $("vErr"); err.textContent = "";
  const passe = $("vPasse").checked, prixT = $("vPrix").value.trim().replace(",", ".");
  let client_id = null, client_nom = null;
  if (!passe) { client_id = $("vCli").value || null; if (!client_id) { err.textContent = "Sélectionne un client, ou coche « Client de passage »."; return; } }
  else {
    const t = $("vTyp").value;
    if (t === "sans") client_nom = "Client de passage";
    else if (t === "avec") { client_nom = $("vNom").value.trim(); if (!client_nom) { err.textContent = "Indique le nom."; return; } }
    else if (t === "leboncoin") { const ps = $("vPseudo").value.trim(); if (!ps) { err.textContent = "Indique le pseudo leboncoin."; return; } client_nom = "leboncoin : " + ps; }
    else { err.textContent = "Choisis sans nom, avec nom ou leboncoin."; return; }
  }
  const envoi = passe && $("vTyp").value === "leboncoin" && $("vEnvoi").checked;
  // si aucun modèle n’est ajouté, on prend celui qui est saisi dans le sélecteur
  if (!VENTE_LIGNES.length) {
    const r = vLigneFromForm();
    if (r.error) { err.textContent = r.error; return; }
    VENTE_LIGNES.push(r.line);
  }
  const date = envoi ? todayIso() : $("vDate").value;
  if (!date) { err.textContent = "Indique la date du rendez-vous."; return; }
  if (prixT !== "" && isNaN(parseFloat(prixT))) { err.textContent = "Prix invalide."; return; }
  const editing = !!VENTE_EDIT;
  const old = editing ? venteLignes((S.ventes || []).find(v => v.id === VENTE_EDIT) || {}) : [];
  const oldKeys = new Set(old.map(lineKey));
  for (const l of VENTE_LIGNES) {
    if (l.appareil_id || l.acheter || oldKeys.has(lineKey(l))) continue;
    err.textContent = (l.modele || "Ce modèle") + " : pas en stock. Choisis l’appareil du stock, ou coche « Pas en stock » pour le mettre dans les appareils à acheter.";
    return;
  }
  const had = lignesRes(old), want = lignesRes(VENTE_LIGNES);
  for (const id of Object.keys(want)) {
    const x = (S.stockApp || []).find(s => s.id === id);
    if (!x) { err.textContent = "Un appareil choisi n’est plus disponible en stock."; return; }
    const dispo = x.qte + (had[id] || 0);
    if (dispo < want[id]) { err.textContent = x.nom + " : stock insuffisant (" + dispo + " disponible(s), " + want[id] + " demandé(s))."; return; }
  }
  for (const l of VENTE_LIGNES) {
    if (!l.acheter || l.appareil_id) continue;
    const nom = [l.appareil, l.categorie, l.modele, l.couleur].filter(Boolean).join(" · ");
    if ((S.stockApp || []).some(x => x.nom === nom)) continue;
    const { error: ce } = await SB.from("stock_appareils").insert({ nom, appareil: l.appareil, categorie: l.categorie, modele: l.modele, qte: 0, res: 0, grade: null });
    if (ce) { err.textContent = "Création de l’appareil impossible : " + msgErr(ce); return; }
  }
  const first = VENTE_LIGNES[0];
  const row = {
    appareil: first.appareil, categorie: first.categorie, modele: first.modele, lignes: VENTE_LIGNES,
    lieu: envoi ? null : ($("vLieu").value.trim() || null), prix: prixT === "" ? null : parseFloat(prixT), date_rdv: date,
    heure_rdv: envoi ? null : ($("vHeure").value || null), lien_conv: $("vConv").value.trim() || null,
    envoi, transporteur: envoi ? ($("vTransp").value || null) : null, suivi: envoi ? ($("vSuivi").value.trim() || null) : null, envoi_statut: envoi ? $("vEnvStat").value : null,
    client_id, client_nom
  };
  const { error } = editing
    ? await SB.from("ventes").update(row).eq("id", VENTE_EDIT)
    : await SB.from("ventes").insert(row);
  if (error) { err.textContent = msgErr(error); return; }
  const ids = new Set([...Object.keys(had), ...Object.keys(want)]);
  for (const id of ids) {
    const dq = (had[id] || 0) - (want[id] || 0), dr = (want[id] || 0) - (had[id] || 0);
    if (dq || dr) { const e = await devAdj(id, dq, dr); if (e) toast(e); }
  }
  VENTE_OPEN = false; VENTE_EDIT = null; VENTE_LIGNES = []; VT_COMPAT = false; MP.v = []; PKS.v = {app:"", cat:""}; VT_SEL = null;
  flash(editing ? "Vente modifiée" : "Vente enregistrée");
  await reload();
}
async function acheterReserver(id, idx){
  const v = (S.ventes || []).find(x => x.id === id);
  if (!v || !Array.isArray(v.lignes) || !v.lignes[idx] || !v.lignes[idx].acheter) return;
  const l = v.lignes[idx], q = l.quantite || 1;
  const x = (S.stockApp || []).find(s => s.nom === [l.appareil, l.categorie, l.modele, l.couleur].filter(Boolean).join(" · "));
  if (!x || x.qte < q) { toast("Pas encore assez en stock : " + (x ? x.qte : 0) + " dispo sur " + q + " demandé(s)."); return; }
  const lignes = v.lignes.map((k, j) => j === idx ? Object.assign({}, k, {acheter: false, appareil_id: x.id}) : k);
  const { error } = await SB.from("ventes").update({ lignes }).eq("id", id);
  if (error) { toast(msgErr(error)); return; }
  const e = await devAdj(x.id, -q, q);
  if (e) toast(e);
  flash("Appareil réservé depuis le stock");
  await reload();
}
async function rdvFait(id){
  const v = (S.ventes || []).find(x => x.id === id); if (!v) return;
  const { error } = await SB.from("ventes").update({ archivee: true, date_effectue: todayIso(), client_affiche: venteClient(v) }).eq("id", id);
  if (error) { toast(msgErr(error)); return; }
  const r = lignesRes(venteLignes(v));
  for (const k of Object.keys(r)) { const e = await devAdj(k, 0, -r[k]); if (e) toast(e); }
  flash(v.envoi ? "Envoi validé : tout est bon, vente archivée ✓" : "RDV effectué : vente archivée");
  await reload();
}

/* Gammes des téléphones (tout sauf iPhone). Un modèle de gamme est enregistré sous « gamme · modèle ». */
/* Marques d’un type : seulement celles de la base Appareils (rien d’ajouté en dur) */
function marquesApp(app){ return abMarquesFor(app); }
/* Gamme : seulement celles saisies dans la base Appareils */
function hasGamme(app, cat){ return app === "Téléphone" && !!cat && abGammesFor(app, cat).length > 0; }
function gammesFor(app, cat){ return hasGamme(app, cat) ? abGammesFor(app, cat) : []; }
function modOpts(mods, gam, sel){
  const cut = gam ? gam.length + 3 : 0;
  return '<option value="">Modèle…</option>' + mods.map(m => '<option value="' + esc(m) + '"' + (m === sel ? ' selected' : '') + '>' + esc(cut ? m.slice(cut) : m) + '</option>').join("");
}
function catalogueView(){
  const rows = S.catalogue;
  if (!rows.length) return '<h1>Réparations &amp; Mods</h1><p class="m">Le catalogue est vide.</p><button class="btn" onclick="importCat()">Importer le catalogue de base</button>';
  const inApp = r => !CAT.app || r.appareil === CAT.app || (r.appareil === "Mods" && r.cible === CAT.app);
  const base = rows.filter(inApp);
  const brands = marquesApp(CAT.app);
  const gams = gammesFor(CAT.app, CAT.cat);
  const mods = gams.length ? (CAT.gam ? modelsFor(CAT.app, CAT.cat, CAT.gam) : []) : modelsFor(CAT.app, CAT.cat);
  const list = rows.filter(r => inApp(r) && (!CAT.cat || r.categorie === CAT.cat) && (!CAT.mod || r.modele === CAT.mod))
    .sort((a,b) => String(a.appareil).localeCompare(String(b.appareil), "fr") || String(a.categorie).localeCompare(String(b.categorie), "fr") || String(a.modele).localeCompare(String(b.modele), "fr") || a.reparation.localeCompare(b.reparation, "fr"));
  const aucune = CAT.mod ? "Aucune réparation pour ce modèle." : "Aucune réparation pour ce choix.";
  const corps = list.length
    ? list.map(r => (CAT.mod ? "" : catLibelle(r)) + catRow(r)).join("")
    : '<p class="m">' + aucune + '</p>';
  const body = corps + (CAT.mod ? addCatForm() : "")
    + (CAT.cat && !gams.length && !mods.length ? '<p class="m" style="margin-top:10px">Pour ajouter un modèle, crée-le d’abord dans l’onglet Appareils.</p>' : "");
  return '<h1>Réparations &amp; Mods</h1>'
    + '<select onchange="setCat(\'app\',this.value)">' + optList(APPS, CAT.app, "Choisir un type d’appareil…") + '</select>'
    + (CAT.app ? '<div class="two" style="margin-top:8px"><select onchange="setCat(\'cat\',this.value)">' + optList(brands, CAT.cat, "Marque…") + '</select>' + (gams.length ? '<select onchange="setCat(\'gam\',this.value)">' + optList(gams, CAT.gam || "", "Gamme…") + '</select>' : '<select onchange="setCat(\'mod\',this.value)">' + optList(mods, CAT.mod, "Modèle…") + '</select>') + '</div>' + (gams.length && CAT.gam ? '<div style="margin-top:8px"><select onchange="setCat(\'mod\',this.value)">' + modOpts(mods, CAT.gam, CAT.mod) + '</select></div>' : '') : '')
    + '<div style="margin-top:10px">' + body + '</div>';
}
/* Type · marque · modèle de la ligne, avec un point d’exclamation si la base Appareils ne le contient pas */
function catLibelle(r){
  const t = r.appareil === "Mods" ? r.cible : r.appareil;
  const absent = !S.appBaseErr && ROLE === "rep" && !baseHasTrio(t, r.categorie, r.modele);
  return '<div class="m" style="margin:10px 0 4px">' + esc([t, r.categorie, r.modele].filter(Boolean).join(" · ")) + (absent ? repere("Marque ou modèle absent de la base Appareils : à corriger") : "") + '</div>';
}
function catRow(r){
  const ok = r.prix != null && !isNaN(+r.prix);
  return '<div class="card"><div class="row"><div><div class="t">' + esc(r.reparation) + '</div><div class="m">'
    + (r.duree ? 'Durée : ' + esc(r.duree) : 'Durée à définir')
    + (r.joy ? ' · joystick (1 ou 2)' + (ok ? ' · 2 joysticks : ' + eur(2 * r.prix - 5) : '') : '')
    + '</div></div>'
    + '<div style="display:flex;gap:6px;align-items:center"><input inputmode="decimal" value="' + esc(r.prix == null ? "" : r.prix) + '" placeholder="à définir" style="width:90px;margin:0" onchange="setPrixCat(\'' + r.id + '\',this.value)"><span class="m">€</span></div></div>'
    + '<button class="chip late" style="margin-top:6px" onclick="delCat(\'' + r.id + '\')">Supprimer</button></div>';
}
function addCatForm(){
  return '<div class="card" style="margin-top:10px"><div class="t">Ajouter une réparation pour ce modèle</div>'
    + '<label>Réparation *</label><input id="cR">'
    + '<div class="two"><div><label>Prix (€)</label><input id="cP" inputmode="decimal" placeholder="à définir"></div><div><label>Durée de réparation</label><input id="cD" placeholder="Ex. 1h"></div></div>'
    + '<button class="btn" onclick="addCat()">Ajouter</button><div class="err" id="cRErr"></div></div>';
}
async function addCat(){
  const rep = $("cR").value.trim(), pr = $("cP").value.trim().replace(",", "."), du = $("cD").value.trim(), err = $("cRErr");
  err.textContent = "";
  if (!rep) { err.textContent = "Indique la réparation."; return; }
  if (pr !== "" && pr !== "devis" && (isNaN(+pr) || +pr < 0)) { err.textContent = "Prix invalide."; return; }
  const ref = S.catalogue.find(r => r.modele === CAT.mod);
  const { error } = await SB.from("catalogue").insert({ appareil: CAT.app, categorie: ref ? ref.categorie : (CAT.cat || "Autre"), modele: CAT.mod, reparation: rep, prix: pr === "" ? null : pr, duree: durNorm(du), joy: false });
  if (error) { err.textContent = msgErr(error); return; }
  toast("Réparation ajoutée");
  await reload();
}
async function setPrixCat(id, v){
  v = String(v).trim().replace(",", "."); const p = v === "" ? null : v;
  if (p !== null && p !== "devis" && (isNaN(+p) || +p < 0)) { toast("Prix invalide"); render(); return; }
  const { error } = await SB.from("catalogue").update({ prix: p }).eq("id", id);
  if (error) { toast(msgErr(error)); return; }
  toast("Prix enregistré");
  await reload();
}
async function delCat(id){
  if (!confirm("Supprimer cette réparation du catalogue ?")) return;
  const { error } = await SB.from("catalogue").delete().eq("id", id);
  if (error) { toast(msgErr(error)); return; }
  toast("Réparation supprimée");
  await reload();
}
async function importCat(){
  if (!confirm("Importer le catalogue de base (103 réparations) ?")) return;
  const rows = CAT_SEED.map(r => ({appareil: r[0], cible: r[1], categorie: r[2], modele: r[3], reparation: r[4], prix: r[5], duree: r[6], joy: r[7]}));
  for (let i = 0; i < rows.length; i += 50) {
    const { error } = await SB.from("catalogue").insert(rows.slice(i, i + 50));
    if (error) { toast(msgErr(error)); return; }
  }
  toast("Catalogue importé");
  await reload();
}
function plus6m(dateStr){
  const b = dateStr ? new Date(dateStr + "T00:00") : new Date();
  b.setHours(0, 0, 0, 0); b.setMonth(b.getMonth() + 6);
  return b.getFullYear() + "-" + String(b.getMonth() + 1).padStart(2, "0") + "-" + String(b.getDate()).padStart(2, "0");
}
function garantieHtml(d){
  if (d.statut !== "Remis" || !d.echeance)
    return '<div class="m" style="margin-top:6px">La garantie de 6 mois démarre à la remise de l’appareil.</div>';
  const fin = plus6m(d.echeance);
  const start = new Date(d.echeance + "T00:00"), end = new Date(fin + "T00:00");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const pct = Math.min(100, Math.max(0, (today - start) / (end - start) * 100));
  const rest = left(fin);
  const col = rest < 0 ? "var(--bad)" : rest <= 30 ? "var(--warn)" : "var(--brand)";
  return '<div style="margin-top:8px"><div class="t" style="font-size:14px">Garantie 6 mois</div>'
    + '<div style="height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px"><div style="height:100%;width:' + pct.toFixed(1) + '%;background:' + col + '"></div></div>'
    + '<div style="display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-weight:600;color:' + col + '"><span>Jusqu’au ' + fr(fin) + '</span><span>' + (rest < 0 ? "Garantie expirée" : jours(rest)) + '</span></div></div>';
}
