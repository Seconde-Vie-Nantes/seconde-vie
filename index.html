<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seconde Vie – Atelier</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://bagucelglclcssoclyaw.supabase.co" crossorigin>
<style>
:root{--bg:#f2f4f1;--surf:#fff;--ink:#17261f;--mut:#5d6b64;--line:#dfe4e0;--brand:#1f4d3f;--bad:#b3261e;--ok:#22703f;--warn:#b86e00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:480px;margin:0 auto;padding:20px 20px 100px;width:100%}
.card,.modal .card{width:100%}
img{max-width:100%}
input,select,textarea,button{max-width:100%}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.m{color:var(--mut);font-size:13px}
.t{font-weight:600}
span.chip{cursor:default}
button:not(:disabled),.card[onclick]{transition:transform .15s,box-shadow .15s}
button:not(:disabled):hover,.card[onclick]:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line);white-space:nowrap;border:0;cursor:pointer;font-family:inherit}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--bg);padding:2px 6px;border-radius:6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px}
label{display:block;font-size:13px;font-weight:600;margin:8px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;border:0;background:var(--brand);color:#fff;font-family:inherit;font-weight:600;font-size:15px;padding:12px;border-radius:12px;margin-top:8px;cursor:pointer}
.btn.small{width:auto;padding:7px 12px;margin:0;font-size:13px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0}
.hide{display:none!important}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom);background:var(--surf);border-top:1px solid var(--line);box-shadow:0 100px 0 0 var(--surf);display:flex;z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 2px;font-family:inherit;font-weight:600;font-size:12px;color:var(--mut);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:360px;width:100%;margin:0}
.fb-wrap{position:fixed;left:14px;bottom:14px;z-index:15}
.fb-wrap.edge{left:0}
.notif-wrap{position:fixed;top:12px;right:14px;z-index:16}
.notif-btn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 2px 8px rgba(23,38,31,.08)}
.notif-btn svg{width:20px;height:20px}
.notif-badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;box-sizing:border-box}
.notif-banner{position:fixed;top:62px;right:14px;z-index:17;width:min(340px,calc(100vw - 28px));background:#fff;border:1px solid #e3e9e5;border-radius:14px;box-shadow:0 12px 32px rgba(23,38,31,.16);padding:12px 14px;cursor:pointer}
.notif-panel{position:fixed;top:62px;right:14px;z-index:17;width:min(360px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:#fff;border:1px solid #e3e9e5;border-radius:14px;box-shadow:0 12px 32px rgba(23,38,31,.16);padding:12px 14px}
.nb-head,.np-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.nb-x{border:0;background:none;font-size:18px;line-height:1;color:var(--mut);cursor:pointer;padding:0 2px}
.nb-t,.np-t{font-weight:700;font-size:14px;margin:4px 0}
.notif-banner ul,.notif-panel ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink)}
.np-head{font-size:13px;margin-bottom:6px}
.np-item{padding:10px 0;border-top:1px solid var(--line)}
.np-d{font-size:11px;color:var(--mut);font-weight:600}
.acc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:8px 0 6px}
@media (min-width:900px){ .acc-grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
.acc-stat,.acc-nav{display:block;width:100%;text-align:left;cursor:pointer;border:0;font-family:inherit;padding:14px 16px;min-width:0;color:var(--ink)}
.acc-stat:hover,.acc-nav:hover{box-shadow:0 6px 18px rgba(23,38,31,.12)}
.acc-l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.acc-v{font-size:28px;font-weight:700;margin-top:6px;color:var(--ink)}
.acc-v.alert{color:var(--bad)}
.acc-nav{min-height:64px;font-size:15px;font-weight:700;color:var(--brand);display:flex;align-items:center}
@media (max-width:899px){ .app > .row:first-child{padding-right:44px} }

.fb-wrap.rep{bottom:72px}
.fb-panel{position:fixed;left:14px;bottom:80px;width:300px;max-width:calc(100% - 28px);background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:25}
.fb-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:move;user-select:none;touch-action:none;font-weight:600}
.fb-body{padding:12px}
.fb-close{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--mut);padding:0 4px}
.fb-btn{width:48px;height:48px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 6px 18px rgba(23,38,31,.18);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.fb-btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(23,38,31,.24)}
.fb-btn svg{width:22px;height:22px}
.fb-x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.fb-edge{border:0;background:var(--brand);color:#fff;width:22px;height:44px;border-radius:0 10px 10px 0;font-size:20px;line-height:1;padding:0;cursor:pointer;box-shadow:2px 2px 8px rgba(0,0,0,.2)}
.flash{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:40;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;z-index:30;max-width:90%;font-size:14px}
/* ---------- Tableau de bord : cases carrées ---------- */
body.lg .dash-page h1{margin:0 0 4px}
body.lg .dash-page > h2:first-of-type{margin-top:6px}
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:8px 0 6px}
.dash-tile{aspect-ratio:1/1;display:flex;flex-direction:column;margin:0;padding:14px 16px;cursor:pointer;min-width:0;overflow:hidden}
.dash-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dash-lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);line-height:1.3;flex:1 1 0;min-width:0}
.dash-val{font-size:34px;font-weight:700;line-height:1;color:var(--ink);flex:none;white-space:nowrap}
.dash-val.alert{color:var(--bad)}
.dash-list{list-style:none;margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--line);flex:1;min-height:0;overflow:hidden}
.dash-list li{font-size:13px;line-height:1.35;padding:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-list .more{color:var(--mut);font-weight:600}
.dash-list .empty{color:var(--mut)}
@media (min-width:900px){ .dash-grid{grid-template-columns:repeat(5,minmax(0,1fr))} }
@media (min-width:900px){ body.lg nav button.nav-copy{margin-top:16px;border:1px dashed #b9c9bf;color:var(--brand);background:#fff} }
@media (max-width:899px){ nav button.nav-copy,nav button.nav-logout{display:none} }
.vue-note{font-size:13px;color:var(--mut);margin:6px 0 0}
@media (min-width:900px){ body.lg .hdr-logout{display:none} body.lg nav button.nav-logout{margin-top:auto;color:var(--mut)} }

/* ---------- Tableau de bord : détails, graphiques, cibles ---------- */
.dash-list li{cursor:pointer}
.dash-list li:hover{color:var(--brand);text-decoration:underline}
.dash-charts{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:14px 0 6px}
.chart-card{margin:0;padding:16px}
.chart-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:8px}
.bar-row{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:10px;align-items:center;margin:9px 0;cursor:pointer}
.bar-row.static{cursor:default}
.bar-l{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--brand);border-radius:4px}
.bar-v{font-size:13px;font-weight:700;text-align:right}
.bar-row:not(.static):hover .bar-fill{opacity:.7}
.vbars{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:6px}
.vcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;min-width:0}
.vbar{width:100%;max-width:40px;background:var(--brand);border-radius:6px 6px 2px 2px}
.vval{font-size:12px;font-weight:700;margin-bottom:4px;white-space:nowrap}
.vlbl{font-size:12px;color:var(--mut);margin-top:6px;text-transform:capitalize}
.vcol:hover .vbar{opacity:.7}
@media (min-width:900px){ .dash-charts{grid-template-columns:repeat(2,minmax(0,1fr))} }
.focus-hl{box-shadow:0 0 0 3px rgba(31,77,63,.4)!important;transition:box-shadow .3s}

/* ---------- Réparations et ventes : deux cartes par ligne sur ordinateur ---------- */
.card-grid{display:block}
@media (min-width:900px){
  .card-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;grid-auto-rows:1fr}
  .card-grid > .card{margin:0;padding:12px 14px;height:100%}
}

/* ---------- Logo d'en-tête ---------- */
.logo-h{display:block;width:180px;height:auto;flex:none}
.dba-w{overflow:auto;max-height:62vh;max-width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surf)}
.dba-t{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.dba-t th,.dba-t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.dba-t th{position:sticky;top:0;z-index:1;background:var(--surf);cursor:pointer;user-select:none;font-weight:600;border-bottom:2px solid var(--line)}
.dba-t td.nul{color:var(--mut)}
.dba-t td.act{white-space:nowrap}
.dba-t tr.dba-fr th{position:static;cursor:default;border-bottom:1px solid var(--line);padding:5px 6px;background:var(--surf)}
.dba-t tr.dba-fr input{width:100%;min-width:90px;margin:0;padding:5px 7px;font-size:12px;font-weight:400;border-radius:8px}
.stk-row{display:grid;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(128,128,128,.25);grid-template-columns:var(--stk-cols,minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,.9fr) minmax(0,.9fr) 300px);min-width:max-content}
.stk-head{border-bottom:2px solid var(--line)}
/* Page Clients : barre de défilement toujours affichée */
html.scroll-on{overflow-y:scroll}
/* Liste des clients : une ligne par client en colonnes */
.card.cli-card{position:relative;padding:6px 12px;margin-bottom:6px}
body.lg .card.cli-card{padding:6px 14px;margin-bottom:6px}
.cli-head{display:grid;gap:10px;align-items:center;padding:0 12px 4px;font-size:12px;font-weight:700;color:var(--mut);grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.5fr) minmax(0,.6fr) minmax(0,.9fr) 44px}
body.lg .cli-head{padding:0 14px 4px}
.cli-head>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli-row{display:grid;gap:10px;align-items:center;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.5fr) minmax(0,.6fr) minmax(0,.9fr) 34px;min-height:34px}
.cli-row>div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.cli-caret{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.cli-alert{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font-weight:700;font-size:13px;line-height:20px;text-align:center}
.cli-body-wrap{display:grid;grid-template-rows:1fr;animation:cliIn .3s cubic-bezier(.2,.7,.2,1) both}
.cli-body-wrap.cli-out{animation:cliOut .2s ease-in both;pointer-events:none}
.cli-body{min-height:0;overflow:hidden}
.cli-in{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
@keyframes cliIn{from{grid-template-rows:0fr;opacity:0;transform:translateY(-4px)}to{grid-template-rows:1fr;opacity:1;transform:none}}
@keyframes cliOut{from{grid-template-rows:1fr;opacity:1}to{grid-template-rows:0fr;opacity:0}}
.cli-body-wrap.cli-still{animation:none}
.cli-dev-last>.card{margin:0 !important;flex:1}
.dr-empty{border:1px dashed var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.6)}
.dr-form{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surf);animation:drIn .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes drIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.dr-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.dr-thumb{flex:0 0 44px;width:44px;height:44px;border-radius:10px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff}
.dr-thumb img{width:100%;height:100%;object-fit:cover}
.dr-k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.dr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dr-full{grid-column:1 / -1}
.dr-l{font-size:12px;font-weight:600;color:var(--mut);margin:0 0 4px}
@media (max-width:600px){.dr-grid{grid-template-columns:1fr}}
.dr-prev{margin:12px 0}
.dr-ticket{border-left:4px solid var(--brand);background:#f6f9f7;border-radius:12px;padding:10px 12px}
.dr-tname{font-weight:700;font-size:15px;margin:2px 0 6px;overflow-wrap:anywhere}
.dr-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dr-pill{display:inline-block;background:#e7f6ec;color:#1f8a4c;border:2px solid #1f8a4c;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}
/* Photo d’appareil : même taille pour tous les appareils (230 px sur ordinateur, 112 px sur téléphone) */
@media (max-width:600px){ .dev-sq{height:auto !important;width:112px !important} }
@media (prefers-reduced-motion: reduce){.cli-body-wrap,.cli-body-wrap.cli-out{animation:none}}
@media (max-width:600px){
  .cli-head{display:none}
  .cli-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px;gap:1px 10px}
  .cli-row>div{white-space:normal}
  .cli-row>div:nth-child(1){grid-column:1;grid-row:1}
  .cli-row>div:nth-child(2){grid-column:2;grid-row:1}
  .cli-row>div:nth-child(3){grid-column:1 / span 2;grid-row:2}
  .cli-row>div:nth-child(4){grid-column:1;grid-row:3}
  .cli-row>div:nth-child(5){grid-column:2;grid-row:3}
  .cli-row>div:nth-child(6){grid-column:1 / span 2;grid-row:4;font-size:12px;color:var(--mut)}
  .cli-row>.cli-caret{grid-column:3;grid-row:1 / span 4;align-self:center}
  .cli-row>.cli-c{font-size:13px}
  .cli-row>.cli-c[data-l="Créé le"]::before{content:"Créé le : ";font-weight:600}
}
.stk-head>span{position:relative;padding-right:10px}
.stk-rz{position:absolute;top:0;bottom:0;right:0;width:10px;cursor:col-resize;touch-action:none;z-index:2}
.stk-rz:hover,.stk-rz:active{background:linear-gradient(90deg,transparent 4px,var(--brand) 4px,var(--brand) 6px,transparent 6px)}
.stk-wrap{overflow-x:auto;max-width:100%}
.stk-act{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:600px){.stk-row{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.3fr);min-width:0}.stk-x,.stk-rz{display:none}.stk-act{grid-column:1/-1;justify-content:flex-start}.stk-head .stk-act{display:none}}
.ab-cell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ab-grid{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,.8fr);gap:8px}
.ab-acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-shrink:0;width:176px}
/* Liste des appareils : défilement horizontal quand la ligne ne tient pas à l’écran */
.ab-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.ab-scroll > .row{min-width:680px}
.sq{display:flex;align-items:center;justify-content:center;width:44px;height:44px;min-width:44px;margin:0;padding:0;line-height:1}
.ic{position:relative;display:block;width:16px;height:16px;transition:transform .6s ease;pointer-events:none}
.ic::before,.ic::after{content:"";position:absolute;left:50%;top:50%;background:currentColor;border-radius:2px;transform:translate(-50%,-50%)}
.ic::before{width:16px;height:2px}
.ic::after{width:2px;height:16px}
.ic::after{transition:transform .3s ease}
.ic.minus::after{transform:translate(-50%,-50%) scaleY(0)}
body.lg .cl-mhead{position:sticky;top:0;z-index:6;background:#f4f6f5;margin-left:-20px !important;margin-right:-20px !important;padding:10px 20px 6px !important}
/* ---------- Thème : fond clair et cartes en verre dépoli ---------- */
body.lg{background:#f4f6f5;color:#17261f;min-height:100vh}
body.lg h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:6px 0 16px}
body.lg h2{font-size:15px;font-weight:600;margin:18px 0 8px}
body.lg .card{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.95);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(23,38,31,.04),0 6px 22px rgba(23,38,31,.06);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
body.lg .card[onclick]:hover{box-shadow:0 2px 4px rgba(23,38,31,.05),0 10px 28px rgba(23,38,31,.10)}
body.lg input,body.lg select,body.lg textarea{background:rgba(255,255,255,.9);border:1px solid #d9e1dc;border-radius:10px;padding:9px 12px;font-size:14px;box-shadow:none}
body.lg input:focus,body.lg select:focus,body.lg textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,77,63,.12)}
body.lg .btn{background:var(--brand);border-radius:10px;box-shadow:none;font-weight:600}
body.lg .btn.ghost{background:transparent;color:var(--ink);border:1px solid #c9d6cf;box-shadow:none}
body.lg .chip{-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:6px;padding:3px 8px;background:#eef2ef;color:var(--mut)}
body.lg .late{background:#fde4e1;color:var(--bad)}
body.lg .ok{background:#def3e5;color:var(--ok)}
body.lg .warn{background:#fff1d6;color:var(--warn)}

async function doRecovery(){

  RECOVERY = false;

async function doLogin(){
  const e = $("lE").value.trim(), p = $("lP").value, err = $("lErr");
  err.textContent = "";
  if (!e || !p) { err.textContent = "Email et mot de passe requis."; return; }
  if (CM === "login") {
    const { error } = await SB.auth.signInWithPassword({ email: e, password: p });
    if (error) { err.textContent = msgErr(error); return; }
    return boot();
  }
  const v = id => $(id).value.trim();
  let d = null, code = "";
  if (CM === "data") {
    d = {prenom:v("nP"), nom:v("nN"), tel:v("nT"), adr:v("nA"), cp:v("nCp"), ville:v("nV")};
    if (!d.prenom || !d.nom || !d.tel || !d.adr || !d.cp || !d.ville) { err.textContent = "Tous les champs marqués * sont obligatoires."; return; }
    if (!/^[0-9+ .\-]{6,20}$/.test(d.tel)) { err.textContent = "Le téléphone ne doit contenir que des chiffres."; return; }
    if (!/^\d{5}$/.test(d.cp)) { err.textContent = "Le code postal doit comporter 5 chiffres."; return; }
  } else {
    code = v("lC");
    if (!/^\d{6}$/.test(code)) { err.textContent = "Le code doit comporter 6 chiffres."; return; }
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { err.textContent = "L’email n’est pas valide."; return; }
  const { error: se } = await SB.auth.signUp({ email: e, password: p });
  if (se) { err.textContent = msgErr(se); return; }
  const { error: le } = await SB.auth.signInWithPassword({ email: e, password: p });
  if (le) { err.textContent = msgErr(le); return; }
  if (code) {
    const { error: ce } = await SB.rpc("claim_invitation", { p_code: code });
    if (ce) { err.textContent = /code_invalide/.test(ce.message) ? "Code invalide ou déjà utilisé. Ton compte est créé : reconnecte-toi, ou contacte ton réparateur." : "Erreur : " + ce.message; return; }
  } else {
    const { data: u } = await SB.auth.getUser();
    const { error: ie } = await SB.from("clients").insert({ ...d, mail: e, auth_user_id: u.user.id });
    if (ie) {
      err.textContent = ie.code === "23505" ? "Un client existe déjà avec ce téléphone ou cet email. Utilise ton code d’invitation ou contacte ton réparateur." : msgErr(ie);
      return;
    }
  }
  CM = "login";
  await boot();
}

async function boot(){

  render();
}

async function syncReservations(){

  const changes = S.stock.map(s => {

    return [s.sku, want, +s.res || 0];
  }).filter(([, want, have]) => want !== have);
  if (!changes.length) return 0;
  for (const [sku, want] of changes) {
    const { error } = await SB.from("stock").update({ res: want }).eq("sku", sku);
    if (error) { toast(msgErr(error)); return 0; }
  }
  await reload();
  return changes.length;
}

/* Réduit la taille du chiffre jusqu'à ce qu'il tienne sur la même ligne que le libellé */
function fitDashVals(){
  document.querySelectorAll(".dash-tile").forEach(t => {
    const v = t.querySelector(".dash-val"), l = t.querySelector(".dash-lbl");
    if (!v || !l) return;
    v.style.fontSize = "";
    const h = t.querySelector(".dash-head");
    const ok = () => {
      const hr = h.getBoundingClientRect(), vr = v.getBoundingClientRect(), lr = l.getBoundingClientRect();
      return vr.right <= hr.right + 0.5 && lr.right <= vr.left - 4 && l.scrollWidth <= l.clientWidth + 1;
    };
    let size = 34;
    while (!ok() && size > 14) { size -= 1; v.style.fontSize = size + "px"; }
  });
}
function dashTile(label, value, items, fn, alert){
  const shown = items.slice(0, 4).map(x => '<li onclick="event.stopPropagation();dashRun(' + dashReg(x.f) + ')">' + x.t + '</li>').join("");
  const more = items.length > 4 ? '<li class="more" onclick="event.stopPropagation();dashRun(' + dashReg(fn) + ')">+ ' + (items.length - 4) + ' de plus</li>' : "";
  return '<div class="card dash-tile" onclick="dashRun(' + dashReg(fn) + ')"><div class="dash-head"><div class="dash-lbl">' + label + '</div><div class="dash-val' + (alert ? ' alert' : '') + '">' + value + '</div></div><ul class="dash-list">' + shown + more + '</ul></div>';
}
function barRow(label, value, pct, fn){

}
function eur(n){ return (Math.round((+n || 0) * 100) / 100).toLocaleString("fr-FR", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €"; }

function achatLignes(){

/* Chiffre d’affaires : réparations et mods remis (argent encaissé, daté de la remise) + ventes archivées (prix, daté de la vente) − dépenses (daté de la dépense). */
function caDetail(key){
  const rep = (S.dossiers || []).filter(d => d.statut === "Remis" && String(d.echeance || "").slice(0, 7) === key).reduce((t, d) => t + payInfo(d).tot, 0);
  const ven = (S.ventes || []).filter(v => v.archivee && moisOf(v) === key).reduce((t, v) => t + (+v.prix || 0), 0);
  const dep = (S.depenses || []).filter(x => String(x.date || "").slice(0, 7) === key).reduce((t, x) => t + (+x.montant || 0), 0);
  return {rep, ven, dep, net: rep + ven - dep};

function caTotal(){
  const rep = (S.dossiers || []).filter(d => d.statut === "Remis").reduce((t, d) => t + payInfo(d).tot, 0);
  const ven = (S.ventes || []).filter(v => v.archivee).reduce((t, v) => t + (+v.prix || 0), 0);

function ultimes6(cur){
  const [cy, cm] = cur.split("-").map(Number), out = [];
  for (let i = 5; i >= 0; i--) {
    const dt = new Date(cy, cm - 1 - i, 1);
    out.push({key: dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0"), lbl: dt.toLocaleDateString("fr-FR", {month: "short"}).replace(".", "")});
  }
  return out;
}

var REP_STATE = {arch: false, statut: "", paie: "", from: "", to: "", sort: "date", desc: true, vue: "cases"};
function repSet(k, v){ REP_STATE[k] = v; render(); }
function repArch(on){ REP_STATE.arch = on; REP_STATE.statut = ""; if (on && REP_STATE.sort === "garantie") REP_STATE.sort = "date"; render(); }
function repFin(d){ return (d.statut === "Remis" ? d.echeance : d.date_termine) || null; }
function repSolde(d){ return payInfo(d).reste === 0; }
function garantieRest(d){ if (d.statut !== "Remis" || !d.echeance) return null; return left(plus6m(d.echeance)); }
function garantieMoisRest(fin){
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const f = new Date(fin + "T00:00");
  let m = (f.getFullYear() - t.getFullYear()) * 12 + (f.getMonth() - t.getMonth());
  if (f.getDate() < t.getDate()) m--;
  return Math.max(0, m);
}
function repKey(d){
  const k = REP_STATE.sort;
  if (k === "appareil") return d.appareil || "";
  if (k === "client") return d.clients ? fullName(d.clients) : "";
  if (k === "prix") return payInfo(d).tot;
  if (k === "garantie") return garantieRest(d);
  return repFin(d);
}
function repCmp(a, b){
  const va = repKey(a), vb = repKey(b);
  if (va == null && vb == null) return 0;
  if (va == null) return 1;            // sans valeur : toujours en bas
  if (vb == null) return -1;
  const r = typeof va === "number" ? va - vb : String(va).localeCompare(String(vb), "fr");
  return REP_STATE.desc ? -r : r;
}
function repList(){
  const st = REP_STATE;
  let list = S.dossiers.filter(d => st.arch ? d.statut === "Remis" : d.statut !== "Remis");
  if (st.statut) list = list.filter(d => d.statut === st.statut);
  if (st.paie === "reste") list = list.filter(d => !repSolde(d));
  if (st.paie === "regle") list = list.filter(d => repSolde(d));
  if (st.from) list = list.filter(d => repFin(d) && repFin(d) >= st.from);
  if (st.to) list = list.filter(d => repFin(d) && repFin(d) <= st.to);
  return list.slice().sort(repCmp);
}
function repGar(d){
  const rest = garantieRest(d);
  if (rest == null) return {t: "—", c: "var(--mut)"};
  if (rest <= 0) return {t: "0 mois · pas garanti", c: "var(--bad)"};
  const m = garantieMoisRest(plus6m(d.echeance));
  return {t: m > 0 ? m + (m > 1 ? " mois restants" : " mois restant") : "moins d’1 mois restant", c: rest <= 30 ? "var(--warn)" : "var(--brand)"};
}

  const vir = +d.paye_virement || 0, esp = +d.paye_especes || 0, aco = +d.acompte || 0, rep = +d.reprise_montant || 0, tot = vir + esp + aco;
  const prix = d.prix == null ? null : +d.prix;

}

var FB_PAGE = "Espace client";
function detectPage(){
  if (ROLE !== "rep") return "Espace client";
  const mid = window.innerHeight * 0.5;
  let best = null, bestTop = -Infinity;
  document.querySelectorAll("[data-page]").forEach(el => {
    const top = el.getBoundingClientRect().top;
    if (el.offsetParent !== null && top <= mid && top > bestTop) { best = el; bestTop = top; }
  });
  if (best) return best.getAttribute("data-page");
  if (ROLE !== "rep") return "Espace client";
  const nav = REP_NAV.find(([v]) => v === VIEW);
  return "Espace réparateur" + (DOSSIER ? " · Détail réparation" : nav ? " · " + nav[1] : "");
}

var UPD_BANNER_DONE = false;
var UPD_BELL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>';
function updSeenId(){ try { return localStorage.getItem("sv_upd_seen"); } catch(e) { return null; } }

function updUnseen(){
  if (!UPDATES.length) return 0;

}

var DRAG = null;
function dragStart(e, panel){
  if (e.target.closest("button")) return;
  const pt = e.touches ? e.touches[0] : e, r = panel.getBoundingClientRect();
  DRAG = {panel, sx: pt.clientX, sy: pt.clientY, ox: r.left, oy: r.top};
  panel.style.bottom = "auto";
  panel.style.left = r.left + "px";
  panel.style.top = r.top + "px";
  if (e.cancelable) e.preventDefault();
}
function dragMove(e){
  if (!DRAG) return;
  const pt = e.touches ? e.touches[0] : e, p = DRAG.panel;
  const x = Math.max(0, Math.min(DRAG.ox + pt.clientX - DRAG.sx, innerWidth - p.offsetWidth));
  const y = Math.max(0, Math.min(DRAG.oy + pt.clientY - DRAG.sy, innerHeight - p.offsetHeight));
  p.style.left = x + "px";
  p.style.top = y + "px";
  if (e.cancelable) e.preventDefault();
}
function dragEnd(){ DRAG = null; }
document.addEventListener("mousemove", dragMove);
document.addEventListener("touchmove", dragMove, {passive: false});
document.addEventListener("mouseup", dragEnd);
document.addEventListener("touchend", dragEnd);
function openFeedback(){
  FB_PAGE = detectPage();
  let p = $("fbPanel");
  if (!p) { p = document.createElement("div"); p.id = "fbPanel"; p.className = "fb-panel"; document.body.appendChild(p); }
  p.innerHTML = `<div class="fb-head" id="fbHead"><span>Signaler ou suggérer</span><button class="fb-close" onclick="closeFeedback()" title="Fermer">×</button></div>
    <div class="fb-body">
    <label>Type</label><select id="fbType" onchange="if(this.value)$('fbMsg').focus()"><option value="">- sélectionner -</option><option>Suggestion</option><option>Bug</option></select>
    <div class="m" style="margin:4px 0 6px">Page : <b>${esc(FB_PAGE)}</b></div>
    <label>Ton message</label><textarea id="fbMsg" placeholder="Décris le problème ou ton idée"></textarea>
    <div class="m" style="margin:2px 0 6px;font-size:12px">Entrée envoie · Maj + Entrée pour aller à la ligne</div>
    <div class="err" id="fbErr"></div>
    <button class="btn" onclick="sendFeedback()">Envoyer</button>
    </div>`;
  $("fbType").value = FB_DRAFT.type;
  $("fbMsg").value = FB_DRAFT.msg;
  p.style.display = "block";
  $("fbMsg").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendFeedback(); } };
  $("fbMsg").focus();
  const head = $("fbHead");
  head.onmousedown = e => dragStart(e, p);
  head.ontouchstart = e => dragStart(e, p);
}
var FB_DRAFT = (function(){ try { return JSON.parse(sessionStorage.getItem("sv_fb_draft")) || {type: "", msg: ""}; } catch(e) { return {type: "", msg: ""}; } })();
function saveFbDraft(){
  const t = $("fbType"), m = $("fbMsg");

  try { sessionStorage.setItem("sv_fb_draft", JSON.stringify(FB_DRAFT)); } catch(e) {}

function closeFeedback(){ saveFbDraft(); const p = $("fbPanel"); if (p) p.style.display = "none"; }
async function sendFeedback(){
  const err = $("fbErr"), msg = $("fbMsg").value.trim();
  err.textContent = "";
  if (!$("fbType").value) { err.textContent = "Choisis un type."; return; }
  if (!msg) { err.textContent = "Écris ton message."; return; }
  if (DEMO) {
    // Aperçu : la suggestion est ajoutée à la liste de démonstration (rien n'est enregistré en base)
    S.feedback = [{ id: "demo-fb-" + Date.now(), auteur: "Aperçu client", type: $("fbType").value, page: FB_PAGE, message: msg, created_at: new Date().toISOString(), archive: false, resolu: false }].concat(S.feedback || []);
    clearFbDraft();
    const pn = $("fbPanel"); if (pn) pn.style.display = "none";
    toast("Merci, ta suggestion a bien été envoyée (aperçu)");
    return;
  }
  const c = S.clients.find(x => x.auth_user_id === ME.id);
  const auteur = ROLE === "rep" ? "admin" : c ? fullName(c) : "Client";
  const { error } = await SB.from("feedback").insert({
    auteur, auth_user_id: ME.id,
    type: $("fbType").value, page: FB_PAGE, message: msg
  });
  if (error) { err.textContent = msgErr(error); return; }
  clearFbDraft();
  const pn = $("fbPanel"); if (pn) pn.style.display = "none";
  toast("Merci, ton message a bien été envoyé");
}

async function copierSuggestion(id){

  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; }

  flash(ok ? "Suggestion copiée ✓" : "Copie impossible");
}

function agendaData(){

  S.dossiers.filter(d => d.statut !== "Remis").forEach(d => {

    if (d.statut === "Terminé") {

      else sans.push({txt: "Date de fin à définir · " + nom, go});
      return;
    }
    if (d.statut === "Devis") {
      if (d.date_recup) items.push({date: d.date_recup, txt: "Dépôt de l’appareil · " + nom, go});
      else sans.push({txt: "Date de dépôt à fixer · " + nom, go});
    }
    if (d.echeance) items.push({date: d.echeance, txt: "Prêt à rendre · " + nom, go});

  });

  return {
    today, sans,
    late: items.filter(e => e.date < today).sort(byDate),
    future: items.filter(e => e.date >= today).sort(byDate)
  };
}

  };
  const head = (title, n, col) => '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 0 2px;padding-bottom:4px;border-bottom:2px solid ' + col + '"><b style="color:' + col + '">' + esc(title) + '</b><span class="m">' + n + '</span></div>';
  const dayTitle = k => {

    return lbl.charAt(0).toUpperCase() + lbl.slice(1);

    const col = k === a.today ? "#1f8a4c" : "#374151";

async function saveVente(){

  let client_id = null, client_nom = null;
  if (!passe) { client_id = $("vCli").value || null; if (!client_id) { err.textContent = "Sélectionne un client, ou coche « Client de passage »."; return; } }
  else {
    const t = $("vTyp").value;

    else if (t === "avec") { client_nom = $("vNom").value.trim(); if (!client_nom) { err.textContent = "Indique le nom."; return; } }

  if (!VENTE_LIGNES.length) {
    const r = vLigneFromForm();
    if (r.error) { err.textContent = r.error; return; }
    VENTE_LIGNES.push(r.line);
  }
  const date = envoi ? todayIso() : $("vDate").value;
  if (!date) { err.textContent = "Indique la date du rendez-vous."; return; }
  if (prixT !== "" && isNaN(parseFloat(prixT))) { err.textContent = "Prix invalide."; return; }

  const old = editing ? venteLignes((S.ventes || []).find(v => v.id === VENTE_EDIT) || {}) : [];
  const oldKeys = new Set(old.map(lineKey));
  for (const l of VENTE_LIGNES) {
    if (l.appareil_id || l.acheter || oldKeys.has(lineKey(l))) continue;
    err.textContent = (l.modele || "Ce modèle") + " : pas en stock. Choisis l’appareil du stock, ou coche « Pas en stock » pour le mettre dans les appareils à acheter.";

  }

    const x = (S.stockApp || []).find(s => s.id === id);

    const dispo = x.qte + (had[id] || 0);
    if (dispo < want[id]) { err.textContent = x.nom + " : stock insuffisant (" + dispo + " disponible(s), " + want[id] + " demandé(s))."; return; }
  }

    if (!l.acheter || l.appareil_id) continue;
    const nom = [l.appareil, l.categorie, l.modele, l.couleur].filter(Boolean).join(" · ");
    if ((S.stockApp || []).some(x => x.nom === nom)) continue;
    const { error: ce } = await SB.from("stock_appareils").insert({ nom, appareil: l.appareil, categorie: l.categorie, modele: l.modele, qte: 0, res: 0, grade: null });
    if (ce) { err.textContent = "Création de l’appareil impossible : " + msgErr(ce); return; }
  }
  const first = VENTE_LIGNES[0];
  const row = {
    appareil: first.appareil, categorie: first.categorie, modele: first.modele, lignes: VENTE_LIGNES,
    lieu: envoi ? null : ($("vLieu").value.trim() || null), prix: prixT === "" ? null : parseFloat(prixT), date_rdv: date,
    heure_rdv: envoi ? null : ($("vHeure").value || null), lien_conv: $("vConv").value.trim() || null,
    envoi, transporteur: envoi ? ($("vTransp").value || null) : null, suivi: envoi ? ($("vSuivi").value.trim() || null) : null, envoi_statut: envoi ? $("vEnvStat").value : null,
    client_id, client_nom

  const { error } = editing
    ? await SB.from("ventes").update(row).eq("id", VENTE_EDIT)
    : await SB.from("ventes").insert(row);
  if (error) { err.textContent = msgErr(error); return; }
  const ids = new Set([...Object.keys(had), ...Object.keys(want)]);
  for (const id of ids) {
    const dq = (had[id] || 0) - (want[id] || 0), dr = (want[id] || 0) - (had[id] || 0);
    if (dq || dr) { const e = await devAdj(id, dq, dr); if (e) toast(e); }
  }
  VENTE_OPEN = false; VENTE_EDIT = null; VENTE_LIGNES = []; VT_COMPAT = false; MP.v = []; PKS.v = {app:"", cat:""}; VT_SEL = null;
  flash(editing ? "Vente modifiée" : "Vente enregistrée");
  await reload();
}
async function acheterReserver(id, idx){

  if (!x || x.qte < q) { toast("Pas encore assez en stock : " + (x ? x.qte : 0) + " dispo sur " + q + " demandé(s)."); return; }

  const { error } = await SB.from("ventes").update({ lignes }).eq("id", id);
  if (error) { toast(msgErr(error)); return; }

  flash("Appareil réservé depuis le stock");
  await reload();
}

/* ---- Appareils : base générale (type · marque · modèle), pour classer les pièces ---- */
var AB_F = {q: "", type: "", marque: ""}, AB_EDIT = null, AB_SORT = "nom", AB_MM = {};
/* Accessoires et noms génériques : ce ne sont pas des appareils */
var AB_ACCESSOIRE = /\bdock\b|accessoire|chargeur|câble|cable|adaptateur|housse|support/i;
var AB_TYPES = ["Téléphone", "Console", "Manette", "Enceinte", "PC portable", "Autre"];
function abNorm(v){ return nz(v).replace(/\s+/g, " ").trim(); }
function abKey(x){ return abNorm(x.type) + "|" + abNorm(x.marque) + "|" + abNorm(x.modele); }
function abGuessMarque(type, modele){
  const m = nz(modele);
  if (type === "Téléphone") return /iphone|ipad/.test(m) ? "Apple" : /galaxy|samsung/.test(m) ? "Samsung" : /redmi|xiaomi|poco|\bmi\b/.test(m) ? "Xiaomi" : "Autre";
  if (type === "Console" || type === "Manette") return /ps\d|playstation|dualshock|dualsense/.test(m) ? "PlayStation" : /switch|nintendo|\b[23]?ds|dsi|3ds|wii|joy|gamepad/.test(m) ? "Nintendo" : /xbox|series|one|360/.test(m) ? "XBOX" : "Autre";
  if (type === "PC portable") return /macbook|apple/.test(m) ? "Apple" : /\bhp\b|pavilion|elitebook/.test(m) ? "HP" : /dell|latitude|xps/.test(m) ? "Dell" : /lenovo|thinkpad|ideapad/.test(m) ? "Lenovo" : /asus/.test(m) ? "Asus" : "Autre";
  return "Autre";
}
/* Appareils déjà présents ailleurs : pièces, appareils des clients, catalogue */
function abCandidats(){
  const out = [];
  const add = (type, marque, modele) => { modele = String(modele || "").trim(); if (!type || !modele) return; if (AB_ACCESSOIRE.test(modele) || (marque && nz(marque) === nz(modele))) return; out.push({type: type, marque: marque || abGuessMarque(type, modele), modele: modele}); };
  S.devices.forEach(d => add(d.type, null, d.modele));
  S.stock.forEach(s => {
    const mods = Array.isArray(s.modeles) && s.modeles.length ? s.modeles : String(s.modele || "").split(", ");
    mods.forEach(m => {
      const p = String(m).split(" · ");
      if (p.length >= 3) add(p[0], p[1], p.slice(2).join(" · "));
      else add(s.type || "Console", null, m);
    });
  });
  S.catalogue.forEach(r => { if (r.appareil === "Mods") add(r.cible, r.categorie, r.modele); else add(r.appareil, r.categorie, r.modele); });
  const seen = new Set(), res = [];
  out.forEach(x => { const k = abKey(x); if (!seen.has(k)) { seen.add(k); res.push(x); } });
  return res;
}
function abNouveaux(){
  const have = new Set((S.appBase || []).map(abKey));
  return abCandidats().filter(x => !have.has(abKey(x)));
}
function abImportHtml(){
  const n = abNouveaux().length;
  if (!n) return "";

    + '<div class="m">Ce sont les appareils déjà utilisés dans les pièces, les fiches clients ou le catalogue.</div>'
    + '<button class="btn" onclick="abImporter()">Importer ces ' + n + ' appareil' + (n > 1 ? 's' : '') + '</button></div>';
}
async function abImporter(){

  if (!rows.length) return toast("Rien à importer : tout est déjà dans la base.");
  const { error } = await SB.from("appareils_base").insert(rows);

/* Types : liste des types connus (constante + types déjà présents dans la base) */
function abTypes(){ return [...new Set(AB_TYPES.concat((S.appBase || []).map(x => x.type).filter(Boolean)))]; }
/* Listes liées : marques selon le type, modèles selon le type et la marque */
function abMarques(){ return [...new Set((S.appBase || []).map(x => x.marque).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr")); }
function abMarquesFor(t){ return t ? [...new Set((S.appBase || []).filter(x => x.type === t).map(x => x.marque).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr")) : []; }
function abModelesFor(t, m){ return (t && m) ? [...new Set((S.appBase || []).filter(x => x.type === t && x.marque === m).map(x => x.modele).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr")) : []; }
/* Liens avec la base Appareils */
function baseHasTrio(t, m, mo){ return (S.appBase || []).some(x => abKey(x) === abKey({type: t, marque: m, modele: mo})); }
function baseHasModele(t, mo){ return (S.appBase || []).some(x => nz(x.type) === nz(t) && nz(x.modele) === nz(mo)); }

  }).filter(Boolean);

/* Gamme : préfixe « Gamme · modèle » du nom du modèle (même convention que le catalogue) */
function abSplit(modele){ const m = String(modele || ""), i = m.indexOf(" · "); return i < 0 ? {g: "", base: m} : {g: m.slice(0, i), base: m.slice(i + 3)}; }
/* Nom affiché d’un appareil du client : le modèle seul, sans la gamme (« Redmi Note · REDMI NOTE 5 » -> « REDMI NOTE 5 ») */
function devNom(d){ return abSplit(d.modele).base || d.modele || ""; }
function abGammesFor(t, m){ return (t && m) ? [...new Set((S.appBase || []).filter(x => x.type === t && x.marque === m).map(x => abSplit(x.modele).g).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr")) : []; }
function abBasesFor(t, m, g){
  if (!g) return abModelesFor(t, m);
  return [...new Set((S.appBase || []).filter(x => x.type === t && x.marque === m && abSplit(x.modele).g === g).map(x => abSplit(x.modele).base))].sort((a, b) => a.localeCompare(b, "fr"));
}
function abComp(g, base){
  let b = String(base || "").trim();
  if (g && b.indexOf(g + " · ") === 0) b = b.slice(g.length + 3);
  return g ? g + " · " + b : b;
}
/* Champ à liste : menu déroulant ; le bouton « + » passe à la saisie et devient « × ».

function abCouleurs(){ return [...new Set(AB_COULEURS.concat((S.appBase || []).flatMap(x => abCoulParse(x.couleur).map(c => c.nom))))].sort((a, b) => a.localeCompare(b, "fr")); }

function abFormRefresh(T, M, Mo, G){

  abSetOk(M, !!t);
  abSetOk(Mo, !!t && !!mv);

/* Chaque formulaire : type → marque → modèle */
var AB_GROUPES = [["abT", "abM", "abMo", "abG"], ["abET", "abEMa", "abEM", "abEG"], ["dvT", "dvMa", "dvM"]];

async function addCat(){

function garantieHtml(d){
  if (d.statut !== "Remis" || !d.echeance)
    return '<div class="m" style="margin-top:6px">La garantie de 6 mois démarre à la remise de l’appareil.</div>';
  const fin = plus6m(d.echeance);
  const start = new Date(d.echeance + "T00:00"), end = new Date(fin + "T00:00");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const pct = Math.min(100, Math.max(0, (today - start) / (end - start) * 100));
  const rest = left(fin);
  const col = rest < 0 ? "var(--bad)" : rest <= 30 ? "var(--warn)" : "var(--brand)";
  return '<div style="margin-top:8px"><div class="t" style="font-size:14px">Garantie 6 mois</div>'
    + '<div style="height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px"><div style="height:100%;width:' + pct.toFixed(1) + '%;background:' + col + '"></div></div>'
    + '<div style="display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-weight:600;color:' + col + '"><span>Jusqu’au ' + fr(fin) + '</span><span>' + (rest < 0 ? "Garantie expirée" : jours(rest)) + '</span></div></div>';
}

/* Texte réduit à lettres et chiffres : « Redmi · Note 5 » -> « redminote5 » */
function modeleKey(x){ return nz(x).replace(/[^a-z0-9]/g, ""); }
/* Vrai si le texte désigne ce modèle (la marque peut précéder, la couleur suivre ; « Pro », « Plus », « A » ne correspondent pas) */
function modeleCorrespond(txt, key){
  const k = modeleKey(txt), i = k.indexOf(key);
  if (i < 0) return false;
  return !/^(pro|plus|a|se|e|\d)/.test(k.slice(i + key.length));
}
/* Photo du modèle d’un appareil : cherche dans le modèle de l’appareil, la marque + modèle de la base, puis le nom des réparations */
/* Première photo d’un modèle de la base (ajoutée dans la page Appareils) */
function modelePhoto(d){
  const base = (S.appBase || []).find(b => b.type === d.type && b.modele === d.modele)
    || (S.appBase || []).find(b => b.type === d.type && modeleKey(b.modele) === modeleKey(d.modele));
  if (base && baseModelePhoto(base, d.couleur)) return baseModelePhoto(base, d.couleur);
  const cands = [d.modele, base ? (base.marque || "") + " " + (base.modele || "") : ""]
    .concat(S.dossiers.filter(x => x.device_id === d.id).map(x => x.appareil || ""));
  for (const key of Object.keys(MODELE_PHOTOS)) {
    if (cands.some(c => modeleCorrespond(c, key))) return MODELE_PHOTOS[key];
  }
  return "";
}
/* Dernière réparation de l’appareil, avec le nombre de photos */
function lastRepHtml(d, nPh){
  const ds = S.dossiers.filter(x => x.device_id === d.id).sort((a, b) => String(b.created_at || "").localeCompare(String(a.created_at || "")));
  const r = ds[0];
  return '<div class="m">Dernière réparation</div>'
    + (r ? '<div style="font-weight:600;margin-top:2px">' + esc(r.panne || r.type || "–") + '</div><div class="m">' + (r.created_at ? fr(String(r.created_at).slice(0, 10)) : "Date inconnue") + ' · ' + esc(r.statut || "") + '</div>'
      : '<div class="m" style="margin-top:2px">Aucune réparation</div>')
    + '<button class="chip" style="margin-top:8px;display:inline-flex;align-items:center;gap:6px" onclick="openDevPage(\'' + d.id + '\')">' + ICON_IMG + ' ' + nPh + ' photo(s)</button>';
}
function devLine(d, rep){
  const tel = d.type === "Téléphone";
  let codes = "";
  if (tel && d.pin) codes += '<div class="m">Code PIN : <span class="code">' + esc(d.pin) + '</span></div>';
  if (tel && d.schema_code) codes += '<div class="m">Schéma : <span class="code">' + esc(d.schema_code) + '</span></div>';
  const nPh = photosFor("device", d.id).length;
  const who = ROLE === "rep" ? "Espace réparateur · Clients" : "Espace client";
  const couleur = d.couleur ? ' · ' + esc(d.couleur) : "";
  const photoBtn = '<button class="chip" style="float:right;display:inline-flex;align-items:center;gap:6px" title="Photos de l’appareil" onclick="openGalerie(\'device\',\'' + d.id + '\')">' + ICON_IMG + ' ' + nPh + '</button>';
  const head = rep
    ? '<div style="display:flex;gap:12px;align-items:stretch;margin-top:4px">'
      + '<div style="flex:0 0 84px;min-width:0">'
      + '<button onclick="openDevPage(\'' + d.id + '\')" title="Ouvrir l’appareil" style="display:block;width:84px;height:84px;padding:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center">'
      + (modelePhoto(d) ? '<img src="' + modelePhoto(d) + '" alt="' + esc(devNom(d)) + '" style="width:100%;height:100%;object-fit:cover;background:#fff">' : ICON_IMG)
      + '</button>'
      + '<div class="t" style="font-size:12px;margin-top:4px;line-height:1.25;word-break:break-word">' + esc(devNom(d)) + couleur + '</div></div>'
      + '<div style="flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px">' + lastRepHtml(d, nPh) + '</div>'
      + '</div>'
    : '<div class="t">' + esc(devNom(d)) + couleur + '</div>';
  return '<div class="card" data-page="' + who + '" style="margin:6px 0">' + (rep ? '' : photoBtn) + head
    + '<div class="m" style="margin-top:4px">' + (tel ? 'IMEI' : 'N° de série') + ' : <span class="code">' + esc((tel ? d.imei : d.sn) || '–') + '</span></div>' + codes
    + (d.etat ? '<div class="m">État : ' + esc(d.etat) + '</div>' : '')
    + '<div style="margin-top:6px;display:flex;gap:6px"><button class="chip" title="Modifier" onclick="showDevForm(\'' + d.id + '\')">✏️</button>'
    + (rep ? '<button class="chip late" onclick="delDev(\'' + d.id + '\')">Effacer</button>' : '')
    + '</div>'
    + devRepsHtml(d.id)
    + '<div id="de-' + d.id + '"></div></div>';
}
function cliAchatsAppHtml(me){
  const out = [];
  (S.ventes || []).filter(v => v.client_id === me.id).forEach(v => venteLignes(v).forEach(l => {
    if (!l.appareil_id) return;
    const nom = [l.appareil, l.categorie, l.modele, l.couleur].filter(Boolean).join(" · ") + (l.quantite > 1 ? " × " + l.quantite : "");
    const quand = v.archivee ? "Acheté le " + fr(v.date_effectue || v.date_rdv) : "Achat prévu" + (v.date_rdv ? " le " + fr(v.date_rdv) : "");
    out.push('<div class="card"><div class="t">' + esc(nom) + '</div><div class="m">' + esc(quand) + '</div></div>');
  }));
  return out.join("");
}
function cliDevHtml(me){
  const ds = S.devices.filter(d => d.client_id === me.id);

/* Historique : ouvrir une fiche client ajoute une étape, pour que le bouton retour la referme */
function cliApply(cur, next){
  const flagged = !!(history.state && history.state.cliOpen);
  CLI_OPEN = next;
  if (next && !cur) history.pushState({cliOpen: true}, "");
  else if (next && cur && flagged) history.replaceState({cliOpen: true}, "");
  else if (!next && flagged) history.back();
  render();
}
function toggleCli(id){
  if (CLI_BUSY) return;
  CLI_DEV = null; CLI_NOANIM = false;
  const cur = CLI_OPEN, next = cur === id ? null : id;
  if (!cur) { cliApply(cur, next); return; }
  const w = document.querySelector('[data-cli-body="' + cur + '"]');
  if (!w) { cliApply(cur, next); return; }
  CLI_BUSY = true;
  w.classList.add("cli-out");
  setTimeout(() => { CLI_BUSY = false; cliApply(cur, next); }, 200);
}

/* Réduit la photo (1600 px max, JPEG) avant envoi : fichiers plus légers et format accepté par le stockage. null si le navigateur ne sait pas la lire (ex. HEIC sur PC). */
async function photoPrep(f){
  try {
    const bmp = await createImageBitmap(f);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); /* JPEG n’a pas de transparence : le fond devient blanc, pas noir */
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    return blob ? { body: blob, ext: "jpg", type: "image/jpeg" } : null;
  } catch (e) { return null; }
}

var GAL_DRAG = null, GAL_JUST = false;

document.addEventListener("pointermove", e => {

  e.preventDefault();

  const kids = [...GAL_DRAG.grid.children];
  const avant = galRects(GAL_DRAG.grid);

function galLift(el, on){
  el.style.transition = "transform .25s cubic-bezier(.2,.8,.2,1), scale .18s, box-shadow .18s";
  el.style.scale = on ? "1.06" : "";
  el.style.boxShadow = on ? "0 12px 28px rgba(0,0,0,.28)" : "";

function galFlip(grid, avant){
  grid.querySelectorAll(".gal-cell[data-pid]").forEach(c => {

    c.style.transform = "translate(" + dx + "px," + dy + "px)";

    c.style.transition = "transform .25s cubic-bezier(.2,.8,.2,1), scale .18s, box-shadow .18s";
    c.style.transform = "";

/* Barre entre le dépôt et la date de remise : vert = jours passés, gris = jours restants */
function dateBarHtml(d, legend){
  if (!d.echeance) return "";
  const debut = d.date_recup || String(d.created_at || "").slice(0, 10);
  if (!debut) return "";
  const start = new Date(debut + "T00:00");
  const end = new Date(d.echeance + "T00:00"), now = new Date(todayIso() + "T00:00");
  const total = Math.max(1, Math.round((end - start) / 86400000));
  const passed = Math.min(total, Math.max(0, Math.round((now - start) / 86400000)));
  const pct = Math.round(passed / total * 100);
  const restants = Math.max(0, total - passed) + ' j restants';
  const barre = '<div style="height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px"><div style="height:100%;width:' + pct + '%;background:#1f8a4c"></div></div>';
  if (typeof legend === "string" || legend === true) {
    // carte de la liste : le texte est placé sous la barre
    return '<div style="margin-top:10px">' + barre + '<div class="m" style="margin-top:4px">' + (typeof legend === "string" ? legend : restants) + '</div></div>';
  }
  // page détail : légende complète au-dessus de la barre
  const complet = passed + ' j passés · ' + restants;
  return '<div style="margin-top:10px"><div class="m">' + complet + '</div>' + barre + '</div>';
}
async function fSave(field, value){
  const d = S.dossiers.find(x => x.id === DOSSIER);
  if (!d) return;
  let v = value;
  if (field === "panne") {
    v = String(value).trim();
    if (!v) { toast("Donne un nom à la réparation."); $("dNom").value = d.panne || ""; return; }
  } else if (field === "prix") {
    const t = String(value).trim().replace(",", ".");
    if (t !== "" && isNaN(parseFloat(t))) { toast("Prix invalide."); return; }
    v = t === "" ? null : parseFloat(t);
  } else if (field === "duree") {
    v = durNorm(value);
  } else if (["acompte", "acompte_especes", "acompte_virement", "paye_virement", "paye_especes", "reprise_montant"].includes(field)) {
    const t = parseFloat(String(value || "0").replace(",", "."));
    if (isNaN(t) || t < 0) { toast("Montant invalide."); return; }
    v = t;
  } else {
    v = value || null;
  }
  if (field === "date_recup" && v && d.echeance && v > d.echeance) {
    toast("La date de dépôt ne peut pas être après la date de remise.");
    if ($("dRecup")) $("dRecup").value = d.date_recup || "";
    return;
  }
  if (field === "echeance" && v && d.date_recup && v < d.date_recup) {
    toast("La date de remise ne peut pas être avant la date de dépôt.");
    if ($("dEc")) $("dEc").value = d.echeance || "";
    return;
  }
  const upd = {[field]: v};
  if (field === "date_termine") upd.date_retour = v ? plus30(v) : null;
  if (["acompte_especes", "acompte_virement"].includes(field)) {
    upd.acompte = (+(field === "acompte_especes" ? v : d.acompte_especes) || 0) + (+(field === "acompte_virement" ? v : d.acompte_virement) || 0);
  }
  const tmp = Object.assign({}, d, upd);
  if (["prix", "acompte", "acompte_especes", "acompte_virement", "paye_virement", "paye_especes", "reprise_montant"].includes(field)) upd.paye = tmp.prix != null && payInfo(tmp).reste === 0;
  const { error } = await SB.from("dossiers").update(upd).eq("id", d.id);
  if (error) { toast(msgErr(error)); return; }
  Object.assign(d, upd);
  paintDetail();
  flash("Enregistré ✓");
}
async function setStatut(st){
  const d = S.dossiers.find(x => x.id === DOSSIER), sel = $("dSt");
  const fail = msg => { sel.value = d.statut; toast(msg); };
  if (st === d.statut) return;
  if (st !== "Devis en cours") {
    if (d.statut === "Devis en cours" && !devisOk(d)) return fail("Renseigne la date de dépôt, le prix et la durée avant de quitter le devis.");
    if (pcs(d.id).some(p => p.statut !== "Réservée")) return fail("Impossible : toutes les pièces doivent être réservées.");
  }
  if (st === "Remis") {
    if (!d.echeance) return fail("Renseigne la date « Remis le » avant de passer en Remis.");
    if (payInfo(d).reste !== 0) return fail("Le paiement doit être complet avant de passer en Remis.");
  }
  const date_termine = st === "Terminé" ? (d.date_termine || todayIso()) : null;
  const date_retour = date_termine ? plus30(date_termine) : null;
  const { error } = await SB.from("dossiers").update({statut: st, date_termine, date_retour}).eq("id", d.id);
  if (error) return fail(msgErr(error));
  // pièces réservées : retirées de la réservation quand la réparation est Terminé/Remis (le stock n'est pas rendu)
  const wasFinal = ["Terminé", "Remis"].includes(d.statut), isFinal = ["Terminé", "Remis"].includes(st);
  if (wasFinal !== isFinal) {
    for (const p of pcs(d.id)) {
      if (p.statut !== "Réservée" || !p.sku) continue;
      const s2 = S.stock.find(x => x.sku === p.sku); if (!s2) continue;
      const r = await SB.from("stock").update({ res: Math.max(0, s2.res + (isFinal ? -p.qte : p.qte)) }).eq("sku", s2.sku);
      if (r.error) toast(msgErr(r.error));
    }
  }
  flash("Enregistré ✓");
  await reload();
}

async function applyPst(p, v){
  const st = p.sku ? S.stock.find(x => x.sku === p.sku) : null;
  if (v === "Réservée" && p.statut !== "Réservée") {
    if (!st) return "Cette pièce n’a pas de SKU en stock : réservation impossible.";
    if (st.qte < p.qte) return "Stock insuffisant : " + st.qte + " disponible(s), " + p.qte + " nécessaire(s).";
    const r = await SB.from("stock").update({ qte: st.qte - p.qte, res: st.res + p.qte }).eq("sku", st.sku);
    if (r.error) return msgErr(r.error);
  } else if (p.statut === "Réservée" && v !== "Réservée" && st) {
    const r = await SB.from("stock").update({ qte: st.qte + p.qte, res: st.res - p.qte }).eq("sku", st.sku);
    if (r.error) return msgErr(r.error);
  }
  const { error } = await SB.from("pieces_dossier").update({ statut: v }).eq("id", p.id);
  return error ? msgErr(error) : null;
}

function makeDemoSB(){
  const KEY = {pieces_dossier: "pieces", stock_appareils: "stockApp", invitations: "inv", appareils_base: "appBase"};
  const clone = x => JSON.parse(JSON.stringify(x));
  let seq = 0;
  const store = t => { const k = KEY[t] || t; if (!Array.isArray(S[k])) S[k] = []; return S[k]; };
  const from = table => {
    let op = "select", payload = null, one = false;
    const filters = [];
    const run = () => {
      const rows = store(table), match = r => filters.every(f => f(r));
      let data = [];
      if (op === "select") data = rows.filter(match).map(clone);
      else if (op === "insert") data = payload.map(p => { const r = Object.assign({id: "demo-" + (++seq)}, p); rows.push(r); return clone(r); });
      else if (op === "update") rows.filter(match).forEach(r => { Object.assign(r, payload); data.push(clone(r)); });
      else if (op === "delete") { data = rows.filter(match).map(clone); for (let i = rows.length - 1; i >= 0; i--) if (match(rows[i])) rows.splice(i, 1); }
      if (one) data = data[0] || null;
      return Promise.resolve({data, error: null});
    };
    const b = {
      select(){ return b; },
      order(){ return b; },
      eq(col, val){ filters.push(r => r[col] === val); return b; },
      insert(rows){ op = "insert"; payload = Array.isArray(rows) ? rows : [rows]; return b; },
      update(p){ op = "update"; payload = p; return b; },
      delete(){ op = "delete"; return b; },
      single(){ one = true; return b; },
      maybeSingle(){ one = true; return b; },
      then(ok, ko){ return run().then(ok, ko); }
    };
    return b;
  };
  return {
    from,
    auth: {getSession: async () => ({data: {session: null}}), signOut: async () => ({error: null})},
    rpc: async () => ({data: null, error: {message: "Action indisponible dans l’aperçu"}})
  };
}

    + '<label>Table</label><select onchange="dbaOpen(this.value)">' + opts + '</select>';
  if (!DBA.table) return h;
  h += '<div class="row" style="align-items:center;margin:8px 0"><div class="m" style="flex:1">' + (DBA.rows ? DBA.rows.length + ' ligne(s)' : 'Chargement…') + '</div>'
    + (DBA.lock || DBA.table === "galerie" ? '' : '<button class="btn small" onclick="dbaNew()">+ Ajouter une ligne</button>')
    + '<button class="btn ghost small" onclick="dbaLoad()">Actualiser</button></div>';
  if (DBA.err) h += '<div class="err">' + esc(DBA.err) + '</div>';
  if (DBA.edit !== null && !DBA.lock) h += dbaEditorHtml();
  if (DBA.table === "galerie") return h + (DBA.rows ? dbaGalerieHtml() : "");
  if (DBA.rows) h += '<input id="dbaQ" placeholder="Rechercher dans la table" value="' + esc(DBA.q) + '" oninput="dbaSearch(this.value)" style="margin:8px 0">'
    + '<div id="dbaTab">' + dbaTableHtml() + '</div>';
  return h;
}
/* Colonnes : id en premier, created_at en dernier, les autres dans l’ordre de la base */
function dbaCols(rows){
  const set = [];
  rows.forEach(r => Object.keys(r).forEach(k => { if (set.indexOf(k) < 0) set.push(k); }));
  return set.filter(k => k === "id").concat(set.filter(k => k !== "id" && k !== "created_at"), set.filter(k => k === "created_at"));
}
function dbaCellHtml(v){
  if (v === null || v === undefined || v === "") return '<td class="nul">—</td>';
  const txt = typeof v === "object" ? JSON.stringify(v) : String(v);
  return '<td title="' + esc(txt) + '">' + esc(txt) + '</td>';
}
function dbaTxt(v){ return v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v); }
/* Lignes affichées : recherche globale, filtres par colonne, puis tri */
function dbaListe(){
  const q = nz(DBA.q).trim();
  const fk = Object.keys(DBA.f).filter(k => nz(DBA.f[k]).trim());
  let list = DBA.rows.map((r, i) => ({r: r, i: i}));
  if (q) list = list.filter(x => Object.keys(x.r).some(k => nz(dbaTxt(x.r[k])).indexOf(q) > -1));
  fk.forEach(k => { const f = nz(DBA.f[k]).trim(); list = list.filter(x => nz(dbaTxt(x.r[k])).indexOf(f) > -1); });
  if (DBA.sort) {
    const k = DBA.sort.k;
    list.sort((a, b) => {
      const x = a.r[k], y = b.r[k];
      if (x == null || x === "") return 1;
      if (y == null || y === "") return -1;
      const c = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "fr", {numeric: true});
      return c * DBA.dir;
    });
  }
  return list;
}
function dbaActif(){ return !!nz(DBA.q).trim() || Object.keys(DBA.f).some(k => nz(DBA.f[k]).trim()); }
function dbaCompteHtml(list){
  if (!dbaActif()) return '';
  return '<span>Affichées : ' + list.length + ' sur ' + DBA.rows.length + '</span> <button class="chip" onclick="dbaResetFiltres()">Effacer les filtres</button>';
}
function dbaBodyHtml(cols, list){
  if (!list.length) return '<tr><td colspan="' + (cols.length + (DBA.lock ? 0 : 1)) + '" class="m">Aucune ligne ne correspond.</td></tr>';
  return list.map(x => '<tr>' + cols.map(k => dbaCellHtml(x.r[k])).join("")
    + (DBA.lock ? '' : '<td class="act"><button class="chip" onclick="dbaEdit(' + x.i + ')">Modifier</button> <button class="chip late" onclick="dbaDel(' + x.i + ')">Supprimer</button></td>') + '</tr>').join("");
}
function dbaTableHtml(){
  if (!DBA.rows) return '';
  if (!DBA.rows.length) return '<p class="m">Aucune ligne dans cette table.</p>';
  const cols = dbaCols(DBA.rows), list = dbaListe();
  const head = cols.map(k => '<th onclick="dbaSortBy(\'' + k + '\')">' + esc(k) + (DBA.sort && DBA.sort.k === k ? (DBA.dir > 0 ? ' ▲' : ' ▼') : '') + '</th>').join("")
    + (DBA.lock ? '' : '<th>Actions</th>');
  const filtres = cols.map(k => '<th class="dba-fl"><input value="' + esc(DBA.f[k] || "") + '" placeholder="Filtrer" oninput="dbaFilter(\'' + k + '\', this.value)"></th>').join("")
    + (DBA.lock ? '' : '<th></th>');
  return '<div class="m" id="dbaCount" style="margin:6px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap">' + dbaCompteHtml(list) + '</div>'
    + '<div class="dba-w"><table class="dba-t"><thead><tr>' + head + '</tr><tr class="dba-fr">' + filtres + '</tr></thead><tbody id="dbaBody">' + dbaBodyHtml(cols, list) + '</tbody></table></div>';
}
/* Mise à jour sans reconstruire les champs de saisie (le curseur reste dans le champ) */
function dbaUpdate(){
  const cols = dbaCols(DBA.rows), list = dbaListe();
  $("dbaBody").innerHTML = dbaBodyHtml(cols, list);
  $("dbaCount").innerHTML = dbaCompteHtml(list);
}
function dbaSearch(v){ DBA.q = v; dbaUpdate(); }
function dbaFilter(k, v){ DBA.f[k] = v; dbaUpdate(); }
function dbaResetFiltres(){ DBA.f = {}; DBA.q = ""; render(); }
function dbaSortBy(k){
  if (DBA.sort && DBA.sort.k === k) DBA.dir = -DBA.dir;
  else { DBA.sort = {k: k}; DBA.dir = 1; }
  render();
}
function dbaEditorHtml(){
  const isNew = DBA.edit === "new";
  const row = isNew ? {} : (DBA.rows && DBA.rows[DBA.edit]) || {};
  const obj = Object.assign({}, row);
  DBA_HIDE.forEach(k => delete obj[k]);
  return '<div class="card"><div class="t">' + (isNew ? 'Nouvelle ligne' : 'Modifier la ligne') + '</div>'
    + (isNew ? '' : '<div class="m">id : ' + esc(String(row.id)) + ' (non modifiable)</div>')
    + '<label>Contenu (JSON)</label><textarea id="dbaTxt" style="min-height:260px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre">' + esc(JSON.stringify(obj, null, 2)) + '</textarea>'
    + '<div class="row" style="gap:6px;margin-top:8px"><button class="btn small" onclick="dbaSave()">Enregistrer</button><button class="btn ghost small" onclick="dbaCancel()">Annuler</button></div></div>';
}
function dbaUnlock(){
  if (!confirm("Déverrouiller la modification de la base ? Les changements seront enregistrés directement et les suppressions sont définitives.")) return;
  DBA.lock = false; DBA.err = ""; render();
}
function dbaLock(){ DBA.lock = true; DBA.edit = null; DBA.err = ""; render(); }
async function dbaOpen(t){ DBA = {table: t || null, rows: null, edit: null, err: "", lock: true, q: "", f: {}, sort: null, dir: 1}; render(); if (t) dbaLoad(); }
async function dbaLoad(){
  if (!DBA.table) return;
  const t = DBA.table;
  const { data, error } = await SB.from(t === "galerie" ? "photos" : t).select("*");
  if (DBA.table !== t) return;
  DBA.rows = error ? [] : (data || []);
  DBA.err = error ? "Lecture impossible : " + msgErr(error) : "";
  render();
}
function dbaNew(){ if (DBA.lock) return; DBA.edit = "new"; DBA.err = ""; render(); }
function dbaEdit(i){ if (DBA.lock) return; DBA.edit = i; DBA.err = ""; render(); }
function dbaCancel(){ DBA.edit = null; DBA.err = ""; render(); }
async function dbaSave(){
  if (DBA.lock) return;
  let obj;
  try { obj = JSON.parse($("dbaTxt").value); } catch(e) { DBA.err = "JSON invalide : " + e.message; render(); return; }
  if (!obj || typeof obj !== "object" || Array.isArray(obj)) { DBA.err = "Le contenu doit être un objet { … }."; render(); return; }
  DBA_HIDE.forEach(k => delete obj[k]);
  const isNew = DBA.edit === "new";
  const row = isNew ? null : DBA.rows && DBA.rows[DBA.edit];
  if (!isNew && !row) { DBA.err = "Ligne introuvable, actualise la table."; render(); return; }
  const t = DBA.table;
  const res = isNew ? await SB.from(t).insert(obj) : await SB.from(t).update(obj).eq("id", row.id);
  if (res.error) { DBA.err = "Enregistrement impossible : " + msgErr(res.error); render(); return; }
  toast(isNew ? "Ligne ajoutée" : "Ligne modifiée");
  DBA.edit = null; DBA.err = ""; DBA.lock = true;
  await dbaLoad();
}
async function dbaDel(i){
  if (DBA.lock) return;
  const row = DBA.rows && DBA.rows[i]; if (!row) return;
  if (!confirm("Supprimer définitivement cette ligne de « " + DBA.table + " » (id " + row.id + ") ? Cette action est irréversible.")) return;
  const { error } = await SB.from(DBA.table).delete().eq("id", row.id);
  if (error) { DBA.err = "Suppression impossible : " + msgErr(error); render(); return; }
  toast("Ligne supprimée");
  DBA.lock = true; DBA.edit = null;
  await dbaLoad();
}
/* Galerie : toutes les photos, filtrées par origine */
var DBA_ORIG = [["modele","Modèle · image par défaut"],["modcol","Modèle · couleur"],["device","Appareil client"],["dossier","Réparation"],["quali","Qualirépar"],["autre","Autre"]];
function dbaOrigineCle(p){
  if (isQuali(p)) return "quali";
  if (p.dossier_id) return "dossier";
  if (p.device_id) return "device";
  if (p.appareil_base_id) return p.couleur ? "modcol" : "modele";
  return "autre";
}
function dbaOrigineDetail(p){
  const k = dbaOrigineCle(p);
  if (k === "modele" || k === "modcol") {
    const b = (S.appBase || []).find(x => x.id === p.appareil_base_id);
    return (b ? (b.marque ? b.marque + " " : "") + b.modele : "Modèle supprimé") + (p.couleur ? " · " + p.couleur : "");
  }
  if (k === "device") { const d = (S.devices || []).find(x => x.id === p.device_id); return d ? devNom(d) : "Appareil client"; }
  return photoOrigine(p);
}
function dbaOrigine(k){ DBA.origine = k; render(); }
function dbaGalerieHtml(){
  const rows = DBA.rows || [], cur = DBA.origine || "";
  const n = {}; rows.forEach(p => { const k = dbaOrigineCle(p); n[k] = (n[k] || 0) + 1; });
  const chip = (k, l, c) => '<button class="chip ' + (cur === k ? "ok" : "") + '" onclick="dbaOrigine(\'' + k + '\')">' + esc(l) + ' (' + c + ')</button>';
  const filtres = '<div class="row" style="gap:6px;flex-wrap:wrap;margin:8px 0">' + chip("", "Toutes", rows.length) + DBA_ORIG.map(([k, l]) => chip(k, l, n[k] || 0)).join("") + '</div>';
  if (!rows.length) return filtres + '<p class="m">Aucune photo dans la base.</p>';
  const list = rows.filter(p => !cur || dbaOrigineCle(p) === cur);
  if (!list.length) return filtres + '<p class="m">Aucune photo pour cette origine.</p>';
  const nettoyage = DBA.lock ? '' : '<div style="margin:0 0 8px"><button class="chip late" onclick="dbaGalNettoyer()">Retirer les lignes sans fichier</button></div>';
  return filtres + nettoyage + '<div class="gal-grid">' + list.map(p => '<div class="gal-item" data-pid="' + p.id + '"><a href="#" onclick="openImg(\'' + esc(photoUrl(p)) + '\');return false"><img src="' + esc(photoUrl(p)) + '" alt="Photo" onerror="galCassee(this)"></a>'
    + '<div class="m" style="font-size:12px;margin:4px 0">' + esc(dbaOrigineDetail(p)) + '</div>'
    + (DBA.lock ? '' : '<button class="chip late" onclick="dbaGalDel(\'' + p.id + '\')">Supprimer</button>') + '</div>').join("") + '</div>';
}
/* Galerie : une photo dont le fichier n’existe plus dans le stockage est signalée, et on peut retirer ces lignes */
var GAL_CASSEES = {};
function galCassee(img){
  const it = img.closest ? img.closest(".gal-item") : null;
  if (!it) return;
  GAL_CASSEES[it.dataset.pid] = true;
  if (it.dataset.cassee) return;
  it.dataset.cassee = "1";
  it.insertAdjacentHTML("beforeend", '<div class="err" style="font-size:12px;margin-top:4px">Fichier introuvable dans le stockage</div>');
}
async function dbaGalNettoyer(){
  if (DBA.lock) return;
  const ids = Object.keys(GAL_CASSEES).filter(pid => (DBA.rows || []).some(x => x.id === pid));
  if (!ids.length) { toast("Aucune ligne sans fichier affichée."); return; }
  if (!confirm("Retirer de la base " + ids.length + " ligne(s) dont le fichier n’existe plus ?")) return;
  let n = 0;
  for (const pid of ids) {
    if (DEMO) { S.photos = (S.photos || []).filter(x => x.id !== pid); n++; continue; }
    const del = await SB.from("photos").delete().eq("id", pid).select();
    if (del.error || !del.data || !del.data.length) { DBA.err = "Suppression refusée par la base pour la photo " + pid + " (droits sur la table « photos »)." + (del.error ? " " + msgErr(del.error) : ""); render(); break; }
    n++;
  }
  toast(n + " ligne(s) retirée(s)");
  DBA.lock = true;
  await dbaLoad();
}
async function dbaGalDel(pid){
  if (DBA.lock) return;
  const p = (DBA.rows || []).find(x => x.id === pid); if (!p) return;
  if (!confirm("Supprimer définitivement cette photo ? Elle disparaît de la base et du stockage.")) return;
  if (!(await photoSupprimer(p))) { DBA.err = AB_ERR; render(); return; }
  DBA.err = ""; toast("Photo supprimée");
  DBA.lock = true;
  await dbaLoad();
}
/* Client connecté sans fiche : code d’invitation facultatif, sinon ses informations créent sa fiche. */
async function completeNow(){
  const err = $("cErr2"); err.textContent = "";
  const code = $("cCode").value.trim();
  if (code) {
    if (!/^\d{6}$/.test(code)) { err.textContent = "Le code doit comporter 6 chiffres."; return; }
    const { error } = await SB.rpc("claim_invitation", { p_code: code });
    if (error) { err.textContent = /code_invalide/.test(error.message) ? "Code invalide ou déjà utilisé." : "Erreur : " + error.message; return; }
    return boot();
  }
  const v = id => $(id).value.trim();
  const d = {prenom: v("bP"), nom: v("bN"), tel: v("bT"), adr: v("bA"), cp: v("bCp"), ville: v("bV")};
  if (!d.prenom || !d.nom || !d.tel || !d.adr || !d.cp || !d.ville) { err.textContent = "Tous les champs marqués * sont obligatoires, ou entre un code d’invitation."; return; }
  if (!/^[0-9+ .\-]{6,20}$/.test(d.tel)) { err.textContent = "Le téléphone ne doit contenir que des chiffres."; return; }
  if (!/^\d{5}$/.test(d.cp)) { err.textContent = "Le code postal doit comporter 5 chiffres."; return; }
  const { data: u } = await SB.auth.getUser();
  const { error: ie } = await SB.from("clients").insert({ ...d, mail: u.user.email, auth_user_id: u.user.id });
  if (ie) { err.textContent = ie.code === "23505" ? "Un client existe déjà avec ce téléphone ou cet email. Contacte ton réparateur." : msgErr(ie); return; }
  await boot();
}
