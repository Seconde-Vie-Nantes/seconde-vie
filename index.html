<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Seconde Vie – Atelier</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://bagucelglclcssoclyaw.supabase.co" crossorigin>
<style>
:root{--bg:#f2f4f1;--surf:#fff;--ink:#17261f;--mut:#17261f;--line:#dfe4e0;--brand:#1f4d3f;--bad:#b3261e;--ok:#22703f;--warn:#b86e00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:480px;margin:0 auto;padding:20px 20px 100px;width:100%}
.card,.modal .card{width:100%}
img{max-width:100%}
input,select,textarea,button{max-width:100%}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.m{color:var(--mut);font-size:13px}
.t{font-weight:600}
span.chip{cursor:default}
button:not(:disabled),.card[onclick]{transition:transform .15s,box-shadow .15s}
button:not(:disabled):hover,.card[onclick]:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
/* Titre déroulant « Nouvelle dépense » : pas de relief ni de surbrillance sur toute la carte */
button.dep-tog:not(:disabled):hover{transform:none;box-shadow:none}
button.dep-tog:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:6px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line);white-space:nowrap;border:0;cursor:pointer;font-family:inherit}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--bg);padding:2px 6px;border-radius:6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px}
label{display:block;font-size:13px;font-weight:600;margin:8px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;border:0;background:var(--brand);color:#fff;font-family:inherit;font-weight:600;font-size:15px;padding:12px;border-radius:12px;margin-top:8px;cursor:pointer}
.btn.small{width:auto;padding:7px 12px;margin:0;font-size:13px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0}
.hide{display:none!important}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom);background:var(--surf);border-top:1px solid var(--line);box-shadow:0 100px 0 0 var(--surf);display:flex;z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 2px;font-family:inherit;font-weight:600;font-size:12px;color:var(--mut);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.embed-ov{position:fixed;inset:0;background:#15201a;z-index:25;display:flex;flex-direction:column}
.embed-ov.hide{display:none}
.embed-bar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1F2A24;color:#fff;font-family:Inter,system-ui,sans-serif}
.embed-bar .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.embed-bar a,.embed-bar button{color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);text-decoration:none;flex:none}
.embed-bar a:hover,.embed-bar button:hover{background:rgba(255,255,255,.26)}
.embed-ov iframe{flex:1;border:0;width:100%;background:#fff}
.tst-frame{border:1px solid var(--line);border-radius:14px;overflow:hidden;height:80vh;min-height:480px}
.tst-frame iframe{width:100%;height:100%;border:0;display:block;background:#fff}
/* Testeur de manette : la page colle aux bords de l'écran (plus de bande centrée façon mobile) */
html.tm-on .app{padding-left:0 !important;padding-right:0 !important;max-width:none !important}
html.tm-on .tst-frame{border-left:0;border-right:0;border-radius:0;height:85vh;min-height:520px}
.modal .card{max-width:360px;width:100%;margin:0}
.fb-wrap{position:fixed;left:14px;bottom:14px;z-index:15}
.fb-wrap.edge{left:0}
.notif-wrap{position:fixed;top:12px;right:14px;z-index:16}
.notif-btn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 2px 8px rgba(23,38,31,.08)}
.notif-btn svg{width:20px;height:20px}
.notif-badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;box-sizing:border-box}
.notif-banner{position:fixed;top:62px;right:14px;z-index:17;width:min(340px,calc(100vw - 28px));background:#fff;border:1px solid #e3e9e5;border-radius:14px;box-shadow:0 12px 32px rgba(23,38,31,.16);padding:12px 14px;cursor:pointer}
.notif-panel{position:fixed;top:62px;right:14px;z-index:17;width:min(360px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:#fff;border:1px solid #e3e9e5;border-radius:14px;box-shadow:0 12px 32px rgba(23,38,31,.16);padding:12px 14px}
.nb-head,.np-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.nb-x{border:0;background:none;font-size:18px;line-height:1;color:var(--mut);cursor:pointer;padding:0 2px}
.nb-t,.np-t{font-weight:700;font-size:14px;margin:4px 0}
.notif-banner ul,.notif-panel ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink)}
.np-head{font-size:13px;margin-bottom:6px}
.np-item{padding:10px 0;border-top:1px solid var(--line)}
.np-d{font-size:11px;color:var(--mut);font-weight:600}
.acc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:8px 0 6px}
@media (min-width:900px){ .acc-grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
.acc-stat,.acc-nav{display:block;width:100%;text-align:left;cursor:pointer;border:0;font-family:inherit;padding:14px 16px;min-width:0;color:var(--ink)}
.acc-stat:hover,.acc-nav:hover{box-shadow:0 6px 18px rgba(23,38,31,.12)}
.acc-l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.acc-v{font-size:28px;font-weight:700;margin-top:6px;color:var(--ink)}
.acc-v.alert{color:var(--bad)}
.acc-nav{min-height:64px;font-size:15px;font-weight:700;color:var(--brand);display:flex;align-items:center}
@media (max-width:899px){ .app > .row:first-child{padding-right:44px} }

.fb-wrap.rep{bottom:72px}
.fb-panel{position:fixed;left:14px;bottom:80px;width:300px;max-width:calc(100% - 28px);background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:25}
.fb-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:move;user-select:none;touch-action:none;font-weight:600}
.fb-body{padding:12px}
.fb-close{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--mut);padding:0 4px}
.fb-btn{width:48px;height:48px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 6px 18px rgba(23,38,31,.18);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.fb-btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(23,38,31,.24)}
.fb-btn svg{width:22px;height:22px}
.fb-x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.fb-edge{border:0;background:var(--brand);color:#fff;width:22px;height:44px;border-radius:0 10px 10px 0;font-size:20px;line-height:1;padding:0;cursor:pointer;box-shadow:2px 2px 8px rgba(0,0,0,.2)}
.flash{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:40;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;z-index:30;max-width:90%;font-size:14px}
/* ---------- Tableau de bord : cases carrées ---------- */
body.lg .dash-page h1{margin:0 0 4px}
body.lg .dash-page > h2:first-of-type{margin-top:6px}
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:8px 0 6px}
.dash-tile{aspect-ratio:1/1;display:flex;flex-direction:column;margin:0;padding:14px 16px;cursor:pointer;min-width:0;overflow:hidden}
.dash-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dash-lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);line-height:1.3;flex:1 1 0;min-width:0}
.dash-val{font-size:34px;font-weight:700;line-height:1;color:var(--ink);flex:none;white-space:nowrap}
.dash-val.alert{color:var(--bad)}
.dash-list{list-style:none;margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--line);flex:1;min-height:0;overflow:hidden}
.dash-list li{font-size:13px;line-height:1.35;padding:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-list .more{color:var(--mut);font-weight:600}
.dash-list .empty{color:var(--mut)}
@media (min-width:900px){ .dash-grid{grid-template-columns:repeat(5,minmax(0,1fr))} }
@media (min-width:900px){ body.lg nav button.nav-copy{margin-top:16px;border:1px dashed #b9c9bf;color:var(--brand);background:#fff} body.lg nav a.nav-ecran{display:block;margin-top:16px;padding:9px 14px;box-sizing:border-box;border-radius:10px;border:1px dashed #b9c9bf;color:var(--brand);background:#fff;text-align:center;text-decoration:none;font:inherit} }
@media (max-width:899px){ nav button.nav-copy,nav button.nav-logout,nav a.nav-ecran{display:none} }
@media (min-width:900px){ body.lg .hdr-logout{display:none} body.lg nav button.nav-logout{margin-top:auto;color:var(--mut)} }

/* ---------- Tableau de bord : détails, graphiques, cibles ---------- */
.dash-list li{cursor:pointer}
.dash-list li:hover{color:var(--brand);text-decoration:underline}
.dash-charts{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:14px 0 6px}
.chart-card{margin:0;padding:16px}
.chart-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:8px}
.bar-row{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:10px;align-items:center;margin:9px 0;cursor:pointer}
.bar-row.static{cursor:default}
.bar-l{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--brand);border-radius:4px}
.bar-v{font-size:13px;font-weight:700;text-align:right}
.bar-row:not(.static):hover .bar-fill{opacity:.7}
.vbars{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:6px}
.vcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;min-width:0}
.vbar{width:100%;max-width:40px;background:var(--brand);border-radius:6px 6px 2px 2px}
.vval{font-size:12px;font-weight:700;margin-bottom:4px;white-space:nowrap}
.vval.alert{color:var(--bad)}
.vlbl{font-size:12px;color:var(--mut);margin-top:6px;text-transform:capitalize}
.vcol:hover .vbar{opacity:.7}
@media (min-width:900px){ .dash-charts{grid-template-columns:repeat(2,minmax(0,1fr))} }
.focus-hl{box-shadow:0 0 0 3px rgba(31,77,63,.4)!important;transition:box-shadow .3s}

/* ---------- Réparations et ventes : deux cartes par ligne sur ordinateur ---------- */
.card-grid{display:block}
@media (min-width:900px){
  .card-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;grid-auto-rows:1fr}
  .card-grid > .card{margin:0;padding:12px 14px;height:100%}
}

/* ---------- Logo d'en-tête ---------- */
.logo-h{display:block;width:180px;height:auto;flex:none}
.dba-w{overflow:auto;max-height:62vh;max-width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surf)}
.dba-t{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.dba-t th,.dba-t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.dba-t th{position:sticky;top:0;z-index:1;background:var(--surf);cursor:pointer;user-select:none;font-weight:600;border-bottom:2px solid var(--line)}
.dba-t td.nul{color:var(--mut)}
.dba-t td.act{white-space:nowrap}
.dba-t tr.dba-fr th{position:static;cursor:default;border-bottom:1px solid var(--line);padding:5px 6px;background:var(--surf)}
.dba-t tr.dba-fr input{width:100%;min-width:90px;margin:0;padding:5px 7px;font-size:12px;font-weight:400;border-radius:8px}
.stk-row{display:grid;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(128,128,128,.25);grid-template-columns:var(--stk-cols,280px 120px 260px 100px 90px 120px 300px);width:max-content;min-width:100%}
.stk-head{border-bottom:2px solid var(--line)}
/* Page Clients : barre de défilement toujours affichée */
html.scroll-on{overflow-y:scroll}
/* Liste des clients : une ligne par client en colonnes */
.card.cli-card{position:relative;padding:6px 12px;margin-bottom:6px}
body.lg .card.cli-card{padding:6px 14px;margin-bottom:6px}
.cli-head{display:grid;gap:10px;align-items:center;padding:0 12px 4px;font-size:12px;font-weight:700;color:var(--mut);grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.5fr) minmax(0,.6fr) minmax(0,.9fr) 44px}
body.lg .cli-head{padding:0 14px 4px}
.cli-head>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli-row{display:grid;gap:10px;align-items:center;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.5fr) minmax(0,.6fr) minmax(0,.9fr) 34px;min-height:34px}
.cli-row>div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.cli-caret{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.cli-alert{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font-weight:700;font-size:13px;line-height:20px;text-align:center}
.cli-body-wrap{display:grid;grid-template-rows:1fr;animation:cliIn .3s cubic-bezier(.2,.7,.2,1) both}
.cli-body-wrap.cli-out{animation:cliOut .2s ease-in both;pointer-events:none}
.cli-body{min-height:0;overflow:hidden}
.cli-in{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
@keyframes cliIn{from{grid-template-rows:0fr;opacity:0;transform:translateY(-4px)}to{grid-template-rows:1fr;opacity:1;transform:none}}
@keyframes cliOut{from{grid-template-rows:1fr;opacity:1}to{grid-template-rows:0fr;opacity:0}}
.cli-body-wrap.cli-still{animation:none}
.cli-dev-last>.card{margin:0 !important;flex:1}
/* Mes appareils (espace client) : une carte par appareil, comme la fiche du réparateur */
.card.dev-card2{display:flex;gap:14px;align-items:stretch;padding:12px;margin-bottom:10px}
.dev-ph{flex:0 0 130px;width:130px;height:130px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}
.dev-ph img{width:100%;height:100%;object-fit:contain}
.dev-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dev-st{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:14px}
.dev-side{flex:0 0 auto;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;gap:8px}
@media (max-width:600px){ .dev-ph{flex-basis:96px;width:96px;height:96px} .card.dev-card2{padding:10px;gap:10px} }
.dr-empty{border:1px dashed var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.6)}
.dr-form{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surf);animation:drIn .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes drIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.dr-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.dr-thumb{flex:0 0 44px;width:44px;height:44px;border-radius:10px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff}
.dr-thumb img{width:100%;height:100%;object-fit:contain}
.dr-k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.dr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dr-full{grid-column:1 / -1}
.dr-l{font-size:12px;font-weight:600;color:var(--mut);margin:0 0 4px}
@media (max-width:600px){.dr-grid{grid-template-columns:1fr}}
.dr-prev{margin:12px 0}
.dr-ticket{border-left:4px solid var(--brand);background:#f6f9f7;border-radius:12px;padding:10px 12px}
.dr-tname{font-weight:700;font-size:15px;margin:2px 0 6px;overflow-wrap:anywhere}
.dr-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dr-pill{display:inline-block;background:#e7f6ec;color:#1f8a4c;border:2px solid #1f8a4c;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}
/* Photo d’appareil : même taille pour tous les appareils (230 px sur ordinateur, 112 px sur téléphone) */
@media (max-width:600px){ .dev-sq{height:auto !important;width:112px !important} }
@media (prefers-reduced-motion: reduce){.cli-body-wrap,.cli-body-wrap.cli-out{animation:none}}
@media (max-width:600px){
  .cli-head{display:none}
  .cli-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px;gap:1px 10px}
  .cli-row>div{white-space:normal}
  .cli-row>div:nth-child(1){grid-column:1;grid-row:1}
  .cli-row>div:nth-child(2){grid-column:2;grid-row:1}
  .cli-row>div:nth-child(3){grid-column:1 / span 2;grid-row:2}
  .cli-row>div:nth-child(4){grid-column:1;grid-row:3}
  .cli-row>div:nth-child(5){grid-column:2;grid-row:3}
  .cli-row>div:nth-child(6){grid-column:1 / span 2;grid-row:4;font-size:12px;color:var(--mut)}
  .cli-row>.cli-caret{grid-column:3;grid-row:1 / span 4;align-self:center}
  .cli-row>.cli-c{font-size:13px}
  .cli-row>.cli-c[data-l="Créé le"]::before{content:"Créé le : ";font-weight:600}
}
.stk-head>span{position:relative;padding-right:10px}
.stk-rz{position:absolute;top:0;bottom:0;right:0;width:10px;cursor:col-resize;touch-action:none;z-index:2}
.stk-rz:hover,.stk-rz:active{background:linear-gradient(90deg,transparent 4px,var(--brand) 4px,var(--brand) 6px,transparent 6px)}
.stk-wrap{max-width:100%;container-type:inline-size}
/* Page Stock : barres de défilement toujours affichées (verticale à droite, horizontale en bas) */
html.stk-on{overflow-y:scroll;overflow-x:scroll}
/* Les boutons de chaque pièce restent visibles quand on glisse horizontalement */
.stk-row>.stk-act{position:sticky;right:0;z-index:1;background:var(--bg)}
.stk-head>.stk-act{background:var(--bg)}
/* Modification d'une pièce : collée en haut de l'écran pendant le défilement, défile elle-même si elle est plus haute que l'écran */
.stk-qh{display:none}
.stk-nolien{flex:none;width:44px;height:44px}
.stk-filt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0}
.stk-filt select{padding:8px 6px;font-size:13px}
@media (max-width:600px){.stk-filt{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stk-nm{display:flex;align-items:center;gap:8px;min-width:0}

/* Œil : le site ajoute ses propres styles de bouton, d'où les !important */
.lg-show{display:flex;align-items:center;justify-content:center;position:absolute;right:3px;top:0;bottom:0;margin:auto 0;height:34px;width:32px;padding:0;cursor:pointer;color:var(--brand)}
.lg-show,.lg-show:hover,.lg-show:focus,.lg-show:active{background:transparent !important;border:0 !important;box-shadow:none !important;outline:none !important;border-radius:0 !important;transform:none !important;-webkit-appearance:none;appearance:none}
.lg-show:focus-visible{color:#17382e !important}

.lg-forgot-d{display:block;text-align:right;font-size:13px;font-weight:500;color:var(--brand);margin-top:10px;text-decoration:none}
.lg-login .card > .btn{width:100%;height:52px;margin:24px 0 0;border:0;border-radius:12px;background:var(--brand);color:#fff;font-size:16px;font-weight:600;box-shadow:none}
.lg-login .card .btn.ghost{background:transparent;color:#1F2A24;border:1px solid #1F2A24;box-shadow:none}
.lg-sep{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:32px;padding-top:24px;border-top:1px solid #E6E1D6}
.lg-sep span{font-size:14px;color:#17261f;white-space:nowrap}
.lg-login .card .btn.lg-create-d{display:inline-block;width:auto;height:auto;margin:0;padding:12px 18px;font-size:14px;font-weight:600;border-radius:12px;white-space:nowrap}

@media (max-width:600px){
  .lg-head{padding:0 16px}
  .lg-logo{height:auto;width:170px;max-width:55%}
  .lg-back{font-size:13px;padding:7px 12px}
  .lg-sep{flex-wrap:wrap;row-gap:12px}
  .lg-login .card input{font-size:16px}
}

/* Espace client bureau (écrans à partir de 900 px) */
body .app:has(.cl-desk),body.lg .app:has(.cl-desk){max-width:none !important;margin:0 !important;padding:0 !important;width:100%}
.cl-desk{min-height:100vh;background:#FAF8F3;font-family:Inter,system-ui,sans-serif;color:#1F2A24;box-sizing:border-box}
.cl-desk *{box-sizing:border-box}
.cl-head{display:flex;align-items:center;justify-content:space-between;height:84px;padding:0 40px;background:#FFFFFF;border-bottom:1px solid #E6E1D6;position:sticky;top:0;z-index:10}
.cl-head-l{display:flex;align-items:center;gap:40px}
.cl-logo{height:40px;width:auto;display:block}
.cl-nav{display:flex;gap:28px;font-size:15px;font-weight:500;position:static;background:none;border:0;padding:0;margin:0;height:auto;width:auto}
.cl-nav a{color:#1F2A24;text-decoration:none}
.cl-nav a:hover,.cl-nav a.on{color:#2F6B4F}
.cl-nav a.on{font-weight:600}
.cl-head-r{display:flex;align-items:center;gap:16px}
.cl-name{font-size:14px;color:#17261f}
.cl-out{font:inherit;font-size:14px;font-weight:600;color:#1F2A24;background:transparent;border:1px solid #1F2A24;border-radius:999px;padding:9px 16px;cursor:pointer}
.cl-main{max-width:1280px;margin:0 auto;padding:36px 40px 60px}
.cl-h1{margin:0;font-size:40px;font-weight:500;letter-spacing:-0.01em}
.cl-rep,.cl-accent,.cl-stat{border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.cl-rep{background:#FFFFFF;border:1px solid #E6E1D6}
.cl-row{display:flex;align-items:center;justify-content:space-between}
.cl-h2{margin:0;font-size:18px;font-weight:600}
.cl-badge{font-size:13px;font-weight:600;color:#FFFFFF;background:#2F6B4F;border-radius:999px;padding:3px 10px}
.cl-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cl-tile{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:#F5F2EA;min-width:0}
.cl-thumb{width:52px;height:52px;border-radius:10px;background:#E4DED1;flex-shrink:0}
.cl-tile-t{font-size:14px;font-weight:600}
.cl-tile-s{font-size:12px;color:#17261f}
.cl-muted{font-size:14px;color:#17261f;margin:0}
.cl-link{margin-top:auto;align-self:flex-start;font-size:14px;font-weight:600;color:#2F6B4F;text-decoration:none}
.cl-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:28px}
.cl-rep-wide{margin-top:16px}
.cl-tile-btn{border:0;width:100%;cursor:pointer;font:inherit;color:inherit}
.cl-rep-wide .cl-tiles{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.cl-accent{background:#2F6B4F;color:#FFFFFF;justify-content:space-between}
.cl-accent .cl-muted2{font-size:14px;opacity:.85}
.cl-big{font-size:clamp(26px,2.6vw,40px);font-weight:600;margin-top:4px;white-space:nowrap}
.cl-stat{background:#FFFFFF;border:1px solid #E6E1D6;color:#17261f;text-decoration:none;font-size:14px;justify-content:space-between;min-width:0}
.cl-num{font-size:32px;font-weight:600;color:#1F2A24}
.cl-sections{max-width:760px;margin-top:40px}
/* Espace client : pas de barre latérale (la navigation est réservée au réparateur) */
body:not(.rep-nav) .sb-toggle{display:none !important}
body:not(.rep-nav).lg .app{margin-left:auto !important;margin-right:auto !important}
.cl-info{background:#FFFFFF;border:1px solid #E6E1D6;border-radius:16px;padding:28px;max-width:720px}
.cl-info-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:20px;border-bottom:1px solid #E6E1D6}
.cl-info-name{font-size:24px;font-weight:600;letter-spacing:-0.01em}
.cl-btn{font:inherit;font-size:14px;font-weight:600;color:#FFFFFF;background:#2F6B4F;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;white-space:nowrap}
.cl-dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.cl-dl>div{padding:18px 0;border-bottom:1px solid #F0EDE6}
.cl-dl>div.wide{grid-column:1/-1}
.cl-info input:disabled{background:#F0EDE6 !important;color:#8A938D !important;border-color:#E6E1D6 !important;cursor:not-allowed}
.cl-info input:disabled+*,.cl-info label:has(+input:disabled){color:#8A938D}
.cl-dl dt{font-size:12px;font-weight:500;color:#17261f;margin-bottom:6px}
.cl-dl dd{margin:0;font-size:15px;color:#1F2A24;overflow-wrap:anywhere}
/* Ombres des cases de l'espace client bureau */
.cl-desk .cl-rep,.cl-desk .cl-accent,.cl-desk .cl-stat,.cl-desk .cl-info,.cl-desk .card{box-shadow:0 1px 2px rgba(31,42,36,.06),0 6px 18px rgba(31,42,36,.07)}
.copy-box{position:fixed;inset:0;background:rgba(31,42,36,.45);z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px}
.copy-card{background:#FFFFFF;border-radius:14px;padding:20px;width:min(520px,100%);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.copy-card textarea{width:100%;height:240px;box-sizing:border-box;margin-top:8px;font:inherit;font-size:13px;padding:10px;border:1px solid #DCD7CB;border-radius:10px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:10px 0}
.gal-grid img{width:100%;height:140px;object-fit:contain;border-radius:10px;display:block;background:#fff}
.gal-item{display:flex;flex-direction:column;gap:6px}
.gal-cell{position:relative;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;border-radius:10px}
.gal-cell a{display:block}
.gal-del{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--bad);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:1}
.ph-x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.cl-back{font:inherit;font-size:14px;font-weight:600;color:#2F6B4F;background:none;border:0;padding:0;cursor:pointer;margin-bottom:8px}
/* Écran affiché pendant le chargement de l'application */
.boot{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--mut);font-size:14px}
.boot-dot{width:28px;height:28px;border:3px solid #dfe4e0;border-top-color:var(--brand);border-radius:50%;animation:boot-spin .8s linear infinite}
@keyframes boot-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.boot-dot{animation:none}}
/* Archives : affichage liste détaillée */
.rep-tab{display:grid;grid-template-columns:minmax(140px,1.4fr) minmax(110px,1.2fr) minmax(130px,1.4fr) minmax(130px,1.2fr) 110px minmax(160px,1.4fr);gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.rep-tab:last-child{border-bottom:0}
.rep-tab.head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);cursor:default;background:#f6f8f7}
.rep-tab:not(.head):hover{background:#f3f6f4}
.rep-tab > div[data-l]::before{content:attr(data-l);display:none}
@media (max-width:899px){ .rep-tab{grid-template-columns:1fr 1fr;gap:8px 12px} .rep-tab.head{display:none} .rep-tab > div[data-l]::before{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em} }
/* Agenda */
.ag-barre{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:8px 0}
.ag-cadre{border:1px solid var(--line);border-radius:14px;overflow-x:auto;background:var(--surf)}
.ag-entetes,.ag-mois{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.ag-entetes div{font-size:12px;color:var(--mut);text-align:center;padding:8px 0;font-weight:600;border-bottom:1px solid var(--line)}
.ag-case{min-height:92px;min-width:0;overflow:hidden;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer}
.ag-case:nth-child(7n){border-right:0}
.ag-autre{opacity:.45}
.ag-num{font-size:12px;font-weight:600;margin-bottom:3px;display:inline-block;min-width:22px;text-align:center}
.ag-auj .ag-num{background:var(--brand);color:#fff;border-radius:999px;padding:0 6px}
.ag-ev{font-size:11px;line-height:1.35;padding:1px 5px;border-radius:5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#fff}
.ag-rep{background:var(--brand)}
.ag-ext{background:#8a9b93}
.ag-plus{font-size:11px;color:var(--mut)}
.ag-sem{display:grid;grid-template-columns:56px repeat(7,minmax(90px,1fr));min-width:700px}
.ag-hd{font-size:12px;font-weight:600;text-align:center;padding:8px 0;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.ag-hlab{font-size:11px;color:var(--mut);padding:4px 6px;text-align:right}
.ag-toute-c{min-height:26px;padding:2px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.ag-heures div{height:48px;font-size:11px;color:var(--mut);text-align:right;padding-right:6px;box-sizing:border-box;transform:translateY(-7px)}
.ag-jcol{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--line) 47px,var(--line) 48px);cursor:pointer}
.ag-blk{position:absolute;font-size:11px;line-height:1.3;color:#fff;border-radius:6px;padding:2px 5px;overflow:hidden;cursor:pointer;box-sizing:border-box}
.ag-form{margin:8px 0 12px}
.ag-barre .btn,.ag-statbar .btn,.ag-form .btn{width:auto;margin-top:0;padding:10px 16px}
.sg-lbl{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-size:14px;font-weight:500;cursor:pointer}
.sg-case{width:18px;height:18px;min-width:18px;margin:0;padding:0;flex:0 0 18px;border-radius:4px;accent-color:var(--brand);cursor:pointer}
.date-wrap{position:relative;display:inline-block;width:100%}
.date-wrap input[type="date"]{width:100%;padding-right:28px;box-sizing:border-box}
.date-x{-webkit-appearance:none;appearance:none;position:absolute;right:2px;top:50%;transform:translateY(-50%);margin:0;padding:0;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:none;background:none;color:var(--mut);font-size:17px;line-height:1;cursor:pointer;border-radius:6px}
.date-x:hover,.date-x:focus,.date-x:active{background:var(--line);color:var(--bad);transform:translateY(-50%)}

async function doLogin() {
  const e = $("lE").value.trim(), p = $("lP").value, err = $("lErr");
  err.textContent = "";
  if (!e || !p) {
    err.textContent = "Email et mot de passe requis.";
    return;
  }
  if (CM !== "login" && $("lP2") && $("lP2").value !== p) {
    err.textContent = "Les deux mots de passe ne sont pas identiques.";
    return;
  }
  if (CM === "login") {
    const { error } = await SB.auth.signInWithPassword({ email: e, password: p });
    if (error) {
      err.textContent = msgErr(error);
      return;
    }
    return boot();
  }
  const v = (id) => $(id).value.trim();
  let d = null, code = "";
  if (CM === "data") {
    d = { prenom: v("nP"), nom: v("nN"), tel: v("nT"), adr: v("nA"), cp: v("nCp"), ville: v("nV") };
    if (!d.prenom || !d.nom || !d.tel || !d.adr || !d.cp || !d.ville) {
      err.textContent = "Tous les champs marqués * sont obligatoires.";
      return;
    }
    if (!/^[0-9+ .\-]{6,20}$/.test(d.tel)) {
      err.textContent = "Le téléphone ne doit contenir que des chiffres.";
      return;
    }
    if (!/^\d{5}$/.test(d.cp)) {
      err.textContent = "Le code postal doit comporter 5 chiffres.";
      return;
    }
  } else {
    code = v("lC");
    if (!/^\d{6}$/.test(code)) {
      err.textContent = "Le code doit comporter 6 chiffres.";
      return;
    }
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) {
    err.textContent = "L’email n’est pas valide.";
    return;
  }
  const { error: se } = await SB.auth.signUp({ email: e, password: p });
  if (se) {
    err.textContent = msgErr(se);
    return;
  }
  const { error: le } = await SB.auth.signInWithPassword({ email: e, password: p });
  if (le) {
    err.textContent = msgErr(le);
    return;
  }
  if (code) {
    const { error: ce } = await SB.rpc("claim_invitation", { p_code: code });
    if (ce) {
      err.textContent = /code_invalide/.test(ce.message) ? "Code invalide ou déjà utilisé. Ton compte est créé : reconnecte-toi, ou contacte ton réparateur." : "Erreur : " + ce.message;
      return;
    }
  } else {
    const { data: u } = await SB.auth.getUser();
    const { error: ie } = await SB.from("clients").insert(__spreadProps(__spreadValues({}, d), { mail: e, auth_user_id: u.user.id }));
    if (ie) {
      err.textContent = ie.code === "23505" ? "Un client existe déjà avec ce téléphone ou cet email. Utilise ton code d’invitation ou contacte ton réparateur." : msgErr(ie);
      return;
    }
  }
  CM = "login";
  await boot();
}

async function syncReservations() {

  };

    return [s.sku, want, +s.res || 0];
  }).filter(([, want, have]) => want !== have);
  if (!changes.length) return 0;
  for (const [sku, want] of changes) {

    }
  }
  await reload();

/* ===== Agenda : Google Agenda (lecture et écriture ; synchro automatique chaque minute tant que l’onglet est ouvert) ===== */
const GCAL_CLIENT_ID = "";
const GCAL_SCOPE = "https://www.googleapis.com/auth/calendar";
const GCAL_REP_NOM = "Réparations";
const GCAL_FUSEAU = "Europe/Paris";
const AG_H0 = 7, AG_H1 = 21, AG_PAS = 48;
var AG = { jour: null, vue: "mois", evts: [], repId: null, token: null, tokenExp: 0, client: null, cb: null, cbErr: null, form: null, lu: null, err: "", sync: null, busy: false, timer: null };

function agInit() {
  if (!AG.jour) {
    AG.jour = new Date();
    AG.jour.setHours(0, 0, 0, 0);
  }
}
function agClientId() {
  if (GCAL_CLIENT_ID) return GCAL_CLIENT_ID;
  try {
    return localStorage.getItem("sv_gcal_client") || "";
  } catch (e) {
    return "";
  }
}
function agConnecte() {
  try {
    return localStorage.getItem("sv_gcal_ok") === "1";
  } catch (e) {
    return false;
  }
}
function agAjoute(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}
function agDebutSemaine(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function agDebutMois(d) {
  return new Date(d.getFullYear(), d.getMonth(), 1);
}
function agIso(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function agHm(d) {
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function agHmDe(min) {
  const m = Math.max(0, Math.min(1439, min));
  return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
}
function agMinDe(hm) {
  const p = String(hm || "").split(":");
  return (+p[0] || 0) * 60 + (+p[1] || 0);
}
/* Durée lue dans le champ « Durée » d’une réparation : « 2h », « 1h30 », « 45 min », « 1,5 » */
function agDuree(txt) {
  const s = String(txt || "").toLowerCase().replace(",", ".");
  let m = s.match(/(\d+)\s*h\s*(\d+)?/);
  if (m) return (+m[1]) * 60 + (+(m[2] || 0));
  m = s.match(/(\d+)\s*min/);
  if (m) return +m[1];
  m = s.match(/(\d+(\.\d+)?)/);
  if (m) return Math.round(parseFloat(m[1]) * 60);
  return 60;
}
function agPlage() {
  if (AG.vue === "semaine") {
    const d = agDebutSemaine(AG.jour);
    return { debut: d, fin: agAjoute(d, 7) };
  }
  const d = agDebutSemaine(agDebutMois(AG.jour));
  return { debut: d, fin: agAjoute(d, 42) };
}

/* Connexion Google (Identity Services) : le jeton reste en mémoire, il est renouvelé en silence */
function agGis() {
  return new Promise((ok, ko) => {
    if (window.google && google.accounts && google.accounts.oauth2) return ok();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true;
    s.onload = () => ok();
    s.onerror = () => ko(new Error("Google n’a pas pu être chargé : vérifie ta connexion."));
    document.head.appendChild(s);
  });
}
function agJeton(silencieux) {
  if (AG.token && Date.now() < AG.tokenExp - 60000) return Promise.resolve(AG.token);
  return agGis().then(() => new Promise((ok, ko) => {
    if (!AG.client) {
      const id = agClientId();
      if (!id) return ko(new Error("Ajoute l’ID client OAuth dans l’onglet."));
      AG.client = google.accounts.oauth2.initTokenClient({
        client_id: id,
        scope: GCAL_SCOPE,
        callback: (r) => AG.cb && AG.cb(r),
        error_callback: (e) => AG.cbErr && AG.cbErr(e)
      });
    }
    AG.cb = (r) => {
      if (r.error) return ko(new Error(r.error === "access_denied" ? "Autorisation refusée." : "Connexion impossible (" + r.error + ")."));
      AG.token = r.access_token;
      AG.tokenExp = Date.now() + (+r.expires_in || 3600) * 1000;
      try {
        localStorage.setItem("sv_gcal_ok", "1");
      } catch (e) {
      }
      ok(AG.token);
    };
    AG.cbErr = (e) => ko(new Error("Connexion interrompue" + (e && e.type ? " (" + e.type + ")" : "") + "."));
    AG.client.requestAccessToken({ prompt: silencieux ? "" : "consent" });
  }));
}
async function agApi(chemin, opt) {
  const tok = await agJeton(true);
  const o = opt || {};
  const r = await fetch("https://www.googleapis.com/calendar/v3" + chemin, {
    method: o.method || "GET",
    headers: { Authorization: "Bearer " + tok, "Content-Type": "application/json" },
    body: o.body ? JSON.stringify(o.body) : undefined
  });
  if (r.status === 401) {
    AG.token = null;
    throw new Error("Session Google expirée : clique sur « Reconnecter ».");
  }
  if (!r.ok) {
    let t = "";
    try {
      t = (await r.json()).error.message;
    } catch (e) {
    }
    throw new Error("Google Agenda : " + (t || r.status));
  }
  return r.status === 204 ? null : r.json();
}

/* Agenda « Réparations » : créé une fois dans Google Agenda s’il n’existe pas */
async function agCalRep() {
  if (AG.repId) return AG.repId;
  const l = await agApi("/users/me/calendarList");
  let c = (l.items || []).find((x) => x.summary === GCAL_REP_NOM && (x.accessRole === "owner" || x.accessRole === "writer"));
  if (!c) c = await agApi("/calendars", { method: "POST", body: { summary: GCAL_REP_NOM, timeZone: GCAL_FUSEAU } });
  AG.repId = c.id;
  return c.id;
}
function agNorm(e, c, rep) {
  const toute = !!(e.start && e.start.date);
  const debut = toute ? new Date(e.start.date + "T00:00") : new Date(e.start.dateTime);
  let fin = toute ? new Date(e.end.date + "T00:00") : new Date(e.end.dateTime);
  if (toute) fin = new Date(fin.getTime() - 1);
  const priv = (e.extendedProperties && e.extendedProperties.private) || {};
  return {
    id: e.id, cal: c.id, calNom: c.summary || "", modif: c.id === rep,
    titre: e.summary || "(sans titre)", debut, fin, toute,
    lieu: e.location || "", desc: e.description || "", dossier: priv.dossierId || ""
  };
}
async function agChargerEvts() {
  const rep = await agCalRep();
  const l = await agApi("/users/me/calendarList");
  const cals = (l.items || []).filter((c) => c.selected !== false && ["owner", "writer", "reader"].includes(c.accessRole));
  if (!cals.some((c) => c.id === rep)) cals.push({ id: rep, summary: GCAL_REP_NOM });
  const p = agPlage();
  const tous = [];
  for (const c of cals) {
    let page = "", n = 0;
    do {
      const q = "/calendars/" + encodeURIComponent(c.id) + "/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin=" + encodeURIComponent(p.debut.toISOString()) + "&timeMax=" + encodeURIComponent(p.fin.toISOString()) + (page ? "&pageToken=" + encodeURIComponent(page) : "");
      const r = await agApi(q);
      (r.items || []).forEach((e) => {
        if (e.status !== "cancelled") tous.push(agNorm(e, c, rep));
      });
      page = r.nextPageToken || "";
      n++;
    } while (page && n < 10);
  }
  tous.forEach((e, i) => {
    e.k = i;
  });
  AG.evts = tous;
}
async function agRafraichir(manuel) {
  if (AG.busy || !agClientId()) return;
  if (!agConnecte() && !manuel) return;
  AG.busy = true;
  try {
    await agChargerEvts();
    AG.sync = new Date();
    AG.err = "";
  } catch (e) {
    AG.err = e.message || String(e);
  }
  AG.busy = false;

function agRendu() {

/* Grille : mois et semaine */
function agEvtsJour(iso) {
  return AG.evts.filter((e) => agIso(e.debut) <= iso && agIso(e.fin) >= iso).sort((a, b) => a.debut - b.debut);
}
function agPastille(e) {

}
function agGrilleHtml() {

function agMoisHtml() {
  const debut = agDebutSemaine(agDebutMois(AG.jour)), mois = AG.jour.getMonth(), auj = agIso(new Date());
  let h = '<div class="ag-entetes"><div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div></div><div class="ag-mois">';
  for (let i = 0; i < 42; i++) {
    const d = agAjoute(debut, i), iso = agIso(d), evs = agEvtsJour(iso);
    h += '<div class="ag-case' + (d.getMonth() !== mois ? " ag-autre" : "") + (iso === auj ? " ag-auj" : "") + '" onclick="agClicJour(\'' + iso + '\')"><div class="ag-num">' + d.getDate() + "</div>";
    evs.slice(0, 3).forEach((e) => {
      h += agPastille(e);
    });
    if (evs.length > 3) h += '<div class="ag-plus">+' + (evs.length - 3) + " autres</div>";
    h += "</div>";
  }
  return h + "</div>";
}
/* Blocs horaires d’une journée, répartis en colonnes quand ils se chevauchent */
function agBlocsJour(iso) {
  const lim0 = AG_H0 * 60, lim1 = AG_H1 * 60, bl = [];
  agEvtsJour(iso).filter((e) => !e.toute).forEach((e) => {
    const s = agIso(e.debut) === iso ? e.debut.getHours() * 60 + e.debut.getMinutes() : 0;
    const f = agIso(e.fin) === iso ? e.fin.getHours() * 60 + e.fin.getMinutes() : 1440;
    const s2 = Math.max(s, lim0), f2 = Math.min(Math.max(f, s + 20), lim1);
    if (f2 > s2) bl.push({ e, s: s2, f: f2 });
  });
  bl.sort((a, b) => a.s - b.s);
  const fins = [];
  bl.forEach((b) => {
    let c = fins.findIndex((t) => t <= b.s);
    if (c < 0) {
      c = fins.length;
      fins.push(b.f);
    } else fins[c] = b.f;
    b.c = c;
  });
  const n = Math.max(1, fins.length);
  return bl.map((b) => ({ e: b.e, s: b.s, f: b.f, c: b.c, n }));
}
function agSemaineHtml() {
  const debut = agDebutSemaine(AG.jour), auj = agIso(new Date());
  const noms = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
  let entetes = "", journee = "", colonnes = "", heures = "";
  for (let H = AG_H0; H < AG_H1; H++) heures += "<div>" + String(H).padStart(2, "0") + ":00</div>";
  for (let i = 0; i < 7; i++) {
    const d = agAjoute(debut, i), iso = agIso(d);
    entetes += '<div class="ag-hd' + (iso === auj ? " ag-auj" : "") + '">' + noms[i] + " " + d.getDate() + "</div>";
    journee += '<div class="ag-toute-c">' + agEvtsJour(iso).filter((e) => e.toute).map((e) => agPastille(e)).join("") + "</div>";
    let blocs = "";
    agBlocsJour(iso).forEach((b) => {
      const top = (b.s - AG_H0 * 60) / 60 * AG_PAS, haut = Math.max(18, (b.f - b.s) / 60 * AG_PAS - 2);
      blocs += '<div class="ag-blk ' + (b.e.modif ? "ag-rep" : "ag-ext") + '" title="' + esc(b.e.titre) + '" style="top:' + top + "px;height:" + haut + "px;left:" + b.c * 100 / b.n + "%;width:" + 100 / b.n + '%" onclick="event.stopPropagation();agEditer(' + b.e.k + ')">' + agHm(b.e.debut) + " " + esc(b.e.titre) + "</div>";
    });
    colonnes += '<div class="ag-jcol" style="height:' + (AG_H1 - AG_H0) * AG_PAS + 'px" onclick="agClicCol(event,\'' + iso + '\')">' + blocs + "</div>";
  }
  return '<div class="ag-sem"><div></div>' + entetes + '<div class="ag-hlab">Journée</div>' + journee + '<div class="ag-heures">' + heures + "</div>" + colonnes + "</div>";
}
function agClicCol(ev, iso) {
  const y = ev.offsetY;
  const min = AG_H0 * 60 + Math.round(y / AG_PAS * 60 / 15) * 15;

async function agSupprimer() {
  if (!AG.form || !AG.form.id) return;
  if (!confirm("Supprimer ce rendez-vous de Google Agenda ?")) return;
  const err = $("agErr");
  try {
    const cal = await agCalRep();
    await agApi("/calendars/" + encodeURIComponent(cal) + "/events/" + encodeURIComponent(AG.form.id), { method: "DELETE" });
    AG.form = null;
    render();
    agRafraichir(true);
  } catch (e) {
    if (err) err.textContent = e.message;
  }
}

  note(await SB.from("stock_appareils").update({ appareil: nouv.type, modele: nouv.modele }).eq("appareil", ancien.type).eq("modele", ancien.modele));
  if (ids.length) {

function modeleKey(x) {

}
function modeleCorrespond(txt, key) {
  const k = modeleKey(txt), i = k.indexOf(key);
  if (i < 0) return false;
  return !/^(pro|plus|a|se|e|\d)/.test(k.slice(i + key.length));
}
function photoBaseCouleur(base, coul) {
  const ph = (S.photos || []).filter((x) => x.appareil_base_id === base.id && (coul == null || x.couleur && nz(x.couleur) === nz(coul))).sort((a, b) => photoOrdre(a) - photoOrdre(b));
  const p = ph.find((x) => !x.couleur) || ph[0];

function modelePhoto(d) {
  /* Toutes les fiches de la base qui portent ce modèle */
  const memes = modeleKey(d.modele) ? (S.appBase || []).filter((b) => b.type === d.type && modeleKey(b.modele) === modeleKey(d.modele)) : [];
  /* 1. La couleur de l’appareil */
  if (d.couleur) for (const b of memes) { const u = photoBaseCouleur(b, d.couleur); if (u) return u; }
  /* 2. Sinon la première couleur de la fiche qui a une photo, puis la suivante… */
  for (const b of memes) for (const c of abCoulParse(b.couleur)) { const u = photoBaseCouleur(b, c.nom); if (u) return u; }
  /* 3. Sinon n’importe quelle photo de la fiche */
  for (const b of memes) { const u = photoBaseCouleur(b, null); if (u) return u; }
  /* 4. Sinon la photo de l’appareil dans l’espace client */
  if (d.id) { const ph = photosFor("device", d.id); if (ph.length) return photoUrl(ph[0]); }
  const base = memes[0] || null;
  /* Modèle connu dans la base : seul ce modèle compte (les anciens textes de réparations peuvent dater d’un autre modèle) */
  const cands = base ? [d.modele, (base.marque || "") + " " + (base.modele || "")] : [d.modele].concat(d.id ? S.dossiers.filter((x) => x.device_id === d.id).map((x) => x.appareil || "") : []);
  for (const key of Object.keys(MODELE_PHOTOS)) {
    if (cands.some((c) => modeleCorrespond(c, key))) return MODELE_PHOTOS[key];
  }
  return "";
}

async function saveDevCli(devId) {
  const d = S.devices.find((x) => x.id === devId), err = $("cdErr");

    const id = iEl.value.replace(/\s/g, "");

        err.textContent = "L’IMEI doit comporter 15 chiffres.";
        return;
      }
      if (tel) row.imei = id;
      else row.sn = id;
    }

  const pEl = $("cdP");

      return;
    }
    if (p && p !== (d.pin || "")) row.pin = p;

    err.textContent = "Rien à enregistrer.";
    return;
  }
  const res = await SB.from("devices").update(row).eq("id", devId).select("id");
  if (res.error) {
    err.textContent = msgErr(res.error);

  }
  if (!res.data || !res.data.length) {

        op = "update";

        return b;
      },
      delete() {
        op = "delete";
        return b;
      },
      single() {
        one = true;
        return b;

      maybeSingle() {
        one = true;
        return b;
