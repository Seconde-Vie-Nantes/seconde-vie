<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seconde Vie – Atelier</title>
<link rel="icon" href="favicon.png">
<style>
:root{--bg:#f2f4f1;--surf:#fff;--ink:#17261f;--mut:#5d6b64;--line:#dfe4e0;--brand:#1f4d3f;--bad:#b3261e;--ok:#22703f;--warn:#b86e00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:480px;margin:0 auto;padding:20px 20px 100px;width:100%}
.card,.modal .card{width:100%}
img{max-width:100%}
input,select,textarea,button{max-width:100%}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:17px;margin:14px 0 8px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.m{color:var(--mut);font-size:13px}
.t{font-weight:600}
span.chip{cursor:default}
button:not(:disabled),.card[onclick]{transition:transform .15s,box-shadow .15s}
button:not(:disabled):hover,.card[onclick]:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line);white-space:nowrap;border:0;cursor:pointer;font-family:inherit}
.late{background:#fde4e1;color:var(--bad)}
.ok{background:#def3e5;color:var(--ok)}
.warn{background:#fff1d6;color:var(--warn)}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--bg);padding:2px 6px;border-radius:6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px}
label{display:block;font-size:13px;font-weight:600;margin:8px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;border:0;background:var(--brand);color:#fff;font-family:inherit;font-weight:600;font-size:15px;padding:12px;border-radius:12px;margin-top:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.small{width:auto;padding:7px 12px;margin:0;font-size:13px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0}
.hide{display:none!important}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom);background:var(--surf);border-top:1px solid var(--line);box-shadow:0 100px 0 0 var(--surf);display:flex;z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 2px;font-family:inherit;font-weight:600;font-size:12px;color:var(--mut);cursor:pointer}
nav button.on{color:var(--brand)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:360px;width:100%;margin:0}
.fb-wrap{position:fixed;left:14px;bottom:14px;z-index:15}
.fb-wrap.edge{left:0}
.notif-wrap{position:fixed;top:12px;right:14px;z-index:16}
.notif-btn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 2px 8px rgba(23,38,31,.08)}
.notif-btn svg{width:20px;height:20px}
.notif-badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;box-sizing:border-box}
.notif-banner{position:fixed;top:62px;right:14px;z-index:17;width:min(340px,calc(100vw - 28px));background:#fff;border:1px solid #e3e9e5;border-radius:14px;box-shadow:0 12px 32px rgba(23,38,31,.16);padding:12px 14px;cursor:pointer}
.notif-panel{position:fixed;top:62px;right:14px;z-index:17;width:min(360px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:#fff;border:1px solid #e3e9e5;border-radius:14px;box-shadow:0 12px 32px rgba(23,38,31,.16);padding:12px 14px}
.nb-head,.np-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.nb-x{border:0;background:none;font-size:18px;line-height:1;color:var(--mut);cursor:pointer;padding:0 2px}
.nb-t,.np-t{font-weight:700;font-size:14px;margin:4px 0}
.notif-banner ul,.notif-panel ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink)}
.np-head{font-size:13px;margin-bottom:6px}
.np-item{padding:10px 0;border-top:1px solid var(--line)}
.np-d{font-size:11px;color:var(--mut);font-weight:600}
.acc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:8px 0 6px}
@media (min-width:900px){ .acc-grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
.acc-stat,.acc-nav{display:block;width:100%;text-align:left;cursor:pointer;border:0;font-family:inherit;padding:14px 16px;min-width:0;color:var(--ink)}
.acc-stat:hover,.acc-nav:hover{box-shadow:0 6px 18px rgba(23,38,31,.12)}
.acc-l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.acc-v{font-size:28px;font-weight:700;margin-top:6px;color:var(--ink)}
.acc-v.alert{color:var(--bad)}
.acc-nav{min-height:64px;font-size:15px;font-weight:700;color:var(--brand);display:flex;align-items:center}
@media (max-width:899px){ .app > .row:first-child{padding-right:44px} }

.fb-wrap.rep{bottom:72px}
.fb-panel{position:fixed;left:14px;bottom:80px;width:300px;max-width:calc(100% - 28px);background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:25}
.fb-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:move;user-select:none;touch-action:none;font-weight:600}
.fb-body{padding:12px}
.fb-close{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--mut);padding:0 4px}
.fb-btn{width:48px;height:48px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 6px 18px rgba(23,38,31,.18);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.fb-btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(23,38,31,.24)}
.fb-btn svg{width:22px;height:22px}
.fb-x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.fb-edge{border:0;background:var(--brand);color:#fff;width:22px;height:44px;border-radius:0 10px 10px 0;font-size:20px;line-height:1;padding:0;cursor:pointer;box-shadow:2px 2px 8px rgba(0,0,0,.2)}
.flash{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:40;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;z-index:30;max-width:90%;font-size:14px}
/* ---------- Tableau de bord : cases carrées ---------- */
.dash-page h1{margin:0 0 4px}
body.lg .dash-page h1{margin:0 0 4px}
body.lg .dash-page > h2:first-of-type{margin-top:6px}
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:8px 0 6px}
.dash-tile{aspect-ratio:1/1;display:flex;flex-direction:column;margin:0;padding:14px 16px;cursor:pointer;min-width:0;overflow:hidden}
.dash-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dash-lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);line-height:1.3;flex:1 1 0;min-width:0}
.dash-val{font-size:34px;font-weight:700;line-height:1;color:var(--ink);flex:none;white-space:nowrap}
.dash-val.alert{color:var(--bad)}
.dash-list{list-style:none;margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--line);flex:1;min-height:0;overflow:hidden}
.dash-list li{font-size:13px;line-height:1.35;padding:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-list .more{color:var(--mut);font-weight:600}
.dash-list .empty{color:var(--mut)}
@media (min-width:900px){ .dash-grid{grid-template-columns:repeat(5,minmax(0,1fr))} }
@media (min-width:900px){ body.lg nav button.nav-copy{margin-top:16px;border:1px dashed #b9c9bf;color:var(--brand);background:#fff} }
@media (max-width:899px){ nav button.nav-copy,nav button.nav-logout,nav button.nav-style{display:none} }
nav button.nav-style{display:none}
@media (min-width:900px){ body.lg nav button.nav-style{display:block;margin-top:8px;border:1px solid #d9e1dc;color:var(--brand);background:#fff} body.lg.rep-nav .style-btn{display:none} }
.vue-client{border:1px dashed #cdd8d1;border-radius:16px;padding:12px;margin:8px 0 6px;background:rgba(255,255,255,.5)}
.vue-note{font-size:13px;color:var(--mut);margin:6px 0 0}
@media (min-width:900px){ body.lg .hdr-logout{display:none} body.lg nav button.nav-logout{margin-top:auto;color:var(--mut)} }

/* ---------- Tableau de bord : détails, graphiques, cibles ---------- */
.dash-list li{cursor:pointer}
.dash-list li:hover{color:var(--brand);text-decoration:underline}
.dash-list .more{color:var(--mut);font-weight:600}
.dash-charts{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:14px 0 6px}
.chart-card{margin:0;padding:16px}
.chart-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:8px}
.bar-row{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:10px;align-items:center;margin:9px 0;cursor:pointer}
.bar-row.static{cursor:default}
.bar-l{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--brand);border-radius:4px}
.bar-v{font-size:13px;font-weight:700;text-align:right}
.bar-row:not(.static):hover .bar-fill{opacity:.7}
.vbars{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:6px}
.vcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;min-width:0}
.vbar{width:100%;max-width:40px;background:var(--brand);border-radius:6px 6px 2px 2px}
.vval{font-size:12px;font-weight:700;margin-bottom:4px;white-space:nowrap}
.vlbl{font-size:12px;color:var(--mut);margin-top:6px;text-transform:capitalize}
.vcol:hover .vbar{opacity:.7}
@media (min-width:900px){ .dash-charts{grid-template-columns:repeat(2,minmax(0,1fr))} }
.focus-hl{box-shadow:0 0 0 3px rgba(31,77,63,.4)!important;transition:box-shadow .3s}

/* ---------- Réparations et ventes : deux cartes par ligne sur ordinateur ---------- */
.card-grid{display:block}
@media (min-width:900px){
  .card-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;grid-auto-rows:1fr}
  .card-grid > .card{margin:0;padding:12px 14px;height:100%}
}

/* ---------- Bouton de style (toujours visible) ---------- */
.style-btn{position:fixed;right:14px;bottom:76px;z-index:6;border:0;border-radius:99px;padding:8px 13px;font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
.style-btn:hover{transform:translateY(-1px)}

/* ---------- Logo d'en-tête ---------- */
.logo-h{display:block;width:180px;height:auto;flex:none}
/* ---------- Nouveau style : épuré, clair (body.lg) ---------- */
body.lg{background:#f4f6f5;color:#17261f;min-height:100vh}
body.lg h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:6px 0 16px}
body.lg h2{font-size:15px;font-weight:600;margin:18px 0 8px}
body.lg .card{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.95);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(23,38,31,.04),0 6px 22px rgba(23,38,31,.06);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
body.lg .card[onclick]:hover{box-shadow:0 2px 4px rgba(23,38,31,.05),0 10px 28px rgba(23,38,31,.10)}
body.lg input,body.lg select,body.lg textarea{background:rgba(255,255,255,.9);border:1px solid #d9e1dc;border-radius:10px;padding:9px 12px;font-size:14px;box-shadow:none}
body.lg input:focus,body.lg select:focus,body.lg textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,77,63,.12)}
body.lg .btn{background:var(--brand);border-radius:10px;box-shadow:none;font-weight:600}
body.lg .btn.ghost{background:transparent;color:var(--ink);border:1px solid #c9d6cf;box-shadow:none}
body.lg .chip{-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:6px;padding:3px 8px;background:#eef2ef;color:var(--mut)}
body.lg .late{background:#fde4e1;color:var(--bad)}
body.lg .ok{background:#def3e5;color:var(--ok)}
body.lg .warn{background:#fff1d6;color:var(--warn)}
body.lg .modal{background:rgba(23,38,31,.32);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
body.lg .modal .card{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none}
body.lg .fb-panel{background:#fff;border:1px solid #e3e9e5;border-radius:14px;box-shadow:0 12px 32px rgba(23,38,31,.14);-webkit-backdrop-filter:none;backdrop-filter:none}
body.lg .toast,body.lg .flash{background:#17261f;border-radius:10px;-webkit-backdrop-filter:none;backdrop-filter:none}
body.lg .style-btn{background:#fff;color:var(--brand);border:1px solid #d9e1dc;border-radius:10px;padding:8px 12px;box-shadow:0 2px 8px rgba(23,38,31,.08);-webkit-backdrop-filter:none;backdrop-filter:none}
/* Navigation : barre flottante claire sur téléphone */
body.lg nav{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));top:auto;width:auto;max-width:none;transform:none;padding:4px;border:1px solid #e3e9e5;border-radius:16px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 8px 24px rgba(23,38,31,.10);overflow-x:auto;scrollbar-width:none}
body.lg nav::-webkit-scrollbar{display:none}
body.lg nav button{flex:0 0 auto;min-width:76px;font-size:11px;border-radius:12px;padding:9px 4px;color:var(--mut)}
body.lg nav button.on{background:#eef4f1;color:var(--brand)}
body.lg .app{padding-bottom:110px}

/* Ordinateur : navigation en colonne à gauche, contenu élargi */
@media (min-width:900px){
  body.lg nav{top:0;bottom:0;left:0;right:auto;width:232px;flex-direction:column;justify-content:flex-start;padding:22px 14px;border:0;border-right:1px solid #e3e9e5;border-radius:0;background:#fff;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}
  body.lg nav button{flex:none;min-width:0;text-align:left;padding:10px 12px;font-size:14px;border-radius:8px;margin-bottom:2px;color:var(--mut)}
  body.lg nav button.on{background:#eef4f1;color:var(--brand);box-shadow:none}
  body.lg .app{width:auto;max-width:none;margin:0 0 0 232px;padding:10px max(40px,calc((100vw - 232px - 1100px) / 2)) 60px}
  body.lg .app > .row:first-child{margin-top:0!important}
  body.lg .app > .row > select, body.lg .app > div > .row > select{width:auto;flex:1 1 200px;min-width:0}
  body.lg .fb-wrap,body.lg .fb-panel{left:256px}
  body.lg .fb-wrap.edge{left:232px}
  body.lg .fb-wrap.rep{bottom:14px}
  body.lg .style-btn{bottom:18px;right:18px}
}
/* ---------- Bouton d'affichage de la navigation ---------- */
.sb-toggle{display:none;position:fixed;left:12px;top:12px;z-index:7;width:34px;height:34px;align-items:center;justify-content:center;padding:0;border:1px solid #e6e1d6;border-radius:8px;background:#fff;color:#4f544b;cursor:pointer}
.sb-toggle svg{width:18px;height:18px}
.sb-toggle:hover{background:#f4f1ea;color:#1d211e}
@media (min-width:900px){
  body.lg .sb-toggle{display:flex}
  body.lg nav{transition:transform .2s ease}
  body.lg .app{transition:margin-left .2s ease,padding-left .2s ease}
  body.lg nav{padding-top:58px}
  body.lg.sb-off nav{transform:translateX(-100%)}
  body.lg.sb-off .app{margin-left:0;padding:10px max(40px,calc((100vw - 1100px) / 2)) 60px;padding-left:max(64px,calc((100vw - 1100px) / 2))}
  body.lg.sb-off .fb-wrap,body.lg.sb-off .fb-panel{left:14px}
  body.lg.sb-off .fb-wrap.edge{left:0}
}

.demo-bar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#fff4d6;color:#5b4300;border:1px solid #efd58a;border-radius:12px;padding:8px 12px;margin:0 0 10px;font-size:13px;font-weight:600}
@media (min-width:900px){ body.lg nav::-webkit-scrollbar{display:block;width:6px} body.lg nav::-webkit-scrollbar-thumb{background:#c9d6cf;border-radius:3px} body.lg nav{scrollbar-width:thin} }
/* Connexion : une seule mise en page à toute taille. La photo se coupe par la gauche ; le formulaire garde sa taille. */
body.lg:has(.lg-login),body:has(.lg-login){background:#FAF8F3}
body:has(.lg-login) .style-btn{display:none !important}
body .app:has(.lg-login),body.lg .app:has(.lg-login){max-width:none;margin:0;padding:0;width:100%;min-height:100vh}
.lg-login{display:grid;grid-template-columns:minmax(0,min(50%,max(0px,calc(100vw - 496px))))minmax(0,1fr);grid-template-rows:84px auto;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#1F2A24}
.lg-login.is-login .req,.lg-mobonly{display:none !important}
.lg-head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid #E6E1D6;background:#FAF8F3}
.lg-logo{display:block;height:44px;width:auto;max-width:none;margin:0}
.lg-back{display:inline-block;font-size:14px;font-weight:600;color:#1F2A24;text-decoration:none;border:1px solid #DCD7CB;border-radius:999px;padding:9px 16px;background:#fff;white-space:nowrap}
.lg-photo{display:block;position:relative;overflow:hidden;background:linear-gradient(180deg,#EEF3EC,#E3ECE4);min-height:calc(100vh - 84px)}
.lg-photo > img{position:absolute;top:0;right:0;width:100%;min-width:640px;height:auto;display:block;max-width:none}
.lg-form{display:flex;flex-direction:column;justify-content:center;padding:48px 32px;box-sizing:border-box;background:#FAF8F3;min-width:0}
.lg-login .card{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;margin:0 auto;width:100%;max-width:400px}
.lg-h1{display:block;font-family:Manrope,Inter,system-ui,sans-serif;font-weight:500;font-size:40px;line-height:1.1;letter-spacing:-.01em;margin:0 0 8px;color:#1F2A24}
.lg-sub{display:block;font-size:15px;color:#5B6660;margin:0 0 28px}
.lg-login .card > label{display:block;margin:18px 0 8px;font-size:14px;font-weight:500;color:#1F2A24}
.lg-login .card input{display:block;width:100%;height:50px;box-sizing:border-box;border:1px solid #DCD7CB;border-radius:12px;background:#fff;padding:0 14px;font:inherit;font-size:15px;color:#1F2A24;box-shadow:none;margin:0;outline:0}
.lg-login .card input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,77,63,.12)}
.lg-pwd{position:relative}
.lg-login .card .lg-pwd input{padding-right:44px}

/* Second œil : le navigateur (Edge) ajoute son propre bouton « révéler » dans les champs mot de passe */
.lg-login input::-ms-reveal,.lg-login input::-ms-clear{display:none !important;width:0;height:0}
.lg-login input::-webkit-textfield-decoration-container{display:none !important}
/* Œil : le site ajoute ses propres styles de bouton, d'où les !important */
.lg-show{display:flex;align-items:center;justify-content:center;position:absolute;right:3px;top:0;bottom:0;margin:auto 0;height:34px;width:32px;padding:0;cursor:pointer;color:var(--brand)}
.lg-show,.lg-show:hover,.lg-show:focus,.lg-show:active{background:transparent !important;border:0 !important;box-shadow:none !important;outline:none !important;border-radius:0 !important;transform:none !important;-webkit-appearance:none;appearance:none}
.lg-show:focus-visible{color:#17382e !important}

/* ---------- Données ---------- */
async function loadAll(){
  const q = [
    SB.from("dossiers").select("*, clients(prenom,nom)").order("created_at", {ascending:false}),
    SB.from("pieces_dossier").select("*")
  ];
  if (ROLE === "rep") q.push(SB.from("clients").select("*").order("nom"), SB.from("stock").select("*").order("sku"), SB.from("invitations").select("*"));
  else q.push(SB.from("clients").select("*"));
  const r = await Promise.all(q);
  const bad = r.find(x => x.error); if (bad) throw bad.error;
  S.dossiers = r[0].data; S.pieces = r[1].data; S.clients = r[2].data;
  if (ROLE === "rep"){ S.stock = r[3].data; S.inv = r[4].data; }
  const dv = await SB.from("devices").select("*");
  if (dv.error) throw dv.error;
  S.devices = dv.data;
  if (ROLE === "rep") { const cg = await SB.from("catalogue").select("*"); S.catalogue = cg.data || []; if (cg.error) toast("Catalogue : " + msgErr(cg.error)); }
  const vt = await SB.from("ventes").select("*");
  if (vt.error) { S.ventes = []; if (ROLE === "rep") toast("Ventes : " + msgErr(vt.error)); } else S.ventes = vt.data || [];
  if (ROLE === "rep") { const sa = await SB.from("stock_appareils").select("*").order("nom"); if (sa.error) toast("Appareils à vendre : " + msgErr(sa.error)); else S.stockApp = sa.data || []; }
  const sv = await SB.from("sav").select("*").order("created_at", {ascending:false});
  if (sv.error) toast("SAV : " + msgErr(sv.error)); else S.sav = sv.data || [];
  if (ROLE === "rep") { const dp = await SB.from("depenses").select("*").order("date", {ascending:false}); if (dp.error) { S.depenses = []; toast("Dépenses : " + msgErr(dp.error)); } else S.depenses = dp.data || []; }
  if (ROLE === "rep") { const idr = await SB.from("idees").select("*").order("created_at", {ascending:false}); if (idr.error) toast("Idées : " + msgErr(idr.error)); else S.idees = idr.data || []; }
  if (ROLE === "rep") {
    const fb = await SB.from("feedback").select("*").order("created_at", {ascending:false});
    if (fb.error) toast("Suggestions : " + msgErr(fb.error)); else S.feedback = fb.data || [];
  }
}

  const isNew = CM === "code" || CM === "data";
  const login = !isNew && CM !== "pick";

    <label>Téléphone *</label><input id="nT" inputmode="tel" maxlength="20">

        ${login ? '<h1 class="lg-h1">Connexion</h1><p class="lg-sub">Accédez à vos achats et à vos réparations.</p>' : ""}
        ${perso}
        <label>Email${req}</label><input id="lE" type="email" autocomplete="username" onkeydown="if(event.key==='Enter'){event.preventDefault();doLogin()}">

        <label class="lg-mobonly" style="font-weight:400;display:flex;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" onchange="$('lP').type=this.checked?'text':'password'" style="width:auto;margin:0"> Afficher le mot de passe</label>
        ${login ? '<a href="#" class="lg-forgot-d" onclick="setCM(\'forgot\');return false">Mot de passe oublié ?</a>' : ""}
        ${code}
        <div class="err" id="lErr"></div>
        <button class="btn" onclick="doLogin()">${isNew ? "Créer mon espace" : "Se connecter"}</button>
        ${isNew ? '<button class="btn ghost" onclick="setCM(\'login\')">Retour à la connexion</button>' : '<div class="lg-sep"><span>Pas encore de compte ?</span><button class="btn ghost lg-create-d" onclick="setCM(\'pick\')">Créer mon espace</button></div><button class="btn ghost lg-mobonly" onclick="setCM(\'pick\')">Créer mon espace</button><button class="btn ghost lg-mobonly" onclick="setCM(\'forgot\')">Mot de passe oublié ?</button>'}
      </div>

}
function togglePwdBtn(b){ const p = $('lP'); const eye = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>', off = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.8 19.8 0 0 1-3.17 4.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><path d="M1 1l22 22"></path></svg>'; p.type = p.type === "password" ? "text" : "password"; const shown = p.type === "text"; b.innerHTML = shown ? eye : off; b.setAttribute("aria-label", shown ? "Masquer le mot de passe" : "Afficher le mot de passe"); }
function setCM(v){ CM = v; render(); }

function forgotView(){
  return `<img src="logo.png" alt="Seconde Vie" style="display:block;width:180px;max-width:70%;margin:10px auto 14px">
  <div class="card"><div class="t">Mot de passe oublié</div>
    <p class="m">Indique ton email : on t’envoie un lien pour choisir un nouveau mot de passe.</p>
    <label>Email *</label><input id="fE" type="email" autocomplete="username">
    <div class="err" id="fErr"></div>
    <button class="btn" onclick="doForgot()">Envoyer le lien</button>
    <button class="btn ghost" onclick="setCM('login')">Retour à la connexion</button>
  </div>`;
}
async function doForgot(){
  const e = $("fE").value.trim(), err = $("fErr"); err.textContent = "";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { err.textContent = "L’email n’est pas valide."; return; }
  const { error } = await SB.auth.resetPasswordForEmail(e, { redirectTo: location.origin + location.pathname });
  if (error) { err.textContent = msgErr(error); return; }
  CM = "login";
  render();
  toast("Si un compte existe pour cet email, un lien vient d’être envoyé.");
}

/* Écran affiché quand l’utilisateur revient du lien reçu par email */
function recoveryView(){
  return `<img src="logo.png" alt="Seconde Vie" style="display:block;width:180px;max-width:70%;margin:10px auto 14px">
  <div class="card"><div class="t">Nouveau mot de passe</div>
    <label>Nouveau mot de passe *</label><input id="rP1" type="password" autocomplete="new-password">
    <label>Confirmer le mot de passe *</label><input id="rP2" type="password" autocomplete="new-password">
    <div class="err" id="rErr"></div>
    <button class="btn" onclick="doRecovery()">Enregistrer le mot de passe</button>
  </div>`;
}
async function doRecovery(){
  const p1 = $("rP1").value, p2 = $("rP2").value, err = $("rErr"); err.textContent = "";
  if (p1.length < 6) { err.textContent = "Le mot de passe doit contenir au moins 6 caractères."; return; }
  if (p1 !== p2) { err.textContent = "Les deux mots de passe ne sont pas identiques."; return; }
  const { error } = await SB.auth.updateUser({ password: p1 });
  if (error) { err.textContent = msgErr(error); return; }
  RECOVERY = false;
  history.replaceState(null, "", location.pathname);
  await SB.auth.signOut();
  ME = null; ROLE = null;
  CM = "login";
  render();
  toast("Mot de passe modifié. Reconnecte-toi avec ton nouveau mot de passe.");
}

async function doLogin(){
  const e = $("lE").value.trim(), p = $("lP").value, err = $("lErr");
  err.textContent = "";
  if (!e || !p) { err.textContent = "Email et mot de passe requis."; return; }
  if (CM === "login") {
    const { error } = await SB.auth.signInWithPassword({ email: e, password: p });
    if (error) { err.textContent = msgErr(error); return; }
    return boot();
  }
  const v = id => $(id).value.trim();
  let d = null, code = "";
  if (CM === "data") {
    d = {prenom:v("nP"), nom:v("nN"), tel:v("nT"), adr:v("nA"), cp:v("nCp"), ville:v("nV")};
    if (!d.prenom || !d.nom || !d.tel || !d.adr || !d.cp || !d.ville) { err.textContent = "Tous les champs marqués * sont obligatoires."; return; }
    if (!/^[0-9+ .\-]{6,20}$/.test(d.tel)) { err.textContent = "Le téléphone ne doit contenir que des chiffres."; return; }
    if (!/^\d{5}$/.test(d.cp)) { err.textContent = "Le code postal doit comporter 5 chiffres."; return; }
  } else {
    code = v("lC");
    if (!/^\d{6}$/.test(code)) { err.textContent = "Le code doit comporter 6 chiffres."; return; }
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { err.textContent = "L’email n’est pas valide."; return; }
  const { error: se } = await SB.auth.signUp({ email: e, password: p });
  if (se) { err.textContent = msgErr(se); return; }
  const { error: le } = await SB.auth.signInWithPassword({ email: e, password: p });
  if (le) { err.textContent = msgErr(le); return; }
  if (code) {
    const { error: ce } = await SB.rpc("claim_invitation", { p_code: code });
    if (ce) { err.textContent = /code_invalide/.test(ce.message) ? "Code invalide ou déjà utilisé. Ton compte est créé : reconnecte-toi, ou contacte ton réparateur." : "Erreur : " + ce.message; return; }
  } else {
    const { data: u } = await SB.auth.getUser();
    const { error: ie } = await SB.from("clients").insert({ ...d, mail: e, auth_user_id: u.user.id });
    if (ie) {
      err.textContent = ie.code === "23505" ? "Un client existe déjà avec ce téléphone ou cet email. Utilise ton code d’invitation ou contacte ton réparateur." : msgErr(ie);
      return;
    }
  }
  CM = "login";
  await boot();
}

async function boot(){
  const { data } = await SB.auth.getSession();
  ME = data.session ? data.session.user : null;
  if (!ME) { ROLE = null; return render(); }
  const { data: r } = await SB.from("repairers").select("user_id").eq("user_id", ME.id).maybeSingle();
  ROLE = r ? "rep" : "cli";
  if (ROLE === "rep") restoreNav();
  try { await loadAll(); } catch(e) { toast("Erreur de chargement : " + msgErr(e)); }
  if (ROLE === "rep") await syncReservations();
  render();
}
async function logout(){ if (DEMO) return endDemo(); await SB.auth.signOut(); ME = null; ROLE = null; DOSSIER = null; render(); }

/* ---------- Navigation latérale masquable (ordinateur, nouveau style) ---------- */
function applySidebar(){
  let off = false;
  try { off = localStorage.getItem("sv_sb") === "off"; } catch(e) {}
  document.body.classList.toggle("sb-off", off);
}
function toggleSidebar(){
  const off = !document.body.classList.contains("sb-off");
  try { localStorage.setItem("sv_sb", off ? "off" : "on"); } catch(e) {}
  applySidebar();
  setTimeout(() => { if (VIEW === "dashboard" && !DOSSIER) fitDashVals(); }, 230);
}
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "b") { e.preventDefault(); toggleSidebar(); }
});

/* ---------- Choix du style (mémorisé sur cet appareil) ---------- */
function applyStyle(){
  let lg = false;
  try { lg = localStorage.getItem("sv_style") === "lg"; } catch(e) {}
  document.body.classList.toggle("lg", lg);
  const b = $("styleBtn");
  if (b) b.textContent = lg ? "↩ Style actuel" : "✨ Nouveau style";

function toggleStyle(){
  const lg = !document.body.classList.contains("lg");
  try { localStorage.setItem("sv_style", lg ? "lg" : "std"); } catch(e) {}
  applyStyle();
}

/* ---------- Affichage ---------- */
function render(){
  const app = $("app"), nav = $("nav");
  applyStyle();
  applySidebar();
  document.body.classList.toggle("rep-nav", ROLE === "rep" && !!ME);
  saveNav();
  if (RECOVERY) { nav.classList.add("hide"); $("fbWrap").innerHTML = ""; $("notifWrap").innerHTML = ""; closeNotifPanel(); app.innerHTML = recoveryView(); return; }
  if (!ME) { nav.classList.add("hide"); $("fbWrap").innerHTML = ""; $("notifWrap").innerHTML = ""; closeNotifPanel(); app.innerHTML = loginView(); return; }
  if (ROLE === "rep") {
    nav.classList.remove("hide");
    nav.innerHTML = REP_NAV.map(([v,l]) => `<button class="${VIEW===v?"on":""}" onclick="go('${v}')">${l}</button>`).join("") + '<button class="nav-copy" title="Copie les suggestions ajoutées depuis la dernière copie" onclick="copierNouvellesSuggestions()">Copier le récap</button><button class="nav-style" onclick="toggleStyle()">↩ Style actuel</button><button class="nav-logout" onclick="logout()">Déconnexion</button>';
    app.innerHTML = '<div class="row" style="align-items:center;margin:4px 0 8px"><img class="logo-h" src="logo.png" alt="Seconde Vie"><button class="btn small ghost hdr-logout" onclick="logout()">Déconnexion</button></div>' + (DOSSIER ? detailView() : REP[VIEW]());
    if (VIEW === "stock" && !DOSSIER) { mpDraw("n"); mpDraw("a"); }
    if (VIEW === "newvente") mpDraw("v");
    if (VENTE_OPEN && VIEW === "dossiers" && !DOSSIER) mpDraw("v");
    if (VIEW === "newvente" || (VENTE_OPEN && VIEW === "dossiers" && !DOSSIER)) attachPlaces();
    if (DOSSIER) paintDetail();
    if (VIEW === "dashboard" && !DOSSIER) { fitDashVals(); setTimeout(() => { if (VIEW === "dashboard" && !DOSSIER) fitDashVals(); }, 250); }
  } else {
    nav.classList.add("hide");
    app.innerHTML = (DEMO ? '<div class="demo-bar"><span>Aperçu · données fictives, rien n’est enregistré</span><button class="btn small ghost" onclick="endDemo()">Quitter l’aperçu</button></div>' : "") + cliView();
  }
  renderFb();
  renderNotif();
  if (FOCUS_ID) { const el = document.getElementById(FOCUS_ID); if (el) { if (el.scrollIntoView) el.scrollIntoView({behavior: "smooth", block: "center"}); el.classList.add("focus-hl"); setTimeout(() => el.classList.remove("focus-hl"), 1800); } }

async function syncReservations(){

  const changes = S.stock.map(s => {
    const want = S.pieces.filter(p => p.sku === s.sku && p.statut === "Réservée" && actif(p.dossier_id)).reduce((t, p) => t + (+p.qte || 0), 0);
    return [s.sku, want, +s.res || 0];
  }).filter(([, want, have]) => want !== have);
  if (!changes.length) return 0;
  for (const [sku, want] of changes) {
    const { error } = await SB.from("stock").update({ res: want }).eq("sku", sku);
    if (error) { toast(msgErr(error)); return 0; }
  }
  await reload();
  return changes.length;
}

function fitDashVals(){
  document.querySelectorAll(".dash-tile").forEach(t => {
    const v = t.querySelector(".dash-val"), l = t.querySelector(".dash-lbl");
    if (!v || !l) return;
    v.style.fontSize = "";
    const h = t.querySelector(".dash-head");
    const ok = () => {
      const hr = h.getBoundingClientRect(), vr = v.getBoundingClientRect(), lr = l.getBoundingClientRect();
      return vr.right <= hr.right + 0.5 && lr.right <= vr.left - 4 && l.scrollWidth <= l.clientWidth + 1;
    };
    let size = 34;
    while (!ok() && size > 14) { size -= 1; v.style.fontSize = size + "px"; }
  });
}

async function copierNouvellesSuggestions(){
  const fb = await SB.from("feedback").select("*").order("created_at", {ascending:false});
  if (fb.error) { toast("Suggestions : " + msgErr(fb.error)); return; }
  S.feedback = fb.data || [];
  let last = null;
  try { last = localStorage.getItem("sv_avis_copie"); } catch(e) {}
  const seuil = last ? new Date(last) : null;
  const list = (S.feedback || []).filter(x => !x.archive && (!seuil || new Date(x.created_at) > seuil));
  if (!list.length) { flash("Aucune nouvelle suggestion depuis la dernière copie"); return; }
  const txt = recapText(list);
  const plusRecent = list.reduce((m, x) => new Date(x.created_at) > m ? new Date(x.created_at) : m, new Date(0));
  const enregistrer = () => {
    try { localStorage.setItem("sv_avis_copie", plusRecent.toISOString()); } catch(e) {}
    flash("Récap copié ✓ (" + list.length + ")");
  };
  const repli = () => {
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
    ta.remove();
    if (ok) enregistrer(); else flash("Copie impossible sur ce navigateur");
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(enregistrer, repli);
  else repli();
}

  document.querySelectorAll("[data-page]").forEach(el => {

var DRAG = null;
function dragStart(e, panel){
  if (e.target.closest("button")) return;
  const pt = e.touches ? e.touches[0] : e, r = panel.getBoundingClientRect();
  DRAG = {panel, sx: pt.clientX, sy: pt.clientY, ox: r.left, oy: r.top};
  panel.style.bottom = "auto";
  panel.style.left = r.left + "px";
  panel.style.top = r.top + "px";
  if (e.cancelable) e.preventDefault();
}
function dragMove(e){
  if (!DRAG) return;
  const pt = e.touches ? e.touches[0] : e, p = DRAG.panel;
  const x = Math.max(0, Math.min(DRAG.ox + pt.clientX - DRAG.sx, innerWidth - p.offsetWidth));
  const y = Math.max(0, Math.min(DRAG.oy + pt.clientY - DRAG.sy, innerHeight - p.offsetHeight));
  p.style.left = x + "px";
  p.style.top = y + "px";
  if (e.cancelable) e.preventDefault();
}
function dragEnd(){ DRAG = null; }
document.addEventListener("mousemove", dragMove);
document.addEventListener("touchmove", dragMove, {passive: false});
document.addEventListener("mouseup", dragEnd);
document.addEventListener("touchend", dragEnd);

function vLigneFromForm(){
  let l;
  if (VT_COMPAT) {
    const txt = $("vCompatTxt").value.trim();
    if (!PKS.v || !PKS.v.app || !PKS.v.cat) return {error: "Choisis le type et la marque."};
    if (!txt) return {error: "Précise de quel modèle il s’agit."};
    l = {appareil: PKS.v.app, categorie: PKS.v.cat, modele: COMPAT_PRE + txt};
  } else {
    if (!VT_SEL || !VT_SEL.mod) return {error: "Choisis le type, la marque et le modèle, ou coche « Compatible »."};
    l = {appareil: VT_SEL.app, categorie: VT_SEL.cat, modele: VT_SEL.mod};
  }
  const qte = parseInt($("vQte").value, 10);
  if (isNaN(qte) || qte < 1) return {error: "Quantité invalide."};
  const coulOn = $("vCouleurRow").style.display !== "none", ct = $("vCouleur").value;
  if (coulOn && !ct) return {error: "Choisis la couleur."};
  l.quantite = qte;
  l.couleur = coulOn ? ct : null;
  l.appareil_id = $("vAppId").value || null;
  l.acheter = !!($("vAchat") && $("vAchat").checked && !l.appareil_id);
  return {line: l};
}
function vLignesHtml(){
  return VENTE_LIGNES.map((l, i) => {
    const dev = l.appareil_id ? (S.stockApp || []).find(x => x.id === l.appareil_id) : null;
    return '<span class="chip ok" style="margin:2px 4px 2px 0">' + esc([l.appareil, l.categorie, l.modele, l.couleur].filter(Boolean).join(" · ")) + (l.quantite > 1 ? " × " + l.quantite : "") + (dev ? " · réservé du stock" : "") + (l.acheter ? " · à acheter" : "") + ' <button style="border:0;background:none;cursor:pointer;font-weight:700" onclick="vDelLigne(' + i + ')">×</button></span>';
  }).join("") || '<p class="m">Aucun modèle ajouté pour le moment.</p>';
}
function vDrawLignes(){ const box = $("vLignes"); if (box) box.innerHTML = vLignesHtml(); }
function resetPicker(){
  VT_SEL = null; MP.v = []; PKS.v = {app:"", cat:""}; VT_COMPAT = false;
  $("vCompat").checked = false; $("vCompatBox").style.display = "none"; $("vCompatTxt").value = "";
  $("vQte").value = "1"; $("vCouleurRow").style.display = "none"; $("vCouleur").innerHTML = ""; $("vAppId").value = ""; if ($("vAchat")) $("vAchat").checked = false;
  mpDraw("v");
}
function vAddLigne(){
  const err = $("vErr"); err.textContent = "";
  const r = vLigneFromForm();
  if (r.error) { err.textContent = r.error; return; }
  VENTE_LIGNES.push(r.line);
  resetPicker(); vDrawLignes();
}
function vDelLigne(i){ VENTE_LIGNES.splice(i, 1); vDrawLignes(); }
async function setEnvoiStatut(id, v){
  const { error } = await SB.from("ventes").update({ envoi_statut: v }).eq("id", id);
  if (error) { toast(msgErr(error)); return; }
  flash("Statut mis à jour");
  await reload();
}
async function setProbleme(id, on){
  const { error } = await SB.from("ventes").update({ probleme: on }).eq("id", id);
  if (error) { toast(msgErr(error)); return; }
  flash(on ? "Transaction mise en pause" : "Problème résolu");
  await reload();
}

function plus1an(dateStr){
  const b = new Date(dateStr + "T00:00"); b.setFullYear(b.getFullYear() + 1);
  return b.getFullYear() + "-" + String(b.getMonth() + 1).padStart(2, "0") + "-" + String(b.getDate()).padStart(2, "0");
}
function garVente(v){
  if (!v.client_id) return '<div class="m" style="margin-top:6px">Pas de garantie (client de passage)</div>';
  if (!v.archivee) return '<div class="m" style="margin-top:6px">Garantie 1 an · démarre à la validation de la vente</div>';
  const debut = v.date_effectue || v.date_rdv, fin = plus1an(debut);
  const start = new Date(debut + "T00:00"), end = new Date(fin + "T00:00"), today = new Date(); today.setHours(0, 0, 0, 0);
  const pct = Math.min(100, Math.max(0, (today - start) / (end - start) * 100));
  const rest = left(fin);
  const col = rest < 0 ? "var(--bad)" : rest <= 30 ? "var(--warn)" : "var(--brand)";
  return '<div style="margin-top:8px"><div class="t" style="font-size:14px">Garantie 1 an</div>'
    + '<div style="height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px"><div style="height:100%;width:' + pct.toFixed(1) + '%;background:' + col + '"></div></div>'
    + '<div style="display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-weight:600;color:' + col + '"><span>Jusqu’au ' + fr(fin) + '</span><span>' + (rest < 0 ? "Garantie expirée" : jours(rest)) + '</span></div></div>';
}
function venteCard(v){
  const ap = venteLignes(v).filter(l => l.appareil_id).map(l => {
    const x = (S.stockApp || []).find(s => s.id === l.appareil_id);
    return '<div class="m">Réservé : ' + esc(x ? x.nom : "appareil") + (l.quantite > 1 ? " × " + l.quantite : "") + '</div>';
  }).join("");
  const envoi = v.envoi ? '<div class="row" style="align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap"><select onchange="setEnvoiStatut(\'' + v.id + '\',this.value)">' + ENVOI_STATUTS.map(x => '<option' + (v.envoi_statut === x ? ' selected' : '') + '>' + x + '</option>').join("") + '</select>'
    + (v.envoi_statut === "Reçu" && !v.probleme ? ' <button class="chip late" onclick="setProbleme(\'' + v.id + '\',true)">Un problème est survenu</button>' : '') + '</div>'
    + '<div class="m">Transporteur : ' + (v.transporteur ? esc(v.transporteur) : 'non renseigné') + ' · Suivi : ' + (v.suivi ? esc(v.suivi) : 'non renseigné') + '</div>'
    + (v.transporteur && v.suivi ? '<div class="row" style="margin-top:6px"><button class="chip" onclick="suivreColis(\'' + v.id + '\')">Suivre le colis</button></div>' : '') : "";
  const rdv = v.envoi ? "" : '<div class="m">Rendez-vous le ' + fr(v.date_rdv) + (v.heure_rdv ? " à " + esc(String(v.heure_rdv).slice(0, 5)) : "") + (v.lieu ? " · " + esc(v.lieu) + ' · <a href="' + mapsUrl(v.lieu) + '" target="_blank" rel="noopener">Carte</a>' : "") + '</div>';
  const conv = v.lien_conv ? '<div class="m"><a href="' + esc(convHref(v.lien_conv)) + '" target="_blank" rel="noopener">Ouvrir la conversation</a></div>' : "";
  const pause = v.probleme ? '<div class="m" style="color:var(--bad);font-weight:600">⚠ Problème · transaction en pause</div>' : "";
  return '<div class="card" id="vc-' + esc(v.id) + '"' + (v.probleme ? ' style="border:2px solid var(--bad)"' : '') + '><div class="t">' + esc(venteTitre(v)) + '</div>'
    + pause + '<div class="m">' + (v.envoi ? 'Envoi ' : '') + esc(venteClient(v)) + '</div>' + rdv + conv + ap + envoi + garVente(v)
    + '<div class="row" style="margin-top:6px;align-items:center"><span class="chip">' + (v.prix == null ? "Prix à définir" : eur(v.prix)) + '</span><span>'
    + '<button class="chip" onclick="editVente(\'' + v.id + '\')">Modifier / décaler</button> '
    + '<button class="chip ok" onclick="rdvFait(\'' + v.id + '\')">' + (v.envoi ? "Vente effectuée" : "RDV effectué") + '</button> '
    + (v.probleme ? '<button class="chip ok" onclick="setProbleme(\'' + v.id + '\',false)">Problème résolu</button> ' : '')
    + '</span></div></div>';
}
function ventesHtml(){
  const cmpV = {
    appareil: (a, b) => venteTitre(a).localeCompare(venteTitre(b))
  }[SORT_VENTE] || ((a, b) => (String(a.date_rdv) + String(a.heure_rdv || "")).localeCompare(String(b.date_rdv) + String(b.heure_rdv || "")));
  const baseV = (S.ventes || []).filter(v => !v.archivee);
  const venteApps = [...new Set(baseV.flatMap(v => venteLignes(v).map(l => l.appareil)).filter(Boolean))].sort().map(x => [x, x]);
  const list = baseV
    .filter(v => !VENTE_F.kind || (VENTE_F.kind === "envoi" ? !!v.envoi : !v.envoi))
    .filter(v => !VENTE_F.app || venteLignes(v).some(l => l.appareil === VENTE_F.app))
    .sort((a, b) => (b.probleme ? 1 : 0) - (a.probleme ? 1 : 0) || cmpV(a, b));
  const ed = VENTE_EDIT ? (S.ventes || []).find(v => v.id === VENTE_EDIT) : null;
  const form = VENTE_OPEN ? ventesFormHtml(ed || null) : "";
  return `<h2>Ventes</h2><button class="btn ghost small" onclick="go('newvente')">+ Nouvelle vente</button>${form}${sortSelect(SORT_VENTE, [["date", "Date RDV"], ["appareil", "Appareil"]], "setSortVente")}${filtersRow([
    {all: "Tous les types", opts: [["rdv", "Rendez-vous"], ["envoi", "Envoi"]], cur: VENTE_F.kind, js: "VENTE_F.kind=this.value;render()"},
    {all: "Tous les appareils", opts: venteApps, cur: VENTE_F.app, js: "VENTE_F.app=this.value;render()"}
  ])}<div class="card-grid">${list.map(venteCard).join("")}</div>`;
}
function editVente(id){
  const v = (S.ventes || []).find(x => x.id === id); if (!v) return;
  VENTE_EDIT = id; VENTE_OPEN = true;
  if (VIEW !== "dossiers" || DOSSIER) { VIEW = "dossiers"; DOSSIER = null; }
  DOSS_TAB = "ventes";
  VENTE_LIGNES = venteLignes(v).map(l => Object.assign({}, l));
  VT_COMPAT = false; VT_SEL = null; MP.v = []; PKS.v = {app: "", cat: ""};

/* ---------- Appareils à vendre ---------- */
var DEV_SEL = null;
var APP_Q = "", DEV_EDIT = null;
function appStkHtml(){
  const all = S.stockApp || [];
  if (!all.length) return '<p class="m">Aucun appareil à vendre pour le moment.</p>';
  const q = nz(APP_Q).trim();
  const acmp = {
    dispo: (x, y) => (y.qte || 0) - (x.qte || 0),
    res: (x, y) => (y.res || 0) - (x.res || 0)
  }[ASORT] || ((x, y) => String(x.nom).localeCompare(String(y.nom)));
  const list = all
    .filter(x => !q || nz(x.nom).includes(q))
    .filter(x => !ATYPE || x.appareil === ATYPE)
    .filter(x => !AGRADE || (x.grade || "") === AGRADE)
    .filter(x => !AST || (AST === "dispo" ? x.qte > 0 : !(x.qte > 0)))
    .sort(acmp);
  if (!list.length) return '<p class="m">Aucun appareil trouvé.</p>';
  const groups = new Map();
  list.forEach(x => { const k = x.modele ? [x.appareil, x.categorie, x.modele].join("|") : x.id; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); });
  const couleurOf = x => String(x.nom || "").split(" · ")[3] || "";
  return [...groups.values()].map(items => {
    if (items.some(x => x.id === DEV_EDIT)) return devEditHtml(items.find(x => x.id === DEV_EDIT));
    const first = items[0];
    const title = [first.appareil, first.categorie, first.modele].filter(Boolean).join(" · ") || first.nom;
    const dispo = items.reduce((t, x) => t + (+x.qte || 0), 0), res = items.reduce((t, x) => t + (+x.res || 0), 0);
    const lignes = items.slice().sort((a, b) => (couleurOf(a) + (a.grade || "")).localeCompare(couleurOf(b) + (b.grade || ""))).map(x =>
      '<div onclick="editAppareil(\'' + x.id + '\')" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)">'
      + '<div><div class="t" style="font-size:14px">' + esc(couleurOf(x) || "Sans couleur") + (x.grade ? ' · Grade ' + esc(x.grade) : '') + '</div>'
      + (x.res > 0 ? '<div class="m">' + x.res + ' réservé' + (x.res > 1 ? "s" : "") + '</div>' : '') + '</div>'
      + '<span class="chip ' + (x.qte > 0 ? "ok" : "late") + '">' + (x.qte > 0 ? x.qte + " en stock" : "Rupture") + '</span></div>').join("");
    return '<div class="card"><div class="row" style="align-items:center"><div class="t">' + esc(title) + '</div><span class="chip ' + (dispo > 0 ? "ok" : "late") + '">' + (dispo > 0 ? dispo + " en stock" : "Rupture") + '</span></div>'
      + (res > 0 ? '<div class="m">Réservé : ' + res + '</div>' : '') + lignes + '</div>';
  }).join("");
}

async function saveAppareil(){
  const err = $("aErr"); err.textContent = "";

var DOSS_TAB = "rep";

function agendaData(){
  const today = todayIso(), items = [], sans = [];
  const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
  S.dossiers.filter(d => d.statut !== "Remis").forEach(d => {
    const nom = [d.appareil, d.clients ? fullName(d.clients) : ""].filter(Boolean).join(" · ") || "Réparation";
    const go = "openD('" + d.id + "')";
    if (d.statut === "Terminé") {
      if (d.date_retour) items.push({date: d.date_retour, txt: "Limite de retrait · " + nom, go});
      else sans.push({txt: "Date de fin à définir · " + nom, go});
      return;
    }
    if (d.statut === "Devis") {
      if (d.date_recup) items.push({date: d.date_recup, txt: "Dépôt de l’appareil · " + nom, go});
      else sans.push({txt: "Date de dépôt à fixer · " + nom, go});
    }
    if (d.echeance) items.push({date: d.echeance, txt: "Prêt à rendre · " + nom, go});
    else sans.push({txt: "Date de prêt à fixer · " + nom, go});
  });
  S.pieces.filter(p => p.statut === "À commander").forEach(p => sans.push({txt: "Pièce à commander · " + p.qte + " × " + p.nom}));
  (S.ventes || []).filter(v => !v.archivee && !v.envoi).forEach(v => items.push({date: v.date_rdv, txt: "Vente · " + venteTitre(v) + " · " + venteClient(v) + (v.lieu ? " · " + v.lieu : "") + (v.heure_rdv ? " · " + String(v.heure_rdv).slice(0, 5) : "")}));
  return {
    today, sans,
    late: items.filter(e => e.date < today).sort(byDate),
    future: items.filter(e => e.date >= today).sort(byDate)
  };
}
function agendaBody(){
  const a = agendaData();
  const KIND = {vente: ["Vente", "#7c3aed"], pret: ["Prêt", "#1f8a4c"], retrait: ["Retrait", "#2563eb"], depot: ["Dépôt", "#c2410c"], autre: ["À faire", "#6b7280"], late: ["En retard", "#dc2626"]};

  const clean = t => t.replace(/^(Vente|Limite de retrait|Prêt à rendre|Dépôt de l’appareil) · /, "");

    const k = late ? "late" : kindOf(e.txt), [lab, col] = KIND[k];
    const detail = clean(e.txt) + (late && e.date ? " · " + fr(e.date) : "");

  };

  const dayTitle = k => {

    return lbl.charAt(0).toUpperCase() + lbl.slice(1);

async function saveVente(){
  const err = $("vErr"); err.textContent = "";
  const passe = $("vPasse").checked, prixT = $("vPrix").value.trim().replace(",", ".");
  let client_id = null, client_nom = null;
  if (!passe) { client_id = $("vCli").value || null; if (!client_id) { err.textContent = "Sélectionne un client, ou coche « Client de passage »."; return; } }
  else {
    const t = $("vTyp").value;

    else if (t === "avec") { client_nom = $("vNom").value.trim(); if (!client_nom) { err.textContent = "Indique le nom."; return; } }
    else if (t === "leboncoin") { const ps = $("vPseudo").value.trim(); if (!ps) { err.textContent = "Indique le pseudo leboncoin."; return; } client_nom = "leboncoin : " + ps; }
    else { err.textContent = "Choisis sans nom, avec nom ou leboncoin."; return; }
  }
  const envoi = passe && $("vTyp").value === "leboncoin" && $("vEnvoi").checked;
  // si aucun modèle n’est ajouté, on prend celui qui est saisi dans le sélecteur
  if (!VENTE_LIGNES.length) {
    const r = vLigneFromForm();
    if (r.error) { err.textContent = r.error; return; }
    VENTE_LIGNES.push(r.line);
  }
  const date = envoi ? todayIso() : $("vDate").value;
  if (!date) { err.textContent = "Indique la date du rendez-vous."; return; }
  if (prixT !== "" && isNaN(parseFloat(prixT))) { err.textContent = "Prix invalide."; return; }
  const editing = !!VENTE_EDIT;
  const old = editing ? venteLignes((S.ventes || []).find(v => v.id === VENTE_EDIT) || {}) : [];
  const oldKeys = new Set(old.map(lineKey));
  for (const l of VENTE_LIGNES) {
    if (l.appareil_id || l.acheter || oldKeys.has(lineKey(l))) continue;
    err.textContent = (l.modele || "Ce modèle") + " : pas en stock. Choisis l’appareil du stock, ou coche « Pas en stock » pour le mettre dans les appareils à acheter.";
    return;
  }
  const had = lignesRes(old), want = lignesRes(VENTE_LIGNES);
  for (const id of Object.keys(want)) {
    const x = (S.stockApp || []).find(s => s.id === id);
    if (!x) { err.textContent = "Un appareil choisi n’est plus disponible en stock."; return; }
    const dispo = x.qte + (had[id] || 0);
    if (dispo < want[id]) { err.textContent = x.nom + " : stock insuffisant (" + dispo + " disponible(s), " + want[id] + " demandé(s))."; return; }
  }
  const first = VENTE_LIGNES[0];
  const row = {
    appareil: first.appareil, categorie: first.categorie, modele: first.modele, lignes: VENTE_LIGNES,
    lieu: envoi ? null : ($("vLieu").value.trim() || null), prix: prixT === "" ? null : parseFloat(prixT), date_rdv: date,
    heure_rdv: envoi ? null : ($("vHeure").value || null), lien_conv: $("vConv").value.trim() || null,
    envoi, transporteur: envoi ? ($("vTransp").value || null) : null, suivi: envoi ? ($("vSuivi").value.trim() || null) : null, envoi_statut: envoi ? $("vEnvStat").value : null,
    client_id, client_nom
  };
  const { error } = editing
    ? await SB.from("ventes").update(row).eq("id", VENTE_EDIT)
    : await SB.from("ventes").insert(row);
  if (error) { err.textContent = msgErr(error); return; }
  const ids = new Set([...Object.keys(had), ...Object.keys(want)]);
  for (const id of ids) {
    const dq = (had[id] || 0) - (want[id] || 0), dr = (want[id] || 0) - (had[id] || 0);

  flash(editing ? "Vente modifiée" : "Vente enregistrée");
  await reload();
}

async function addCat(){
  const rep = $("cR").value.trim(), pr = $("cP").value.trim().replace(",", "."), du = $("cD").value.trim(), err = $("cRErr");
  err.textContent = "";
  if (!rep) { err.textContent = "Indique la réparation."; return; }
  if (pr !== "" && pr !== "devis" && (isNaN(+pr) || +pr < 0)) { err.textContent = "Prix invalide."; return; }
  const ref = S.catalogue.find(r => r.modele === CAT.mod);
  const { error } = await SB.from("catalogue").insert({ appareil: CAT.app, categorie: ref ? ref.categorie : (CAT.cat || "Autre"), modele: CAT.mod, reparation: rep, prix: pr === "" ? null : pr, duree: durNorm(du), joy: false });
  if (error) { err.textContent = msgErr(error); return; }
  toast("Réparation ajoutée");
  await reload();
}
async function setPrixCat(id, v){
  v = String(v).trim().replace(",", "."); const p = v === "" ? null : v;
  if (p !== null && p !== "devis" && (isNaN(+p) || +p < 0)) { toast("Prix invalide"); render(); return; }
  const { error } = await SB.from("catalogue").update({ prix: p }).eq("id", id);
  if (error) { toast(msgErr(error)); return; }
  toast("Prix enregistré");
  await reload();
}
async function delCat(id){
  if (!confirm("Supprimer cette réparation du catalogue ?")) return;
  const { error } = await SB.from("catalogue").delete().eq("id", id);
  if (error) { toast(msgErr(error)); return; }
  toast("Réparation supprimée");
  await reload();
}
async function importCat(){
  if (!confirm("Importer le catalogue de base (103 réparations) ?")) return;
  const rows = CAT_SEED.map(r => ({appareil: r[0], cible: r[1], categorie: r[2], modele: r[3], reparation: r[4], prix: r[5], duree: r[6], joy: r[7]}));
  for (let i = 0; i < rows.length; i += 50) {
    const { error } = await SB.from("catalogue").insert(rows.slice(i, i + 50));
    if (error) { toast(msgErr(error)); return; }
  }
  toast("Catalogue importé");
  await reload();
}
function plus6m(dateStr){
  const b = dateStr ? new Date(dateStr + "T00:00") : new Date();
  b.setHours(0, 0, 0, 0); b.setMonth(b.getMonth() + 6);
  return b.getFullYear() + "-" + String(b.getMonth() + 1).padStart(2, "0") + "-" + String(b.getDate()).padStart(2, "0");
}
function garantieHtml(d){
  if (d.statut !== "Remis" || !d.echeance)
    return '<div class="m" style="margin-top:6px">La garantie de 6 mois démarre à la remise de l’appareil.</div>';
  const fin = plus6m(d.echeance);
  const start = new Date(d.echeance + "T00:00"), end = new Date(fin + "T00:00");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const pct = Math.min(100, Math.max(0, (today - start) / (end - start) * 100));
  const rest = left(fin);
  const col = rest < 0 ? "var(--bad)" : rest <= 30 ? "var(--warn)" : "var(--brand)";
  return '<div style="margin-top:8px"><div class="t" style="font-size:14px">Garantie 6 mois</div>'
    + '<div style="height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px"><div style="height:100%;width:' + pct.toFixed(1) + '%;background:' + col + '"></div></div>'
    + '<div style="display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-weight:600;color:' + col + '"><span>Jusqu’au ' + fr(fin) + '</span><span>' + (rest < 0 ? "Garantie expirée" : jours(rest)) + '</span></div></div>';
}

/* Barre entre le dépôt et la date de remise : vert = jours passés, gris = jours restants */
function dateBarHtml(d, legend){
  if (!d.echeance) return "";
  const debut = d.date_recup || String(d.created_at || "").slice(0, 10);
  if (!debut) return "";
  const start = new Date(debut + "T00:00");
  const end = new Date(d.echeance + "T00:00"), now = new Date(todayIso() + "T00:00");
  const total = Math.max(1, Math.round((end - start) / 86400000));
  const passed = Math.min(total, Math.max(0, Math.round((now - start) / 86400000)));
  const pct = Math.round(passed / total * 100);
  const restants = Math.max(0, total - passed) + ' j restants';
  const barre = '<div style="height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px"><div style="height:100%;width:' + pct + '%;background:#1f8a4c"></div></div>';
  if (typeof legend === "string" || legend === true) {
    // carte de la liste : le texte est placé sous la barre
    return '<div style="margin-top:10px">' + barre + '<div class="m" style="margin-top:4px">' + (typeof legend === "string" ? legend : restants) + '</div></div>';
  }
  // page détail : légende complète au-dessus de la barre
  const complet = passed + ' j passés · ' + restants;
  return '<div style="margin-top:10px"><div class="m">' + complet + '</div>' + barre + '</div>';
}
async function fSave(field, value){
  const d = S.dossiers.find(x => x.id === DOSSIER);
  if (!d) return;
  let v = value;
  if (field === "panne") {
    v = String(value).trim();
    if (!v) { toast("Donne un nom à la réparation."); $("dNom").value = d.panne || ""; return; }
  } else if (field === "prix") {
    const t = String(value).trim().replace(",", ".");
    if (t !== "" && isNaN(parseFloat(t))) { toast("Prix invalide."); return; }
    v = t === "" ? null : parseFloat(t);
  } else if (field === "duree") {
    v = durNorm(value);
  } else if (["acompte", "paye_virement", "paye_especes"].includes(field)) {
    const t = parseFloat(String(value || "0").replace(",", "."));
    if (isNaN(t) || t < 0) { toast("Montant invalide."); return; }
    v = t;
  } else {
    v = value || null;
  }
  if (field === "date_recup" && v && d.echeance && v > d.echeance) {
    toast("La date de dépôt ne peut pas être après la date de remise.");
    if ($("dRecup")) $("dRecup").value = d.date_recup || "";
    return;
  }
  if (field === "echeance" && v && d.date_recup && v < d.date_recup) {
    toast("La date de remise ne peut pas être avant la date de dépôt.");
    if ($("dEc")) $("dEc").value = d.echeance || "";
    return;
  }
  const upd = {[field]: v};
  if (field === "date_termine") upd.date_retour = v ? plus30(v) : null;
  const tmp = Object.assign({}, d, upd);
  if (["prix", "acompte", "paye_virement", "paye_especes"].includes(field)) upd.paye = tmp.prix != null && payInfo(tmp).reste === 0;
  const { error } = await SB.from("dossiers").update(upd).eq("id", d.id);
  if (error) { toast(msgErr(error)); return; }
  Object.assign(d, upd);
  paintDetail();
  flash("Enregistré ✓");
}
async function setStatut(st){
  const d = S.dossiers.find(x => x.id === DOSSIER), sel = $("dSt");
  const fail = msg => { sel.value = d.statut; toast(msg); };
  if (st === d.statut) return;
  if (st !== "Devis en cours") {
    if (d.statut === "Devis en cours" && !devisOk(d)) return fail("Renseigne la date de dépôt, le prix et la durée avant de quitter le devis.");
    if (pcs(d.id).some(p => p.statut !== "Réservée")) return fail("Impossible : toutes les pièces doivent être réservées.");
  }
  if (st === "Remis") {
    if (!d.echeance) return fail("Renseigne la date « Remis le » avant de passer en Remis.");
    if (payInfo(d).reste !== 0) return fail("Le paiement doit être complet avant de passer en Remis.");
  }
  const date_termine = st === "Terminé" ? (d.date_termine || todayIso()) : null;
  const date_retour = date_termine ? plus30(date_termine) : null;
  const { error } = await SB.from("dossiers").update({statut: st, date_termine, date_retour}).eq("id", d.id);
  if (error) return fail(msgErr(error));
  // pièces réservées : retirées de la réservation quand la réparation est Terminé/Remis (le stock n'est pas rendu)
  const wasFinal = ["Terminé", "Remis"].includes(d.statut), isFinal = ["Terminé", "Remis"].includes(st);
  if (wasFinal !== isFinal) {
    for (const p of pcs(d.id)) {
      if (p.statut !== "Réservée" || !p.sku) continue;
      const s2 = S.stock.find(x => x.sku === p.sku); if (!s2) continue;
      const r = await SB.from("stock").update({ res: Math.max(0, s2.res + (isFinal ? -p.qte : p.qte)) }).eq("sku", s2.sku);
      if (r.error) toast(msgErr(r.error));
    }
  }
  flash("Enregistré ✓");
  await reload();
}

async function applyPst(p, v){

  if (v === "Réservée" && p.statut !== "Réservée") {
    if (!st) return "Cette pièce n’a pas de SKU en stock : réservation impossible.";
    if (st.qte < p.qte) return "Stock insuffisant : " + st.qte + " disponible(s), " + p.qte + " nécessaire(s).";
    const r = await SB.from("stock").update({ qte: st.qte - p.qte, res: st.res + p.qte }).eq("sku", st.sku);
    if (r.error) return msgErr(r.error);
  } else if (p.statut === "Réservée" && v !== "Réservée" && st) {
    const r = await SB.from("stock").update({ qte: st.qte + p.qte, res: st.res - p.qte }).eq("sku", st.sku);
    if (r.error) return msgErr(r.error);

function makeDemoSB(){
  const KEY = {pieces_dossier: "pieces", stock_appareils: "stockApp", invitations: "inv"};
  const clone = x => JSON.parse(JSON.stringify(x));
  let seq = 0;
  const store = t => { const k = KEY[t] || t; if (!Array.isArray(S[k])) S[k] = []; return S[k]; };
  const from = table => {
    let op = "select", payload = null, one = false;
    const filters = [];
    const run = () => {
      const rows = store(table), match = r => filters.every(f => f(r));
      let data = [];
      if (op === "select") data = rows.filter(match).map(clone);
      else if (op === "insert") data = payload.map(p => { const r = Object.assign({id: "demo-" + (++seq)}, p); rows.push(r); return clone(r); });
      else if (op === "update") rows.filter(match).forEach(r => { Object.assign(r, payload); data.push(clone(r)); });
      else if (op === "delete") { for (let i = rows.length - 1; i >= 0; i--) if (match(rows[i])) rows.splice(i, 1); }
      if (one) data = data[0] || null;
      return Promise.resolve({data, error: null});
    };
    const b = {
      select(){ return b; },
      order(){ return b; },
      eq(col, val){ filters.push(r => r[col] === val); return b; },
      insert(rows){ op = "insert"; payload = Array.isArray(rows) ? rows : [rows]; return b; },
      update(p){ op = "update"; payload = p; return b; },
      delete(){ op = "delete"; return b; },
      single(){ one = true; return b; },
      maybeSingle(){ one = true; return b; },
      then(ok, ko){ return run().then(ok, ko); }
    };
    return b;
  };
  return {
    from,
    auth: {getSession: async () => ({data: {session: null}}), signOut: async () => ({error: null})},
    rpc: async () => ({data: null, error: {message: "Action indisponible dans l’aperçu"}})
  };
}

var DBA = {table: null, rows: null, edit: null, err: "", lock: true};

async function dbaOpen(t){ DBA = {table: t || null, rows: null, edit: null, err: "", lock: true}; render(); if (t) dbaLoad(); }
async function dbaLoad(){
  if (!DBA.table) return;
  const t = DBA.table;
  const { data, error } = await SB.from(t).select("*");
  if (DBA.table !== t) return;

async function dbaSave(){
  if (DBA.lock) return;
  let obj;
  try { obj = JSON.parse($("dbaTxt").value); } catch(e) { DBA.err = "JSON invalide : " + e.message; render(); return; }
  if (!obj || typeof obj !== "object" || Array.isArray(obj)) { DBA.err = "Le contenu doit être un objet { … }."; render(); return; }
  DBA_HIDE.forEach(k => delete obj[k]);
  const isNew = DBA.edit === "new";
  const row = isNew ? null : DBA.rows && DBA.rows[DBA.edit];
  if (!isNew && !row) { DBA.err = "Ligne introuvable, actualise la table."; render(); return; }
  const t = DBA.table;
  const res = isNew ? await SB.from(t).insert(obj) : await SB.from(t).update(obj).eq("id", row.id);
  if (res.error) { DBA.err = "Enregistrement impossible : " + msgErr(res.error); render(); return; }

async function dbaDel(i){

async function claimNow(){
  const code = $("cCode").value.trim(), err = $("cErr2");
  if (!/^\d{6}$/.test(code)) { err.textContent = "Le code doit comporter 6 chiffres."; return; }
  const { error } = await SB.rpc("claim_invitation", { p_code: code });
  if (error) { err.textContent = /code_invalide/.test(error.message) ? "Code invalide ou déjà utilisé." : "Erreur : " + error.message; return; }
  await boot();
}

let JOUR_AFFICHE = todayIso();
function verifierJour(){
  if (todayIso() === JOUR_AFFICHE) return;
  JOUR_AFFICHE = todayIso();
  if (ME) render();
}
setInterval(verifierJour, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) verifierJour(); });
window.addEventListener("focus", verifierJour);
window.addEventListener("resize", () => { if (VIEW === "dashboard" && !DOSSIER) fitDashVals(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (VIEW === "dashboard" && !DOSSIER) fitDashVals(); });

boot().catch(function(e){ var a = document.getElementById('app'); if (a && !a.innerHTML) a.innerHTML = '<p class="m" style="padding:24px">L’application n’a pas pu démarrer. Vérifiez votre connexion internet, puis rechargez la page.</p>'; console.error(e); });
</script>
