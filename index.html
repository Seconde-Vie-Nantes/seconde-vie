/* Texte réduit à lettres et chiffres : « Redmi · Note 5 » -> « redminote5 » */
function modeleKey(x){ return nz(x).replace(/[^a-z0-9]/g, ""); }
/* Vrai si le texte désigne ce modèle (la marque peut précéder, la couleur suivre ; « Pro », « Plus », « A » ne correspondent pas) */
function modeleCorrespond(txt, key){
  const k = modeleKey(txt), i = k.indexOf(key);
  if (i < 0) return false;
  return !/^(pro|plus|a|se|e|\d)/.test(k.slice(i + key.length));
}
/* Photo du modèle d’un appareil : cherche dans le modèle de l’appareil, la marque + modèle de la base, puis le nom des réparations */
/* Première photo d’un modèle de la base (ajoutée dans la page Appareils) */
function modelePhoto(d){
  const base = (S.appBase || []).find(b => b.type === d.type && b.modele === d.modele)
    || (S.appBase || []).find(b => b.type === d.type && modeleKey(b.modele) === modeleKey(d.modele));
  if (base && baseModelePhoto(base, d.couleur)) return baseModelePhoto(base, d.couleur);
  const cands = [d.modele, base ? (base.marque || "") + " " + (base.modele || "") : ""]
    .concat(S.dossiers.filter(x => x.device_id === d.id).map(x => x.appareil || ""));
  for (const key of Object.keys(MODELE_PHOTOS)) {
    if (cands.some(c => modeleCorrespond(c, key))) return MODELE_PHOTOS[key];
  }
  return "";
}
function cliAchatsAppHtml(me){
  const out = [];
  (S.ventes || []).filter(v => v.client_id === me.id).forEach(v => venteLignes(v).forEach(l => {
    if (!l.appareil_id) return;
    const nom = [l.appareil, l.categorie, l.modele, l.couleur].filter(Boolean).join(" · ") + (l.quantite > 1 ? " × " + l.quantite : "");
    const quand = v.archivee ? "Acheté le " + fr(v.date_effectue || v.date_rdv) : "Achat prévu" + (v.date_rdv ? " le " + fr(v.date_rdv) : "");
    out.push('<div class="card"><div class="t">' + esc(nom) + '</div><div class="m">' + esc(quand) + '</div></div>');
  }));
  return out.join("");
}
/* Appareils du client : une carte par appareil (photo, identifiant, état de la dernière réparation, modifier, photos) */
function devStatutTxt(r){
  if (!r) return "Aucune réparation";
  return {"Devis en cours": "Le devis est en cours", "En cours": "La réparation en cours", "Terminé": "La réparation est terminée", "Remis": "Appareil remis"}[r.statut] || (r.statut || "Réparation");
}
function cliDevCard(d){
  const r = S.dossiers.filter(x => x.device_id === d.id).sort((a, b) => String(b.created_at || "").localeCompare(String(a.created_at || "")))[0];
  const tel = d.type === "Téléphone";
  const nPh = photosFor("device", d.id).length;
  const alerte = !S.appBaseErr && !baseHasModele(d.type, d.modele) ? repere("Appareil non relié à la base Appareils") : "";
  return '<div class="card dev-card2" data-page="Mes appareils">'
    + '<div class="dev-ph">' + (modelePhoto(d) ? '<img src="' + modelePhoto(d) + '" alt="' + esc(devNom(d)) + '">' : ICON_IMG) + '</div>'
    + '<div class="dev-mid">'
    + '<div class="t">' + esc(devNom(d)) + (d.couleur ? ' · ' + esc(d.couleur) : '') + alerte + '</div>'
    + '<div class="m">' + (tel ? 'IMEI' : 'N° de série') + ' : <span class="code">' + esc((tel ? d.imei : d.sn) || "–") + '</span></div>'
    + (tel && d.pin ? '<div class="m">Code PIN : <span class="code">' + esc(d.pin) + '</span></div>' : '')
    + (tel && d.schema_code ? '<div class="m">Schéma : <span class="code">' + esc(d.schema_code) + '</span></div>' : '')
    + '<div class="dev-st">' + esc(devStatutTxt(r)) + '</div>'
    + '<div id="de-' + d.id + '"></div>'
    + '</div>'
    + '<div class="dev-side">'
    + (cliPeutModifier(d) ? '<button class="btn ghost sq" title="Modifier" aria-label="Modifier" onclick="cliDevEdit(\'' + d.id + '\')">' + ICON_EDIT + '</button>' : '<span></span>')
    + '<button class="chip" title="Photos de l’appareil" onclick="openGalerie(\'device\',\'' + d.id + '\')">' + ICON_IMG + ' ' + nPh + '</button>'
    + '</div></div>';
}
/* Client : l’identifiant (IMEI ou N° de série) se renseigne une seule fois ; le code PIN se modifie ; le reste est lu seulement */
function devIdVide(d){ const x = d.type === "Téléphone" ? d.imei : d.sn; return !x || x === "Non renseigné"; }
function cliPeutModifier(d){ return devIdVide(d) || (d.type === "Téléphone" && !d.schema_code); }
function cliDevEdit(devId){
  const d = S.devices.find(x => x.id === devId), box = $("de-" + devId);
  if (!d || !box) return;
  const tel = d.type === "Téléphone";
  let h = '<div class="card" style="margin:8px 0 0">';
  if (devIdVide(d)) h += '<label>' + devIdText(d.type).replace(" *", "") + '</label><input id="cdI" inputmode="numeric" placeholder="' + (tel ? "15 chiffres" : "") + '">'
    + '<div class="m" style="margin-top:4px">Une fois renseigné, il ne peut plus être modifié.</div>';
  if (tel && d.schema_code) h += '<div class="m" style="margin-top:8px">Le schéma de déverrouillage est modifié par ton réparateur.</div>';
  else if (tel) h += '<label>Code PIN</label><input id="cdP" inputmode="numeric" value="' + esc(d.pin || "") + '" placeholder="Aucun code">';
  h += '<button class="btn" style="margin-top:10px" onclick="saveDevCli(\'' + d.id + '\')">Enregistrer</button>'
    + '<button class="btn ghost" onclick="render()">Annuler</button><div class="err" id="cdErr"></div></div>';
  box.innerHTML = h;
}
async function saveDevCli(devId){
  const d = S.devices.find(x => x.id === devId), err = $("cdErr");
  if (!d || !err) return;
  err.textContent = "";
  const tel = d.type === "Téléphone", row = {};
  const iEl = $("cdI");
  if (iEl && devIdVide(d)) {
    const id = iEl.value.replace(/\s/g, "");
    if (id) {
      if (tel && !/^\d{15}$/.test(id)) { err.textContent = "L’IMEI doit comporter 15 chiffres."; return; }
      if (tel) row.imei = id; else row.sn = id;
    }
  }
  const pEl = $("cdP");
  if (pEl) {
    const p = pEl.value.trim();
    if (!p && d.pin) { err.textContent = "Le code PIN ne peut pas être supprimé ici : contacte ton réparateur."; return; }
    if (p && p !== (d.pin || "")) row.pin = p;
  }
  if (!Object.keys(row).length) { err.textContent = "Rien à enregistrer."; return; }
  const res = await SB.from("devices").update(row).eq("id", devId).select("id");
  if (res.error) { err.textContent = msgErr(res.error); return; }
  if (!res.data || !res.data.length) { err.textContent = "Enregistrement refusé : contacte ton réparateur."; return; }
  toast("Appareil mis à jour");
  await reload();
}
function cliDevHtml(me){
  const ds = S.devices.filter(d => d.client_id === me.id);

}

/* Marque d’un appareil client : retrouvée dans la base (le client n’a pas de colonne marque) */
function devMarqueOf(d){ const x = (S.appBase || []).find(b => b.type === d.type && b.modele === d.modele); return x ? x.marque : ""; }
/* Texte d’un appareil tel qu’il est dans la base Appareils : marque · modèle · couleur */
function appareilTexte(v){ return [devMarqueOf(v), v.modele].filter(Boolean).join(" · ") + (v.couleur ? " · " + v.couleur : ""); }
/* Une réparation reliée à un appareil prend le texte de cet appareil (plus de texte recopié qui peut être périmé) */
function enrichirAppareils(){
  const par = new Map((S.devices || []).map(v => [v.id, v]));
  (S.dossiers || []).forEach(x => {
    x.appAlerte = "";
    x.appType = "";
    if (!x.device_id) { if (ROLE === "rep" && !S.appBaseErr) x.appAlerte = "Réparation non reliée à un appareil : à corriger"; return; }
    const v = par.get(x.device_id);
    const suivi = ROLE === "rep" && !S.appBaseErr;   // seul le réparateur peut corriger
    if (!v) { if (suivi) x.appAlerte = "Appareil lié introuvable : à corriger"; return; }
    if (!S.appBaseErr && baseHasTrio(v.type, devMarqueOf(v), v.modele)) { x.appareil = appareilTexte(v); x.appType = v.type || ""; return; }
    // type, marque ou modèle absents de la base : on garde l’ancien texte, relié à rien, et on signale
    if (suivi) x.appAlerte = "Type, marque ou modèle plus reliés à la base Appareils : à corriger";
  });
}

async function saveDev(devId, cid){
  const v = x => $(x).value.trim(), err = $("dvErr"); err.textContent = "";
  const t = abSelVal("dvT").trim(), ma = abSelVal("dvMa").trim(), mo = abSelVal("dvM").trim();
  const unk = $("dvU").checked, id = unk ? "Non renseigné" : v("dvI").replace(/\s/g, "");
  if (!t) { err.textContent = "Choisis d’abord un type."; return; }
  if (!ma) { err.textContent = "La marque est obligatoire."; return; }
  if (!mo) { err.textContent = "Le modèle est obligatoire."; return; }
  if (!unk && !id) { err.textContent = "Le " + (t === "Téléphone" ? "IMEI" : "numéro de série") + " est obligatoire."; return; }
  if (t === "Téléphone" && !unk && !/^\d{15}$/.test(id)) { err.textContent = "L’IMEI doit comporter 15 chiffres."; return; }
  const row = {type: t, modele: mo, couleur: v("dvC") || null, etat: v("dvE") || null, imei: null, sn: null, pin: null, schema_code: null};
  if (t === "Téléphone") {
    row.imei = id;
    const mode = $("dvK").value;
    if (mode !== "none") { const k = v("dvK2") || null; if (mode === "sch") row.schema_code = k; else row.pin = k; }
  } else row.sn = id;
  const res = devId
    ? await SB.from("devices").update(row).eq("id", devId)
    : await SB.from("devices").insert(Object.assign({client_id: cid}, row));
  if (res.error) { err.textContent = msgErr(res.error); return; }
  if (ROLE === "rep" && !S.appBaseErr && !baseHasTrio(t, ma, mo)) {
    const rb = await SB.from("appareils_base").insert({type: t, marque: ma, modele: mo});
    if (rb.error) toast("Appareil enregistré, mais pas ajouté à la base : " + msgErr(rb.error));
    else toast("Appareil ajouté à la base");
  }
  toast(devId ? "Appareil modifié" : "Appareil ajouté");
  await reload();
}

/* Enregistre les pièces liées pour la réparation qui vient d’être créée */
async function piecesPrevLier(dossierId, k){
  const L = PIECES_PREV[k] || [];
  for (const p of L) {
    const s = S.stock.find(x => x.sku === p.sku);
    if (s && s.qte >= p.qte) {
      const r = await SB.from("stock").update({qte: s.qte - p.qte, res: s.res + p.qte}).eq("sku", s.sku);
      if (r.error) { toast(msgErr(r.error)); continue; }
      s.qte -= p.qte; s.res += p.qte;   // stock local à jour pour une éventuelle deuxième ligne de la même pièce
      const { error } = await SB.from("pieces_dossier").insert({dossier_id: dossierId, nom: p.nom, qte: p.qte, statut: "Réservée", sku: p.sku});
      if (error) toast(msgErr(error));
    } else {
      const { error } = await SB.from("pieces_dossier").insert({dossier_id: dossierId, nom: p.nom, qte: p.qte, statut: "À commander", sku: p.sku});
      if (error) toast(msgErr(error));
    }
  }
  PIECES_PREV[k] = [];
}

/* Déroule ou replie une fiche client avec une animation ; l’ancienne fiche se replie avant d’ouvrir la nouvelle */
/* Historique : ouvrir une fiche client ajoute une étape, pour que le bouton retour la referme */
function cliApply(cur, next){
  const flagged = !!(history.state && history.state.cliOpen);
  CLI_OPEN = next;
  if (next && !cur) history.pushState({cliOpen: true}, "");
  else if (next && cur && flagged) history.replaceState({cliOpen: true}, "");
  else if (!next && flagged) history.back();
  render();
}
function toggleCli(id){
  if (CLI_BUSY) return;
  CLI_DEV = null; CLI_NOANIM = false;
  const cur = CLI_OPEN, next = cur === id ? null : id;
  if (!cur) { cliApply(cur, next); return; }
  const w = document.querySelector('[data-cli-body="' + cur + '"]');
  if (!w) { cliApply(cur, next); return; }
  CLI_BUSY = true;
  w.classList.add("cli-out");
  setTimeout(() => { CLI_BUSY = false; cliApply(cur, next); }, 200);
}

async function photoPrep(f){
  try {
    const bmp = await createImageBitmap(f);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); /* JPEG n’a pas de transparence : le fond devient blanc, pas noir */
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    return blob ? { body: blob, ext: "jpg", type: "image/jpeg" } : null;
  } catch (e) { return null; }
}
/* Nom propre d’une photo de modèle : « xiaomi-redmi-note-5-1.jpg », rangée dans un dossier au nom du modèle (taken = noms déjà prévus dans cet envoi) */
function photoSlug(t){ return nz(t).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
function modelePhotoPath(baseId, ext, taken){
  const base = (S.appBase || []).find(b => b.id === baseId);
  const slug = photoSlug(base ? (base.marque || "") + " " + (base.modele || "") : "") || "appareil";
  const used = (S.photos || []).filter(p => p.appareil_base_id === baseId).map(p => String(p.path || "")).concat(taken || []);
  let n = used.length + 1;
  while (used.indexOf("modeles/" + baseId + "/" + slug + "-" + n + "." + ext) > -1) n++;
  return "modeles/" + baseId + "/" + slug + "-" + n + "." + ext;
}
/* SQL à exécuter une fois dans Supabase pour les colonnes de la table « photos » (sans effet si elles existent déjà) */
var PHOTOS_SQL = "alter table photos add column if not exists couleur text; alter table photos add column if not exists ordre integer; alter table photos add column if not exists appareil_base_id uuid references appareils_base(id) on delete cascade; alter table photos add column if not exists device_id uuid; alter table photos add column if not exists dossier_id uuid;";
async function addPhotos(kind, id, input){
  const files = [...(input.files || [])];
  if (!files.length) return;
  PHOTO_ERR = "";
  if (DEMO) {
    S.photos = (S.photos || []).concat(files.map(f => ({ id: "demo-p-" + Math.random().toString(36).slice(2), dossier_id: kind === "dossier" ? id : null, device_id: (kind === "dossier" || kind === "modele" || kind === "modcol") ? null : id, appareil_base_id: (kind === "modele" || kind === "modcol") ? baseOfKey(kind, id) : null, couleur: kind === "modcol" ? colKey(id).nom : null, quali: kind === "quali", path: URL.createObjectURL(f), demo: true })));
  } else {
    const taken = [];
    for (const f of files) {
      const rawExt = ((f.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "")) || "jpg";
      const prep = (await photoPrep(f)) || { body: f, ext: rawExt, type: f.type || "image/jpeg" };
      const dossierPh = kind === "dossier" ? "dossiers/" : kind === "quali" ? "qualirepar/" : kind === "modele" ? "modeles/" : "appareils/";
      let path = (kind === "modele" || kind === "modcol") ? modelePhotoPath(baseOfKey(kind, id), prep.ext, taken) : dossierPh + id + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + prep.ext;
      taken.push(path);
      let up = await SB.storage.from(PHOTO_BUCKET).upload(path, prep.body, { contentType: prep.type });
      /* un fichier du même nom existe déjà (ancien fichier resté dans le stockage) : on ajoute un suffixe unique */
      if (up.error && /exist|duplicate|409/i.test((up.error.message || "") + " " + (up.error.statusCode || ""))) {
        path = path.replace(/(\.[a-z0-9]+)$/i, "-" + Date.now().toString(36) + "$1");
        up = await SB.storage.from(PHOTO_BUCKET).upload(path, prep.body, { contentType: prep.type });
      }
      if (up.error) { PHOTO_ERR = "Photo non envoyée (" + (up.error.message || "erreur inconnue") + "). Vérifie que le bucket « photos » existe dans Supabase et que ses droits l’autorisent."; toast("Photo non envoyée"); break; }
      const row = { path };
      if (kind === "modele" || kind === "modcol") { row.appareil_base_id = baseOfKey(kind, id); if (kind === "modcol") row.couleur = colKey(id).nom; }
      else row[kind === "dossier" ? "dossier_id" : "device_id"] = id;
      const ins = await SB.from("photos").insert(row);
      if (ins.error) {
        await SB.storage.from(PHOTO_BUCKET).remove([path]);
        PHOTO_ERR = kind === "modele"
          ? "Photo non enregistrée : la colonne « appareil_base_id » manque dans la table « photos ». Dans Supabase (SQL), exécute : alter table photos add column appareil_base_id uuid references appareils_base(id) on delete cascade;"
          : /column/i.test(ins.error.message || "")
            ? "Photo non enregistrée : une colonne manque dans la table « photos ». Dans Supabase (SQL), exécute : " + PHOTOS_SQL
            : "Photo envoyée mais non enregistrée (" + (ins.error.message || "erreur inconnue") + "). Vérifie la table « photos » et ses droits.";
        toast("Photo non enregistrée"); break;
      }
    }
    await reloadPhotos();
  }
  if (!PHOTO_ERR) PH_ADD[kind + ":" + id] = false;
  CLI_NOANIM = true;
  input.value = "";
  refreshPhotos(kind, id);
}
async function delPhoto(pid, kind, id){
  if (!confirm("Supprimer cette photo ?")) return;
  const p = (S.photos || []).find(x => x.id === pid);
  if (p && !(await photoSupprimer(p))) { refreshPhotos(kind, id); return; }
  else S.photos = (S.photos || []).filter(x => x.id !== pid);
  if (!DEMO) await reloadPhotos();
  refreshPhotos(kind, id);
}
/* Retire la photo de la table « photos » (et du stockage). Renvoie true si la base l’a bien supprimée. */
var AB_ERR = ""; /* dernier refus de suppression, affiché dans la fiche tant qu’il n’est pas réglé */
var AB_MSG = ""; /* résultat de la dernière suppression (réussite ou détail) */
async function photoSupprimer(p){
  AB_ERR = ""; AB_MSG = "";
  if (DEMO) { S.photos = (S.photos || []).filter(x => x.id !== p.id); AB_MSG = "Photo supprimée (aperçu)."; return true; }
  const del = await SB.from("photos").delete().eq("id", p.id).select();
  if (del.error) { AB_ERR = "Photo non supprimée (base) : " + msgErr(del.error); toast(AB_ERR); return false; }
  if (!del.data || !del.data.length) { AB_ERR = "Photo non supprimée : la base a refusé la suppression (photo " + p.id + "). Vérifie les droits de suppression (RLS) sur la table « photos » dans Supabase."; toast(AB_ERR); return false; }
  const chk = await SB.from("photos").select("id").eq("id", p.id); /* vérification : la ligne ne doit plus exister */
  if (chk.data && chk.data.length) { AB_ERR = "La base annonce la suppression, mais la ligne existe encore (photo " + p.id + "). Préviens-moi avec ce texte."; toast(AB_ERR); return false; }
  S.photos = (S.photos || []).filter(x => x.id !== p.id);
  const st = await SB.storage.from(PHOTO_BUCKET).remove([p.path]);
  if (st.error) { AB_ERR = "Ligne retirée de la base, mais le fichier n’a pas été effacé (stockage) : " + msgErr(st.error); toast(AB_ERR); }
  else AB_MSG = "Photo supprimée : ligne retirée de la base et fichier effacé du stockage.";
  return true;
}

/* Glisser pour réordonner (souris ou doigt). L’ordre est enregistré à la fin du glissement. */
var GAL_DRAG = null, GAL_JUST = false;
document.addEventListener("pointerdown", e => {
  if (ROLE !== "rep" || e.button > 0) return;
  const t = e.target.closest && e.target.closest(".gal-cell[data-pid]");
  if (!t || e.target.closest(".gal-del")) return;
  GAL_DRAG = {el: t, grid: t.parentElement, x: e.clientX, y: e.clientY, moved: false};
});
/* La photo suit le doigt ; une case vide (emplacement) se déplace dans la grille à la place */
function galDemarre(d){
  const r = d.el.getBoundingClientRect();
  d.rect = r;
  const ph = document.createElement("div");
  ph.className = "gal-ph";
  ph.style.cssText = "width:" + r.width + "px;height:" + r.height + "px;border-radius:10px;border:2px dashed var(--line);box-sizing:border-box";
  d.grid.insertBefore(ph, d.el); d.ph = ph;
  const el = d.el;
  el.style.position = "fixed"; el.style.left = r.left + "px"; el.style.top = r.top + "px";
  el.style.width = r.width + "px"; el.style.height = r.height + "px"; el.style.margin = "0";
  el.style.pointerEvents = "none"; el.style.zIndex = "1000";
  document.body.appendChild(el);
  galLift(el, true);
}
document.addEventListener("pointermove", e => {
  if (!GAL_DRAG) return;
  if (!GAL_DRAG.moved) {
    if (Math.hypot(e.clientX - GAL_DRAG.x, e.clientY - GAL_DRAG.y) < 6) return;
    GAL_DRAG.moved = true;
    galDemarre(GAL_DRAG);
  }
  e.preventDefault();
  GAL_DRAG.el.style.transform = "translate(" + (e.clientX - GAL_DRAG.x) + "px,0px)"; /* mouvement horizontal seulement */
  galSurvol(e.clientX);
});
/* Place l’emplacement à côté de la photo survolée, sur la même ligne.
   Anti-tremblement : on ne réordonne qu’après avoir dépassé le milieu de la voisine, et une courte pause suit chaque déplacement. */
function galSurvol(x){
  const d = GAL_DRAG; if (!d || !d.ph) return;
  const now = performance.now(); if (d.calme && now < d.calme) return;
  const grid = d.grid, ph = d.ph, rp = ph.getBoundingClientRect();
  const surLigne = [...grid.querySelectorAll(".gal-cell[data-pid]")].filter(c => Math.abs(c.getBoundingClientRect().top - rp.top) < 20);
  const tgt = surLigne.find(c => { const r = c.getBoundingClientRect(); return x >= r.left && x <= r.right; });
  if (!tgt) return;
  const kids = [...grid.children];
  const phAvant = kids.indexOf(ph) < kids.indexOf(tgt);
  /* déclenchement après un quart de la photo voisine (plus tôt que le milieu, sans tremblement) */
  const r = tgt.getBoundingClientRect(), seuil = phAvant ? r.left + r.width * 0.25 : r.right - r.width * 0.25;
  if (phAvant && x < seuil) return;
  if (!phAvant && x > seuil) return;
  const avant = galRects(grid);
  if (phAvant) grid.insertBefore(ph, tgt.nextSibling);
  else grid.insertBefore(ph, tgt);
  galFlip(grid, avant);
  d.calme = now + 100;
}
/* Effet visuel : la photo soulevée est agrandie et ombrée, le curseur devient une main qui tient */
function galLift(el, on){
  el.style.transition = "scale .18s, box-shadow .18s";
  el.style.scale = on ? "1.06" : "";
  el.style.boxShadow = on ? "0 12px 28px rgba(0,0,0,.28)" : "";
  el.style.zIndex = on ? "1000" : "";
  document.body.style.cursor = on ? "grabbing" : "";
}
function galRects(grid){
  const m = new Map();
  grid.querySelectorAll(".gal-cell[data-pid]").forEach(c => m.set(c, c.getBoundingClientRect()));
  return m;
}
/* Les autres photos glissent vers leur nouvelle place */
function galFlip(grid, avant){
  grid.querySelectorAll(".gal-cell[data-pid]").forEach(c => {
    const a = avant.get(c); if (!a) return;
    const b = c.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    c.style.transition = "none";
    c.style.transform = "translate(" + dx + "px," + dy + "px)";
    c.offsetWidth;
    c.style.transition = "transform .25s cubic-bezier(.2,.8,.2,1)";
    c.style.transform = "";
  });
}
function galEnd(save){
  const d = GAL_DRAG; GAL_DRAG = null;
  if (d && d.defT) clearInterval(d.defT);
  if (!d || !d.moved) return;
  GAL_JUST = true; setTimeout(() => { GAL_JUST = false; }, 300);
  const el = d.el, ph = d.ph;
  const depart = el.getBoundingClientRect();
  ph.parentNode.insertBefore(el, ph); ph.remove();
  el.style.position = ""; el.style.left = ""; el.style.top = ""; el.style.width = ""; el.style.height = "";
  el.style.margin = ""; el.style.pointerEvents = ""; el.style.transform = "";
  const arrivee = el.getBoundingClientRect();
  galLift(el, false);
  el.style.transition = "none";
  el.style.transform = "translate(" + (depart.left - arrivee.left) + "px," + (depart.top - arrivee.top) + "px)";
  el.offsetWidth;
  el.style.transition = "transform .2s cubic-bezier(.2,.8,.2,1), scale .18s, box-shadow .18s";
  el.style.transform = "";
  if (!save) { refreshPhotos(d.grid.dataset.galKind, d.grid.dataset.galId); return; }
  const pids = [...d.grid.querySelectorAll(".gal-cell[data-pid]")].map(c => c.dataset.pid);
  galSaveOrder(d.grid.dataset.galKind, d.grid.dataset.galId, pids);
}

function valNum(id, fallback){

}
function updateReste(){
  const d = S.dossiers.find(x => x.id === DOSSIER), box = $("resteBox");
  if (!d || !box) return;
  const pEl = $("dPx");
  const prix = pEl ? (pEl.value.trim() === "" ? null : valNum("dPx", 0)) : d.prix;
  if (prix == null) { box.textContent = "Prix à définir"; box.style.color = ""; return; }
  const splits = valNum("dAcoE", 0) + valNum("dAcoV", 0);
  const aco = splits > 0 ? splits : acoNonReparti(d);
  const rep = valNum("dRep", +d.reprise_montant || 0);
  const paye = valNum("pV", +d.paye_virement || 0) + valNum("pE", +d.paye_especes || 0) + aco;
  const reste = Math.max(0, prix - rep - paye), trop = Math.max(0, paye + rep - prix);
  box.textContent = "Prix : " + eur(prix) + (rep > 0 ? " · Reprise : " + eur(rep) : "") + " · Reste : " + eur(reste) + (trop > 0 ? " · Trop perçu : " + eur(trop) : "");
  box.style.color = trop > 0 ? "var(--bad)" : reste === 0 ? "#1f8a4c" : "";
}
function paintDetail(){

/* Barre entre le dépôt et la date de remise : vert = jours passés, gris = jours restants */
function dateBarHtml(d, legend){
  if (!d.echeance) return "";
  const debut = d.date_recup || String(d.created_at || "").slice(0, 10);
  if (!debut) return "";
  const start = new Date(debut + "T00:00");
  const end = new Date(d.echeance + "T00:00"), now = new Date(todayIso() + "T00:00");
  const total = Math.max(1, Math.round((end - start) / 86400000));
  const passed = Math.min(total, Math.max(0, Math.round((now - start) / 86400000)));
  const pct = Math.round(passed / total * 100);
  const restants = Math.max(0, total - passed) + ' j restants';
  const barre = '<div style="height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px"><div style="height:100%;width:' + pct + '%;background:#1f8a4c"></div></div>';
  if (typeof legend === "string" || legend === true) {
    // carte de la liste : le texte est placé sous la barre
    return '<div style="margin-top:10px">' + barre + '<div class="m" style="margin-top:4px">' + (typeof legend === "string" ? legend : restants) + '</div></div>';
  }
  // page détail : légende complète au-dessus de la barre
  const complet = passed + ' j passés · ' + restants;
  return '<div style="margin-top:10px"><div class="m">' + complet + '</div>' + barre + '</div>';
}
async function fSave(field, value){
  const d = S.dossiers.find(x => x.id === DOSSIER);
  if (!d) return;
  let v = value;
  if (field === "panne") {
    v = String(value).trim();
    if (!v) { toast("Donne un nom à la réparation."); $("dNom").value = d.panne || ""; return; }
  } else if (field === "prix") {
    const t = String(value).trim().replace(",", ".");
    if (t !== "" && isNaN(parseFloat(t))) { toast("Prix invalide."); return; }
    v = t === "" ? null : parseFloat(t);
  } else if (field === "duree") {
    v = durNorm(value);
  } else if (["acompte", "acompte_especes", "acompte_virement", "paye_virement", "paye_especes", "reprise_montant"].includes(field)) {
    const t = parseFloat(String(value || "0").replace(",", "."));
    if (isNaN(t) || t < 0) { toast("Montant invalide."); return; }
    v = t;
  } else {
    v = value || null;
  }
  if (field === "date_recup" && v && d.echeance && v > d.echeance) {
    toast("La date de dépôt ne peut pas être après la date de remise.");
    if ($("dRecup")) $("dRecup").value = d.date_recup || "";
    return;
  }
  if (field === "echeance" && v && d.date_recup && v < d.date_recup) {
    toast("La date de remise ne peut pas être avant la date de dépôt.");
    if ($("dEc")) $("dEc").value = d.echeance || "";
    return;
  }
  const upd = {[field]: v};
  if (field === "date_termine") upd.date_retour = v ? plus30(v) : null;
  if (["acompte_especes", "acompte_virement"].includes(field)) {
    upd.acompte = (+(field === "acompte_especes" ? v : d.acompte_especes) || 0) + (+(field === "acompte_virement" ? v : d.acompte_virement) || 0);
  }
  const tmp = Object.assign({}, d, upd);
  if (["prix", "acompte", "acompte_especes", "acompte_virement", "paye_virement", "paye_especes", "reprise_montant"].includes(field)) upd.paye = tmp.prix != null && payInfo(tmp).reste === 0;
  const { error } = await SB.from("dossiers").update(upd).eq("id", d.id);
  if (error) { toast(msgErr(error)); return; }
  Object.assign(d, upd);
  paintDetail();
  flash("Enregistré ✓");
}
async function setStatut(st){
  const d = S.dossiers.find(x => x.id === DOSSIER), sel = $("dSt");
  const fail = msg => { sel.value = d.statut; toast(msg); };
  if (st === d.statut) return;
  if (st !== "Devis en cours") {
    if (d.statut === "Devis en cours" && !devisOk(d)) return fail("Renseigne la date de dépôt, le prix et la durée avant de quitter le devis.");
    if (pcs(d.id).some(p => p.statut !== "Réservée")) return fail("Impossible : toutes les pièces doivent être réservées.");
  }
  if (st === "Remis") {
    if (!d.echeance) return fail("Renseigne la date « Remis le » avant de passer en Remis.");
    if (payInfo(d).reste !== 0) return fail("Le paiement doit être complet avant de passer en Remis.");
  }
  const date_termine = st === "Terminé" ? (d.date_termine || todayIso()) : null;
  const date_retour = date_termine ? plus30(date_termine) : null;
  const { error } = await SB.from("dossiers").update({statut: st, date_termine, date_retour}).eq("id", d.id);
  if (error) return fail(msgErr(error));
  // pièces réservées : retirées de la réservation quand la réparation est Terminé/Remis (le stock n'est pas rendu)
  const wasFinal = ["Terminé", "Remis"].includes(d.statut), isFinal = ["Terminé", "Remis"].includes(st);
  if (wasFinal !== isFinal) {
    for (const p of pcs(d.id)) {
      if (p.statut !== "Réservée" || !p.sku) continue;
      const s2 = S.stock.find(x => x.sku === p.sku); if (!s2) continue;
      const r = await SB.from("stock").update({ res: Math.max(0, s2.res + (isFinal ? -p.qte : p.qte)) }).eq("sku", s2.sku);
      if (r.error) toast(msgErr(r.error));
    }
  }
  flash("Enregistré ✓");
  await reload();
}

async function applyPst(p, v){

  if (v === "Réservée" && p.statut !== "Réservée") {
    if (!st) return "Cette pièce n’a pas de SKU en stock : réservation impossible.";
    if (st.qte < p.qte) return "Stock insuffisant : " + st.qte + " disponible(s), " + p.qte + " nécessaire(s).";
    const r = await SB.from("stock").update({ qte: st.qte - p.qte, res: st.res + p.qte }).eq("sku", st.sku);
    if (r.error) return msgErr(r.error);
  } else if (p.statut === "Réservée" && v !== "Réservée" && st) {
    const r = await SB.from("stock").update({ qte: st.qte + p.qte, res: st.res - p.qte }).eq("sku", st.sku);

}

/* Prix HT / TTC d’une pièce de réparation. TTC = HT × 1,20 */
const PIECE_TVA = 1.2;
const pnumP = x => { const v = parseFloat(String(x).replace(",", ".")); return isNaN(v) ? null : v; };
const roundP = v => Math.round(v * 100) / 100;

var STK_Q = "", STK_SORT = "nom", STK_TYPE = "", STK_ST = "", STK_MQ = "", STK_MO = "", STK_ADD = false;

function selOpts(pairs, cur){ return pairs.map(p => '<option value="' + esc(p[0]) + '"' + (String(p[0]) === String(cur) ? ' selected' : '') + '>' + esc(p[1]) + '</option>').join(""); }
/* Une pièce peut avoir plusieurs modèles « Type · Marque · Modèle » */
function stkPartsOf(s){
  const ms = s.modeles && s.modeles.length ? s.modeles : (s.modele ? [s.modele] : []);
  return ms.map(m => { const a = String(m).split(" · "); return a.length >= 3 ? {t: a[0], m: a[1], mo: a.slice(2).join(" · ")} : {t: s.type || "", m: "", mo: String(m)}; });
}
/* Listes en cascade : type → marque → modèle */
function stkListes(){
  const fr = (a, b) => a.localeCompare(b, "fr");
  const types = [...new Set(S.stock.map(s => s.type).filter(Boolean))].sort(fr);
  const dans = S.stock.filter(s => !STK_TYPE || s.type === STK_TYPE);
  const marques = [...new Set(dans.flatMap(s => stkPartsOf(s).map(p => p.m)).filter(Boolean))].sort(fr);
  const modeles = [...new Set(dans.flatMap(s => stkPartsOf(s).filter(p => !STK_MQ || p.m === STK_MQ).map(p => p.mo)).filter(Boolean))].sort(fr);
  return {types, marques, modeles};
}

var STK_W = null;
function stkLoadW(){
  if (STK_W) return;
  try { const v = JSON.parse(localStorage.getItem("sv_stk_w") || "null"); if (Array.isArray(v) && v.length === 5) STK_W = v; } catch (e) {}
}
function stkApplyW(){
  if (STK_W) document.documentElement.style.setProperty("--stk-cols", STK_W.map(w => Math.round(w) + "px").join(" ") + " 300px");
  else document.documentElement.style.removeProperty("--stk-cols");
}
function stkResize(e, i){
  e.preventDefault(); e.stopPropagation();
  if (!STK_W) STK_W = [...document.querySelector(".stk-head").children].slice(0, 5).map(c => c.getBoundingClientRect().width);
  const x0 = e.clientX, start = STK_W.slice();
  const move = ev => { STK_W[i] = Math.max(60, start[i] + ev.clientX - x0); stkApplyW(); };
  const up = () => {
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
    try { localStorage.setItem("sv_stk_w", JSON.stringify(STK_W)); } catch (err) {}
    render();
  };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
}
function stkResetW(){
  STK_W = null;
  try { localStorage.removeItem("sv_stk_w"); } catch (e) {}
  stkApplyW(); render();
}

async function addStock(){

  const max = S.stock.reduce((t, s) => Math.max(t, parseInt(String(s.sku).replace(/\D/g, ""), 10) || 0), 1000);
  const { error } = await SB.from("stock").insert({ sku: "PC-" + (max + 1), nom, type: typeOf(modeles), modeles, modele: modeles.join(", "), qte: q, res: 0 });

async function adjStock(sku, d){

}
async function seedPuces(){

  let max = S.stock.reduce((t, s) => Math.max(t, parseInt(String(s.sku).replace(/\D/g, ""), 10) || 0), 5000);
  PUCES.forEach(([nom, modele]) => {
    if (!S.stock.some(s => s.nom === nom)) {
      const cle = "Console · Nintendo · " + modele;
      if (!(S.appBase || []).some(x => abKey(x) === abKey({type: "Console", marque: "Nintendo", modele: modele}))) base.push({type: "Console", marque: "Nintendo", modele: modele});
      rows.push({ sku: "PC-" + (++max), nom, type: "Console", modeles: [cle], modele: cle, qte: 0, res: 0 });
    }
  });

  if (base.length) { const { error: eb } = await SB.from("appareils_base").insert(base); if (eb) return toast(msgErr(eb)); }

function makeDemoSB(){
  const KEY = {pieces_dossier: "pieces", stock_appareils: "stockApp", invitations: "inv", appareils_base: "appBase"};
  const clone = x => JSON.parse(JSON.stringify(x));
  let seq = 0;
  const store = t => { const k = KEY[t] || t; if (!Array.isArray(S[k])) S[k] = []; return S[k]; };
  const from = table => {
    let op = "select", payload = null, one = false;
    const filters = [];
    const run = () => {
      const rows = store(table), match = r => filters.every(f => f(r));
      let data = [];
      if (op === "select") data = rows.filter(match).map(clone);
      else if (op === "insert") data = payload.map(p => { const r = Object.assign({id: "demo-" + (++seq)}, p); rows.push(r); return clone(r); });
      else if (op === "update") rows.filter(match).forEach(r => { Object.assign(r, payload); data.push(clone(r)); });
      else if (op === "delete") { data = rows.filter(match).map(clone); for (let i = rows.length - 1; i >= 0; i--) if (match(rows[i])) rows.splice(i, 1); }
      if (one) data = data[0] || null;
      return Promise.resolve({data, error: null});
    };
    const b = {
      select(){ return b; },
      order(){ return b; },
      eq(col, val){ filters.push(r => r[col] === val); return b; },
      insert(rows){ op = "insert"; payload = Array.isArray(rows) ? rows : [rows]; return b; },
      update(p){ op = "update"; payload = p; return b; },
      delete(){ op = "delete"; return b; },
      single(){ one = true; return b; },
      maybeSingle(){ one = true; return b; },
      then(ok, ko){ return run().then(ok, ko); }
    };
    return b;
  };
  return {
    from,
    auth: {getSession: async () => ({data: {session: null}}), signOut: async () => ({error: null})},
    rpc: async () => ({data: null, error: {message: "Action indisponible dans l’aperçu"}})
  };
}

    n++;
  }
  toast(n + " ligne(s) retirée(s)");
  DBA.lock = true;
  await dbaLoad();
}
async function dbaGalDel(pid){
  if (DBA.lock) return;
  const p = (DBA.rows || []).find(x => x.id === pid); if (!p) return;
  if (!confirm("Supprimer définitivement cette photo ? Elle disparaît de la base et du stockage.")) return;
  if (!(await photoSupprimer(p))) { DBA.err = AB_ERR; render(); return; }
  DBA.err = ""; toast("Photo supprimée");
  DBA.lock = true;
  await dbaLoad();
}
/* Client connecté sans fiche : code d’invitation facultatif, sinon ses informations créent sa fiche. */
async function completeNow(){
  const err = $("cErr2"); err.textContent = "";
  const code = $("cCode").value.trim();
  if (code) {
    if (!/^\d{6}$/.test(code)) { err.textContent = "Le code doit comporter 6 chiffres."; return; }
    const { error } = await SB.rpc("claim_invitation", { p_code: code });
    if (error) { err.textContent = /code_invalide/.test(error.message) ? "Code invalide ou déjà utilisé." : "Erreur : " + error.message; return; }
    return boot();
  }
  const v = id => $(id).value.trim();
  const d = {prenom: v("bP"), nom: v("bN"), tel: v("bT"), adr: v("bA"), cp: v("bCp"), ville: v("bV")};
  if (!d.prenom || !d.nom || !d.tel || !d.adr || !d.cp || !d.ville) { err.textContent = "Tous les champs marqués * sont obligatoires, ou entre un code d’invitation."; return; }
  if (!/^[0-9+ .\-]{6,20}$/.test(d.tel)) { err.textContent = "Le téléphone ne doit contenir que des chiffres."; return; }
  if (!/^\d{5}$/.test(d.cp)) { err.textContent = "Le code postal doit comporter 5 chiffres."; return; }
  const { data: u } = await SB.auth.getUser();
  const { error: ie } = await SB.from("clients").insert({ ...d, mail: u.user.email, auth_user_id: u.user.id });
  if (ie) { err.textContent = ie.code === "23505" ? "Un client existe déjà avec ce téléphone ou cet email. Contacte ton réparateur." : msgErr(ie); return; }
  await boot();
}
