<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon avis · Seconde Vie</title>
<style>
:root{--bg:#f2f4f1;--surf:#fff;--ink:#17261f;--mut:#5d6b64;--line:#dfe4e0;--brand:#1f4d3f;--bad:#b3261e;--ok:#22703f;--star:#f5a623}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 60px}
.logo{display:block;height:34px;margin:6px auto 18px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 16px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
label{display:block;font-weight:600;margin:16px 0 8px}
select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;font:inherit;color:var(--ink)}
textarea{resize:vertical;min-height:90px}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;padding:2px;cursor:pointer;font-size:34px;line-height:1;color:#d8ddd8;transition:transform .08s}
.stars button:hover{transform:scale(1.1)}
.stars button.on{color:var(--star)}
.row-check{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:14px;color:var(--mut)}
.row-check input{width:20px;height:20px;margin:1px 0 0;flex:none}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--brand);color:#fff;font-size:16px;font-weight:600;padding:15px;margin-top:20px;cursor:pointer}
.btn[disabled]{opacity:.5}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.msg{text-align:center;color:var(--mut);padding:30px 0}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:18px}
.ok-flash{color:var(--ok);font-weight:600;text-align:center;margin-top:12px}
.dev-line{font-weight:600}
.small{font-size:13px;color:var(--mut)}
a{color:var(--brand)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="logo.png" alt="Seconde Vie" onerror="this.style.display='none'">
  <div id="root"><div class="msg">Chargement…</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
const SB = window.supabase.createClient("https://bagucelglclcssoclyaw.supabase.co", "sb_publishable_AMjguQV7hN0iXFLhhUhIiw_kgsK9B3O");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const PARAM = new URLSearchParams(location.search);
let ME = null, CLIENT = null, DOSSIERS = [], AVIS = {}, SEL = null, NOTES = { note: 0, note_delai: 0, note_qualite: 0 };

function etoiles(cle, val) {
  let h = '<div class="stars" data-k="' + cle + '">';
  for (let i = 1; i <= 5; i++) h += '<button type="button" onclick="setNote(\'' + cle + '\',' + i + ')" class="' + (i <= val ? "on" : "") + '">★</button>';
  return h + "</div>";
}
function setNote(cle, v) {
  NOTES[cle] = NOTES[cle] === v ? 0 : v;
  const box = document.querySelector('.stars[data-k="' + cle + '"]');
  if (box) [...box.children].forEach((b, i) => b.classList.toggle("on", i < NOTES[cle]));
}

function devTexte(d) {
  return (d.appareil || "Appareil") + (d.panne ? " · " + d.panne : "");
}

function dessiner() {
  if (!ME) {
    $("root").innerHTML = '<div class="card"><h1>Connecte-toi d\'abord</h1><p class="sub">Ouvre ton espace client, puis reviens sur cette page pour laisser ton avis.</p><a class="btn" href="index.html">Aller à mon espace</a></div>';
    return;
  }
  if (!DOSSIERS.length) {
    $("root").innerHTML = '<div class="card"><h1>Aucune réparation à évaluer</h1><p class="sub">Tu pourras laisser un avis dès qu\'une de tes réparations sera terminée.</p><a class="btn ghost" href="index.html">Retour à mon espace</a></div>';
    return;
  }
  const options = DOSSIERS.map((d) => '<option value="' + d.id + '"' + (d.id === SEL ? " selected" : "") + ">" + esc(devTexte(d)) + "</option>").join("");
  const dv = DOSSIERS.find((d) => d.id === SEL) || DOSSIERS[0];
  const existe = AVIS[SEL];
  $("root").innerHTML =
    '<div class="card"><h1>' + (existe ? "Modifier mon avis" : "Laisser un avis") + "</h1>" +
    '<p class="sub">Ton avis aide d\'autres clients et nous aide à nous améliorer.</p>' +
    (DOSSIERS.length > 1 ? '<label>Réparation concernée</label><select id="selD" onchange="choisir(this.value)">' + options + "</select>" : '<div class="dev-line">' + esc(devTexte(dv)) + "</div>") +
    '<label>Note globale</label>' + etoiles("note", NOTES.note) +
    '<label>Le délai de réparation était-il conforme ?</label>' + etoiles("note_delai", NOTES.note_delai) +
    '<label>Qualité de la réparation</label>' + etoiles("note_qualite", NOTES.note_qualite) +
    '<label>Commentaire (facultatif)</label><textarea id="com" placeholder="Raconte ton expérience…">' + esc(existe ? existe.commentaire || "" : "") + "</textarea>" +
    '<label class="row-check"><input type="checkbox" id="pub"' + (existe ? (existe.affichage_ok ? " checked" : "") : " checked") + "> J'accepte que mon avis (prénom et première lettre du nom) soit affiché publiquement.</label>" +
    '<div class="err" id="err"></div>' +
    '<button class="btn" id="save" onclick="enregistrer()">' + (existe ? "Mettre à jour mon avis" : "Envoyer mon avis") + "</button>" +
    '<a class="btn ghost" href="index.html">Retour à mon espace</a>' +
    "</div>";
}

function choisir(id) {
  SEL = id;
  const a = AVIS[id];
  NOTES = { note: a ? a.note || 0 : 0, note_delai: a ? a.note_delai || 0 : 0, note_qualite: a ? a.note_qualite || 0 : 0 };
  dessiner();
}

async function enregistrer() {
  const err = $("err"); err.textContent = "";
  if (!NOTES.note) { err.textContent = "Mets au moins une note globale (les étoiles)."; return; }
  const btn = $("save"); btn.disabled = true;
  const row = {
    dossier_id: SEL,
    client_id: CLIENT.id,
    note: NOTES.note,
    note_delai: NOTES.note_delai || null,
    note_qualite: NOTES.note_qualite || null,
    commentaire: $("com").value.trim() || null,
    affichage_ok: $("pub").checked
  };
  const { error } = await SB.from("avis").upsert(row, { onConflict: "dossier_id" });
  if (error) { err.textContent = error.message || "Enregistrement impossible."; btn.disabled = false; return; }
  AVIS[SEL] = row;
  $("root").innerHTML = '<div class="card"><h1>Merci !</h1><p class="sub">Ton avis a bien été enregistré. Tu peux le modifier à tout moment depuis ton espace.</p><a class="btn" href="index.html">Retour à mon espace</a><button class="btn ghost" onclick="choisir(SEL)">Modifier encore</button></div>';
}

async function init() {
  const { data: { session } } = await SB.auth.getSession();
  if (!session) { ME = null; dessiner(); return; }
  ME = session.user;
  const { data: cl } = await SB.from("clients").select("id,prenom,nom").eq("auth_user_id", ME.id).maybeSingle();
  if (!cl) { DOSSIERS = []; dessiner(); return; }
  CLIENT = cl;
  const { data: ds } = await SB.from("dossiers").select("id,appareil,panne,statut,created_at").eq("client_id", cl.id).in("statut", ["Terminé", "Remis"]).order("created_at", { ascending: false });
  DOSSIERS = ds || [];
  const { data: av } = await SB.from("avis").select("*").eq("client_id", cl.id);
  (av || []).forEach((a) => (AVIS[a.dossier_id] = a));
  const voulu = PARAM.get("d");
  SEL = DOSSIERS.find((d) => d.id === voulu) ? voulu : (DOSSIERS[0] && DOSSIERS[0].id);
  if (SEL && AVIS[SEL]) NOTES = { note: AVIS[SEL].note || 0, note_delai: AVIS[SEL].note_delai || 0, note_qualite: AVIS[SEL].note_qualite || 0 };
  dessiner();
}
init();
</script>
</body>
</html>
