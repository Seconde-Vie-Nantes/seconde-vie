<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Réparations en cours</title>
<style>
  :root{
    --bg:#0f1412; --panel:#17201c; --line:#26332d; --ink:#f3f6f4; --mut:#9fb0a6;
    --prep:#f5a524; --pret:#34c77b; --bad:#e5484d; --chip:#22302a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--line)}
  header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
  .hdr-r{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:14px}
  .clock{font-size:26px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px}
  button:hover{border-color:#3b4b43}
  button.primary{background:var(--pret);border-color:var(--pret);color:#06140c;font-weight:700}
  main{flex:1;padding:18px 22px 150px}
  .hidden{display:none !important}

  /* Connexion */
  .carte{max-width:380px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
  .carte h2{margin:0 0 6px;font-size:20px}
  .carte p{color:var(--mut);margin:0 0 14px;font-size:15px;line-height:1.45}
  .carte label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
  .carte input{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0c110f;color:var(--ink)}
  .carte .btn-l{width:100%;margin-top:16px}
  .err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}

  /* Deux colonnes : en préparation / à récupérer */
  .colonnes{display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:60vh}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;min-width:0}
  .col-titre{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 4px 14px;border-bottom:2px solid var(--line);margin-bottom:12px}
  .col-titre h2{margin:0;font-size:24px;letter-spacing:1px;text-transform:uppercase}
  .col-titre .nb{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
  .col.prep .col-titre{border-bottom-color:var(--prep)}
  .col.prep .col-titre h2,.col.prep .nb{color:var(--prep)}
  .col.pret .col-titre{border-bottom-color:var(--pret)}
  .col.pret .col-titre h2,.col.pret .nb{color:var(--pret)}
  .liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-content:start}
  .item{background:#0c110f;border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
  .haut{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .app{font-size:21px;font-weight:700;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .sub{margin-top:5px;font-size:14px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--chip)}
  .vide{color:var(--mut);font-size:17px;padding:18px 4px}

  /* Bande du bas : à payer (4 réparations maximum, avec le total) */
  .bande{position:fixed;left:0;right:0;bottom:0;background:#0b100e;border-top:2px solid var(--bad);display:flex;align-items:center;gap:14px;padding:12px 18px;min-height:112px}
  .bande-total{flex:0 0 170px;display:flex;flex-direction:column;gap:2px}
  .bande-l{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:700}
  .bande-m{font-size:32px;font-weight:800;color:var(--bad);font-variant-numeric:tabular-nums;line-height:1.1}
  .bande-liste{flex:1;display:flex;gap:10px;min-width:0;flex-wrap:wrap}
  .bi{flex:1 1 130px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
  .bi-n{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bi-m{display:block;margin-top:3px;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  .bi.plus{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:15px;flex:0 0 90px}
  .bande-vide{color:var(--mut);font-size:16px;align-self:center}
  .alerte{color:var(--bad);font-size:13px}

  /* Verrouillage en paysage : en portrait, la page demande de tourner l’appareil */
  .tourner{display:none}
  @media (orientation: portrait){
    body > header, body > main, #bande{display:none !important}
    .tourner{display:flex;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;text-align:center;padding:28px;background:var(--bg)}
    .tourner-ico{font-size:64px;line-height:1;margin-bottom:14px}
    .tourner p{font-size:20px;color:var(--ink);margin:0}
  }

  @media (max-width:820px){
    .colonnes{grid-template-columns:1fr}
    .clock{font-size:20px}
    .liste{grid-template-columns:1fr 1fr}
    .col-titre h2{font-size:19px}
    .col-titre .nb{font-size:26px}
    .bande{flex-wrap:wrap;gap:8px 12px;padding:10px 12px}
    .bande-total{flex:1 1 100%;flex-direction:row;align-items:baseline;gap:12px}
    .bande-m{font-size:26px}
    .bi{flex:1 1 40%}
  }
</style>
</head>
<body>

<div id="tourner" class="tourner"><div><div class="tourner-ico" aria-hidden="true">⟳</div><p>Tourne l’appareil en mode paysage pour voir les réparations.</p></div></div>

<header>
  <h1>Réparations en cours</h1>
  <div class="hdr-r">
    <span class="clock" id="horloge">--:--</span>
    <span id="maj" class="hidden"></span>
    <button id="btnActu" class="hidden" onclick="charger()">Actualiser</button>
    <button id="btnOut" class="hidden" onclick="deconnexion()">Déconnexion</button>
  </div>
</header>

<main>
  <!-- Connexion -->
  <section id="vueLogin" class="carte hidden">
    <h2>Connexion</h2>
    <p>Réservé au compte réparateur.</p>
    <label for="lE">Email</label>
    <input id="lE" type="email" autocomplete="username">
    <label for="lP">Mot de passe</label>
    <input id="lP" type="password" autocomplete="current-password">
    <button class="primary btn-l" onclick="connexion()">Se connecter</button>
    <div class="err" id="lErr"></div>
  </section>

  <!-- Écran -->
  <section id="vueEcran" class="colonnes hidden">
    <div class="col prep">
      <div class="col-titre"><h2>En préparation</h2><span class="nb" id="nbPrep">0</span></div>
      <div class="liste" id="listePrep"></div>
    </div>
    <div class="col pret">
      <div class="col-titre"><h2>À récupérer</h2><span class="nb" id="nbPret">0</span></div>
      <div class="liste" id="listePret"></div>
    </div>
  </section>
</main>

<!-- Bande du bas : à payer -->
<div id="bande" class="bande hidden">
  <div class="bande-total">
    <span class="bande-l">À payer</span>
    <span class="bande-m" id="bandeTotal">0 €</span>
  </div>
  <div class="bande-liste" id="bandeListe"></div>
  <span id="erreur" class="alerte"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Même projet Supabase et même session que l’application principale (même site) */
const SB_URL = "https://bagucelglclcssoclyaw.supabase.co";
const SB_KEY = "sb_publishable_AMjguQV7hN0iXFLhhUhIiw_kgsK9B3O";
const SB = supabase.createClient(SB_URL, SB_KEY);

const STATUT_PREP = ["Devis en cours", "En cours"];
const STATUT_PRET = ["Terminé"];
const COLONNES = "id,appareil,panne,statut,created_at,echeance,date_termine,prix,acompte,paye_virement,paye_especes,reprise_montant";
const MAX_PAYER = 4;
let MINUTEUR = null, CANAL = null;

function esc(x){ return String(x == null ? "" : x).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function montrer(vue){
  for (const id of ["vueLogin","vueEcran"]) document.getElementById(id).classList.toggle("hidden", id !== vue);
  const actif = vue === "vueEcran";
  document.getElementById("bande").classList.toggle("hidden", !actif);
  document.getElementById("btnActu").classList.toggle("hidden", !actif);
  document.getElementById("btnOut").classList.toggle("hidden", vue === "vueLogin");
}
function depuis(dateStr){
  if (!dateStr) return "";
  const j = new Date(dateStr);
  return isNaN(j) ? "" : j.toLocaleDateString("fr-FR", {day:"2-digit", month:"2-digit"});
}
function euros(n){ return Number(n).toLocaleString("fr-FR", {minimumFractionDigits: 0, maximumFractionDigits: 2}) + " €"; }
/* Montant restant à payer, calculé comme dans l’application principale */
function resteAPayer(d){
  if (d.prix == null) return null;
  const tot = (+d.paye_virement || 0) + (+d.paye_especes || 0) + (+d.acompte || 0) + (+d.reprise_montant || 0);
  return Math.max(0, +d.prix - tot);
}
function tuile(d, pret){
  const tag = pret ? "Prêt" : (d.statut === "Devis en cours" ? "Devis à valider" : "En réparation");
  const date = pret ? (d.date_termine ? "Prêt depuis le " + depuis(d.date_termine) : "Prêt")
                    : (d.echeance ? "Prévu le " + depuis(d.echeance) : "Reçu le " + depuis(d.created_at));
  return '<div class="item">'
    + '<div class="haut"><span class="app" title="' + esc(d.appareil) + '">' + esc(d.appareil || "Appareil") + '</span></div>'
    + '<div class="sub" title="' + esc(d.panne) + '">' + esc(d.panne || "") + '</div>'
    + '<div class="sub">' + esc(date) + '</div>'
    + '<span class="tag">' + tag + '</span>'
    + '</div>';
}
function remplir(id, liste, pret, vide){
  const el = document.getElementById(id);
  el.innerHTML = liste.length ? liste.map(d => tuile(d, pret)).join("") : '<div class="vide">' + vide + '</div>';
}
/* Bande du bas : total de ce qui reste à payer, 4 réparations au plus */
function remplirBande(dus){
  const total = dus.reduce((s, x) => s + x.reste, 0);
  document.getElementById("bandeTotal").textContent = euros(total);
  const liste = document.getElementById("bandeListe");
  if (!dus.length) { liste.innerHTML = '<span class="bande-vide">Rien à payer</span>'; return; }
  let h = dus.slice(0, MAX_PAYER).map(x =>
    '<div class="bi"><span class="bi-n" title="' + esc(x.appareil) + '">' + esc(x.appareil || "Appareil") + '</span><span class="bi-m">' + euros(x.reste) + '</span></div>'
  ).join("");
  if (dus.length > MAX_PAYER) h += '<div class="bi plus">+ ' + (dus.length - MAX_PAYER) + ' autre' + (dus.length - MAX_PAYER > 1 ? 's' : '') + '</div>';
  liste.innerHTML = h;
}
function heure(){
  const n = new Date();
  document.getElementById("horloge").textContent = n.toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
}

async function estReparateur(uid){
  const { data, error } = await SB.from("repairers").select("user_id").eq("user_id", uid).maybeSingle();
  return !error && !!data;
}

async function init(){
  const { data } = await SB.auth.getSession();
  const session = data && data.session;
  if (!session) return montrer("vueLogin");
  /* Pas réparateur : on ne montre rien, le client est renvoyé vers son espace (sa session reste ouverte) */
  if (!(await estReparateur(session.user.id))) return location.replace("index.html");
  montrer("vueEcran");
  paysage();
  await charger();
  abonner();
  clearInterval(MINUTEUR);
  MINUTEUR = setInterval(charger, 15000);
}

/* Temps réel : dès qu’un dossier change, l’écran se met à jour (si la base envoie les changements) ; sinon, le rafraîchissement toutes les 15 s suffit */
function abonner(){
  if (CANAL) return;
  try {
    CANAL = SB.channel("reparations-en-cours")
      .on("postgres_changes", { event: "*", schema: "public", table: "dossiers" }, () => charger())
      .subscribe();
  } catch (e) { CANAL = null; }
}
/* Retour sur l’onglet ou réveil de la tablette : on recharge tout de suite */
document.addEventListener("visibilitychange", () => { if (!document.hidden) charger(); });

/* Mode paysage : demandé à l’appareil (possible sur Android ; iPhone et iPad ne l’acceptent pas depuis une page web).
   Dans les autres cas, l’écran demande de tourner l’appareil (voir la règle CSS « portrait ») */
async function paysage(){
  try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape"); } catch (e) {}
}

async function connexion(){
  const e = document.getElementById("lE").value.trim(), p = document.getElementById("lP").value;
  const err = document.getElementById("lErr");
  err.textContent = "";
  if (!e || !p) { err.textContent = "Email et mot de passe requis."; return; }
  const { error } = await SB.auth.signInWithPassword({ email: e, password: p });
  if (error) { err.textContent = "Connexion impossible : " + error.message; return; }
  document.getElementById("lP").value = "";
  init();
}

async function deconnexion(){
  clearInterval(MINUTEUR);
  await SB.auth.signOut();
  montrer("vueLogin");
}

async function charger(){
  const erreur = document.getElementById("erreur");
  erreur.textContent = "";
  const { data: sess } = await SB.auth.getSession();
  if (!sess || !sess.session) { clearInterval(MINUTEUR); return montrer("vueLogin"); }

  const [prep, pret] = await Promise.all([
    SB.from("dossiers").select(COLONNES).in("statut", STATUT_PREP).order("created_at", {ascending: true}),
    SB.from("dossiers").select(COLONNES).in("statut", STATUT_PRET).order("date_termine", {ascending: false})
  ]);
  const err = [prep, pret].find(r => r.error);
  if (err) {
    if (/JWT|auth|expired/i.test(err.error.message || "")) return montrer("vueLogin");
    erreur.textContent = "Chargement impossible : " + err.error.message;
  }

  const listePrep = prep.data || [], listePret = pret.data || [];
  remplir("listePrep", listePrep, false, "Rien en préparation");
  remplir("listePret", listePret, true, "Rien à récupérer");
  document.getElementById("nbPrep").textContent = listePrep.length;
  document.getElementById("nbPret").textContent = listePret.length;

  /* À payer : seulement les réparations terminées (« À récupérer ») qui ont un prix et un reste */
  const dus = listePret
    .map(d => ({ ...d, reste: resteAPayer(d) }))
    .filter(d => d.reste != null && d.reste > 0);
  remplirBande(dus);
  /* L’espace du bas s’adapte à la hauteur réelle de la bande (tablette en portrait, téléphone) */
  document.querySelector("main").style.paddingBottom = (document.getElementById("bande").offsetHeight + 24) + "px";

  const maj = new Date().toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
  const el = document.getElementById("maj");
  el.textContent = "Mis à jour " + maj;
  el.classList.remove("hidden");
  heure();
}

setInterval(heure, 1000);
heure();
init();
</script>
</body>
</html>
